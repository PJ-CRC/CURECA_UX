<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>레이아웃 구조</title>
<style>
/* 실제 화면(1920 × 1031 기준)에서 잰 영역을 0.6배로 그린 와이어프레임. ?n=1..9 로 하나씩 */
:root{ --s:0.6; --ink:#1f2f4a; --muted:#8a8f98; --line:#e8e8e8; --block:#f0f0f0; --bg:#f4f4f4; --hi:#fdf1e6; }
*{box-sizing:border-box;margin:0}
body{background:#fff;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink)}
.cap{height:44px;padding:12px 16px;font-size:16px;font-weight:700;border-bottom:1px solid var(--line)}
.cap small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.fr{position:relative;background:var(--bg);overflow:hidden}
.b{position:absolute;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;line-height:1.5;padding:4px;word-break:keep-all}
.b.g{background:var(--block);border-color:transparent}
.b.d{background:transparent;border:1px dashed #cfd3da}
.b.t{background:transparent;border:0;justify-content:flex-start;color:var(--ink);font-weight:700;font-size:15px;padding:0}
.side{position:absolute;left:0;top:0;bottom:0;background:#fff;border-right:1px solid var(--line)}
.side .brand{position:absolute;left:12px;top:14px;font-weight:700;font-size:14px}
.side i{position:absolute;left:12px;right:12px;border-radius:6px;background:var(--block)}
.side i.on{background:var(--hi)}
.side .sc{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12.5px;color:var(--muted)}
.gnb{position:absolute;top:0;right:0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding-left:16px;font-weight:700;font-size:14px}
.gnb span{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:8px}
</style>
</head>
<body>
<div id="root"></div>
<script>
var S = 0.6, W = 1920;
/* [x, y, w, h, '이름<br>크기', 종류(''|g 회색|d 점선|t 제목글자)] — 프레임 좌표(px) */
var L = {
  1: { name: '대시보드', from: 'Dashboard', h: 1031, title: false, boxes: [
    [246, 65, 1190, 146, '요약 지표 카드 (KPI 4개)<br>높이 146px'],
    [246, 227, 1190, 276, '진행 현황 패널<br>게이지 + 공정별 진행'],
    [246, 519, 1190, 496, '장비 상태 매트릭스<br>본문 가변 (1190px)'],
    [1456, 66, 432, 470, '필요 소모품<br>상태 칩 + 목록<br>우측 고정 432px'],
    [1456, 553, 432, 462, '폐기물 상태<br>상태 칩 + 목록']
  ]},
  2: { name: '목록 (테이블)', from: 'Tube Setting', h: 1031, title: true, boxes: [
    [249, 107, 1639, 68, '검색 · 필터 바 68px (입력 · Reset · Search)'],
    [249, 191, 1639, 56, '건수 · 일괄 작업 56px (Items · Add · Delete)'],
    [249, 263, 1639, 640, '테이블<br>헤더 정렬 · 행 상세 › · 본문 가변'],
    [776, 921, 512, 32, '페이지네이션', 'g']
  ]},
  3: { name: '목록 + 상세 패널', from: 'Assay Pack Setting', h: 1031, title: true, boxes: [
    [249, 107, 1639, 68, '검색 · 필터 바 68px'],
    [249, 191, 828, 56, '건수 · 일괄 작업'],
    [249, 263, 828, 624, '테이블<br>패널이 열리면 좁아짐 (828px)'],
    [407, 905, 512, 32, '페이지네이션', 'g'],
    [1077, 191, 811, 48, '패널 헤더 48px (제목 · 닫기)', 'g'],
    [1093, 252, 779, 673, '상세 내용 (스크롤)<br>섹션별 2 · 4열 항목<br>상세 패널 811px'],
    [1093, 937, 775, 44, '하단 버튼 (Delete · Save)', 'g']
  ]},
  4: { name: '상태 모니터링', from: 'Test Status', h: 1129, title: true, boxes: [
    [276, 159, 273, 216, '진행 게이지<br>273px 고정'],
    [575, 159, 1284, 95, '요약 수치 (진행 · 완료 · 실패 · 대기)'],
    [575, 264, 1284, 111, '공정별 진행률 (5단계)'],
    [247, 395, 300, 30, '목록 제목 (Batch List)', 't'],
    [276, 453, 273, 178, '배치 정보<br>273px'],
    [575, 459, 1266, 65, '배치 요약 수치'],
    [575, 534, 1266, 97, '배치 공정별 진행률'],
    [276, 660, 1565, 190, '배치 카드 반복 (같은 구조)', 'd'],
    [276, 866, 1565, 190, '배치 카드 반복', 'd']
  ]},
  5: { name: '탭 + 장비 매트릭스', from: 'Instrument', h: 1031, title: true, boxes: [
    [238, 113, 1638, 48, '탭 48px (Overview · 모듈별)', 'g'],
    [270, 185, 150, 780, '행 이름<br>연결 · 상태<br>도어 · 이벤트', 'g'],
    [430, 185, 500, 34, '그룹 헤더 (Prep System)', 'g'],
    [950, 185, 900, 34, '그룹 헤더 (Dx System)', 'g'],
    [430, 230, 1420, 735, '모듈 열 반복<br>이름 · 이미지 · View All · 상태 값'],
    [1180, 975, 690, 30, '범례 (연결 · 상태 색)', 'g']
  ]},
  6: { name: '탭 + 목록 · 상세 분할', from: 'Inventory', h: 1240, title: true, boxes: [
    [238, 119, 1001, 48, '탭 48px', 'g'],
    [242, 190, 447, 50, '상태 필터 칩 (부족 · 낮음 · 충분)', 'g'],
    [1610, 190, 230, 50, '새로고침 · 도움말', 'g'],
    [242, 263, 688, 765, '카테고리 카드 목록<br>(선택한 카드 강조)<br>좌측 688px'],
    [965, 263, 873, 919, '선택 항목 상세<br>위치별 수량 표<br>우측 873px']
  ]},
  7: { name: '카드 선택 (가이드)', from: 'Carrier Setup', h: 1031, title: true, boxes: [
    [268, 140, 900, 40, '안내 문구', 't'],
    [268, 227, 300, 545, '선택 카드<br>(이미지 버튼)<br>300px'],
    [589, 227, 300, 545, '선택 카드'],
    [910, 227, 300, 545, '선택 카드'],
    [1231, 227, 300, 545, '선택 카드'],
    [1552, 227, 300, 545, '선택 카드'],
    [268, 800, 1584, 72, '카드별 설명', 'g']
  ]},
  8: { name: '단계 진행 (스텝)', from: 'Carrier Setup (Socket into tray)', h: 1031, title: true, boxes: [
    [268, 150, 600, 36, '작업 제목', 't'],
    [268, 210, 1586, 43, '단계 표시 (STEP 1 · 2 · 3)', 'g'],
    [268, 326, 881, 486, '안내 이미지<br>881px'],
    [1222, 326, 640, 240, '작업 순서 안내 (번호 목록)'],
    [1227, 654, 599, 158, '진행 상태 카드<br>(채운 수 · 진행 막대)'],
    [1662, 952, 210, 44, '다음 · 완료 버튼', 'g']
  ]},
  9: { name: '차트 + 필터 패널', from: 'Test Analytics', h: 1031, title: true, boxes: [
    [264, 150, 1153, 40, '카드 제목 · 내보내기', 'g'],
    [264, 206, 1153, 78, '요약 표 (항목별 합계)'],
    [265, 332, 1150, 552, '차트<br>본문 가변 (1200px 카드)'],
    [290, 946, 1100, 41, '범례', 'g'],
    [1475, 160, 400, 120, '지표 선택 (탭 버튼)<br>우측 패널 440px'],
    [1475, 318, 400, 115, '기간 (일 · 월 · 날짜)'],
    [1475, 474, 400, 200, '범례 · 항목 선택'],
    [1475, 715, 400, 65, '보기 (차트 · 표)']
  ]}
};
var n = +(new URLSearchParams(location.search).get('n') || 1), d = L[n];
var px = function(v){ return Math.round(v * S) + 'px'; };
var h = '<div class="cap">' + n + '. ' + d.name + '<small>기준 화면: ' + d.from + ' · 1920 × ' + d.h + '</small></div>' +
  '<div class="fr" style="width:' + px(W) + ';height:' + px(d.h) + '">' +
  '<div class="side" style="width:' + px(218) + '"><span class="brand">로고</span>' +
  '<i style="top:' + px(76) + ';height:' + px(40) + '"></i>' +
  [130, 175, 220, 265, 310].map(function(y, i){ return '<i class="' + (i === 3 ? 'on' : '') + '" style="top:' + px(y) + ';height:' + px(26) + ';right:' + px(i % 2 ? 60 : 14) + '"></i>'; }).join('') +
  '<i style="top:auto;bottom:' + px(70) + ';height:' + px(52) + '"></i><span class="sc">사이드바 218px</span></div>' +
  '<div class="gnb" style="left:' + px(218) + ';height:' + px(48) + '">상단 상태바<span>48px · 장비 상태 · 이벤트</span></div>' +
  (d.title ? '<div class="b t" style="left:' + px(249) + ';top:' + px(60) + ';width:' + px(700) + ';height:' + px(34) + '">페이지 제목 34px</div>' : '') +
  (n >= 4 && n !== 5 && n !== 6 && n !== 9 ? '' : '') +
  d.boxes.map(function(b){ return '<div class="b ' + (b[5] || '') + '" style="left:' + px(b[0]) + ';top:' + px(b[1]) + ';width:' + px(b[2]) + ';height:' + px(b[3]) + '">' + b[4] + '</div>'; }).join('') +
  '</div>';
document.getElementById('root').innerHTML = h;
document.title = n + '. ' + d.name;
</script>
</body>
</html>
