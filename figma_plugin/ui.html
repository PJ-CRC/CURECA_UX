<style>
  :root { --ink: var(--figma-color-text, #1e1e1e); --ink-2: var(--figma-color-text-secondary, #6b6b6b); --line: var(--figma-color-border, #e6e6e6);
          --bg: var(--figma-color-bg, #fff); --ok: var(--figma-color-text-success, #14ae5c); --warn: var(--figma-color-text-warning, #b86200); --err: var(--figma-color-text-danger, #e03e1a); }
  * { box-sizing: border-box; }
  body { margin: 0; font: 11px/1.45 Inter, "Noto Sans KR", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  #box { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .st { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
  .sub { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub.warn { color: var(--warn); }
  .row { display: flex; align-items: center; gap: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
  label { display: flex; align-items: center; gap: 5px; cursor: pointer; flex: 1; white-space: nowrap; }
  label input { margin: 0; }
  button { font: inherit; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .45; cursor: default; }
</style>

<div id="box">
  <div class="st"><span id="dot" class="dot"></span><span id="conn">Workbench 서버 연결 중…</span></div>
  <div id="file" class="sub"></div>
  <div id="log" class="sub"></div>
  <div class="row">
    <label title="작업 페이지를 고치면 그 프레임 캡처를 Workbench로 자동으로 올립니다"><input id="autoShots" type="checkbox" checked> 자동 캡처</label>
    <button id="shotView" title="지금 화면에 보이는 프레임(최대 4개)을 캡처해 올립니다">캡처</button>
    <button id="catSend" title="이 파일의 페이지 · 지금 페이지의 프레임 목록을 Workbench로 다시 보냅니다">목록</button>
  </div>
</div>

<script>
/* Common UX Sync — Claude · Workbench 연동(로컬 서버)만 한다.
   캡처 자동 갱신 · 「캡처 받기」 작업 · 글 수정(text) 작업 · 페이지 · 프레임 목록 보내기. 창에는 연결 상태만 작게 보인다 */
const BASE = 'http://localhost:8765/api/', JOBS_API = BASE + 'jobs', CAT_API = BASE + 'catalog', SHOTS_API = BASE + 'shots';
const $ = id => document.getElementById(id);
let reqSeq = 0, myKey = '', online = null, page = { fileName: '', workName: '', onWork: false };

// 창 높이를 내용에 맞춘다
function fit() { parent.postMessage({ pluginMessage: { type: 'fit', h: Math.ceil($('box').getBoundingClientRect().height) } }, '*'); }
function log(t) { $('log').textContent = t + ' (' + new Date().toLocaleTimeString().replace(/:\d\d(?=\D*$)/, '') + ')'; $('log').title = $('log').textContent; }
function setConn(ok) {
  if (online === ok) return; online = ok;
  $('dot').className = 'dot ' + (ok ? 'ok' : 'err');
  $('conn').textContent = ok ? 'Workbench 서버 연결됨' : 'Workbench 서버 연결 안 됨';
  if (!ok) log('Figma AI Run을 실행해 주세요');
  showFile();
}
function showFile() {
  const f = $('file');
  if (!page.fileName) { f.textContent = ''; return; }
  f.textContent = page.fileName + ' · ' + (page.workName ? '작업 페이지 ' + page.workName + (page.onWork ? ' (보는 중)' : '') : '작업 페이지 없음');
  f.title = page.workName && !page.onWork ? '자동 캡처는 작업 페이지를 보고 있을 때만 됩니다' : f.textContent;
  fit();
}
// 서버 연결 확인(5초마다)
async function ping() {
  try { const r = await fetch(BASE + 'projects', { cache: 'no-store' }); setConn(r.ok); }
  catch (e) { setConn(false); }
}

function call(type, extra) {
  return new Promise((resolve, reject) => {
    const reqId = ++reqSeq;
    const h = e => {
      const m = e.data.pluginMessage;
      if (!m || m.reqId !== reqId) return;
      window.removeEventListener('message', h);
      m.type === 'error' ? reject(new Error(m.message)) : resolve(m);
    };
    window.addEventListener('message', h);
    parent.postMessage({ pluginMessage: Object.assign({ type, reqId }, extra || {}) }, '*');
  });
}
const jobPost = body => fetch(JOBS_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

/* ── 캡처: code.js가 보낸 JPG를 서버에 올린다 ── */
function b64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
let shotCount = 0;
window.addEventListener('message', async e => {
  const m = e.data.pluginMessage;
  if (!m) return;
  if (m.type === 'shots-state') $('autoShots').checked = m.auto;
  if (m.type === 'page-state') { page = m; showFile(); }
  if (m.type === 'page-frames') onPageFrames(m);
  if (m.type === 'shot') {
    try {
      const r = await fetch(SHOTS_API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fileKey: m.fileKey, nodeId: m.nodeId, name: m.name, w: m.w, h: m.h, by: m.by, png: b64(m.bytes), edit: !m.jobId }) });   // edit: Figma에서 고쳐서 올린 캡처(요청받은 캡처 · 자동 캡처가 아님) — 프로토타입 「갱신 필요」는 이것만 본다
      const out = await r.json();
      if (out.error) throw new Error(out.error);
      // Workbench 「캡처 받기」 요청이었으면 완료로
      if (m.jobId) await jobPost({ action: 'update', id: m.jobId, status: '완료', note: '플러그인 캡처 · ' + m.by });
      shotCount++;
      log(m.name + ' 캡처 · 이번 실행 ' + shotCount + '건');
    } catch (err) {
      // 가져간 캡처 작업이면 다시 「대기」로(다음에 다시 받거나 Claude가 받는다)
      if (m.jobId) jobPost({ action: 'update', id: m.jobId, status: '대기' }).catch(() => {});
      log('캡처 올리기 실패: ' + (err.message || err));
    }
  }
});
$('autoShots').onchange = () => parent.postMessage({ pluginMessage: { type: 'shots-auto', on: $('autoShots').checked } }, '*');
$('shotView').onclick = () => {
  log('캡처 중…');
  call('shots-now').then(r => log('보이는 프레임 ' + r.count + '개 캡처')).catch(err => log(err.message));
};

/* Workbench 「캡처 받기」 요청 처리: 4초마다 이 파일의 대기 요청을 보고, 지금 열린 페이지에 있는 프레임만 받는다.
   다른 페이지 프레임은 Figma를 무겁게 하지 않도록 남겨 두면 Claude가 받는다. */
/* Figma 창이 뒤에 있으면 이 창(웹 페이지)의 타이머가 1분에 한 번으로 늦춰진다(2026-11-11 확인: 5초 신호가 40~60초마다 옴).
   그래서 받는 동안에는 타이머(setTimeout · 쉬기)를 쓰지 않고, 받을 것이 남아 있으면 기다리지 않고 바로 다시 묻는다(fetch · 메시지는 늦춰지지 않음).
   서버는 물을 때마다 자동 캡처 대기열을 채운다(auto-plan) → Figma를 보지 않아도 끊기지 않고 이어 받는다 */
let jobBusy = false;
async function captureJobs() {
  if (jobBusy || !myKey) return;
  jobBusy = true;
  try { for (let round = 0; round < 500; round++) { if (!(await captureRound())) break; } }
  catch (e) { /* 서버가 꺼져 있으면 다음에 다시 */ }
  finally { jobBusy = false; }
}
// 한 차례: 받은 것이 있으면 true(바로 다음 차례)
async function captureRound() {
  {
    // 상태(한글)는 주소에 넣지 않고 여기서 거른다: 윈도우 서버가 주소의 한글을 잘못 읽어 늘 빈 목록이 왔다
    const d = await (await fetch(JOBS_API + '?key=' + encodeURIComponent(myKey) + '&kind=capture', { cache: 'no-store' })).json();
    const waiting = (d.items || []).filter(x => x.status === '대기');
    for (const j of waiting.filter(x => !x.auto).slice(0, 5)) {
      // 지금 열린 페이지에 있는 프레임만, 서버에서 「진행 중」으로 먼저 가져간 뒤 받는다(같은 프레임을 두 번 받지 않게)
      if (!(await call('has-frame', { nodeId: j.nodeId })).found) continue;
      const t = await (await jobPost({ action: 'take', id: j.id, kind: 'capture', fileKey: myKey, by: 'Figma 플러그인' })).json();
      const got = t && t.job;
      if (!got) continue;   // 그사이 Claude · 다른 PC가 가져감
      if (got.id !== j.id) { await jobPost({ action: 'update', id: got.id, status: '대기' }); continue; }   // 옛 서버(id 무시)가 다른 작업을 줬으면 되돌린다
      const r = await call('capture-one', { nodeId: j.nodeId, jobId: j.id });
      if (!r.done) await jobPost({ action: 'update', id: j.id, status: '대기' });
    }
    /* Workbench 자동 캡처(auto): 페이지를 열면 Workbench가 캡처 없는 프레임을 보고 있는 화면부터 쌓는다(쌓인 순서 = 받을 순서).
       다른 페이지 프레임도 받는다 — 그 페이지를 처음 한 번 불러올 때만 오래 걸리고(큰 페이지는 1분 넘게), 그 뒤로는 한 장에 1초 안팎.
       편집 중이면 멈췄다가 이어서 받고, 받을 것이 남아 있으면 기다리지 않고 바로 이어 간다 */
    const idn = x => +String(x.id).replace(/\D/g, '') || 0;
    let did = 0;
    for (const j of waiting.filter(x => x.auto).sort((a, b) => idn(a) - idn(b))) {
      const t = await (await jobPost({ action: 'take', id: j.id, kind: 'capture', fileKey: myKey, by: 'Figma 플러그인' })).json();
      const got = t && t.job;
      if (!got) continue;
      if (got.id !== j.id) { await jobPost({ action: 'update', id: got.id, status: '대기' }); continue; }
      let r = await call('capture-any', { nodeId: j.nodeId, jobId: j.id });
      if (r.needLoad) {
        // 처음 보는 페이지: Workbench에 「불러오는 중」을 알리고 한 번 불러온 뒤 다시
        await jobPost({ action: 'update', id: j.id, note: '「' + r.page + '」 페이지를 처음 불러오는 중(한 번만, 큰 페이지는 1분 넘게 걸림)' });
        log('「' + r.page + '」 페이지 불러오는 중…');
        await call('load-page', { nodeId: j.nodeId });
        r = await call('capture-any', { nodeId: j.nodeId, jobId: j.id });
      }
      if (r.busy) { await jobPost({ action: 'update', id: j.id, status: '대기', note: '' }); return false; }   // 편집 중 → 4초 뒤 차례에(바로 다시 묻지 않는다)
      if (!r.done) { await jobPost({ action: 'update', id: j.id, status: '실패', note: r.gone ? '프레임을 찾지 못함' : '캡처하지 못함' }); continue; }
      did++;
    }
    return did > 0;   // 받은 것이 있으면 바로 다시 묻는다(서버가 대기열을 채워 둔다)
  }
}
setInterval(captureJobs, 4000);

/* Workbench 글 수정(text) 요청 처리: Claude가 Pretendard처럼 클라우드에서 못 쓰는 폰트의 글을 바꿀 때 쌓는다.
   이 PC의 Figma가 그 폰트를 갖고 있으니 여기서 바꾸고 결과를 돌려준다 */
let textBusy = false;
async function textJobs() {
  if (textBusy || !myKey) return;
  textBusy = true;
  try {
    const d = await (await fetch(JOBS_API + '?key=' + encodeURIComponent(myKey) + '&kind=text', { cache: 'no-store' })).json();
    for (const j of (d.items || []).filter(x => x.status === '대기').reverse()) {
      const post = body => jobPost(Object.assign({ action: 'update', id: j.id }, body));
      // 서버에서 먼저 가져간다(같은 파일을 연 다른 PC 플러그인과 두 번 고치지 않게)
      const t = await (await jobPost({ action: 'take', id: j.id, kind: 'text', fileKey: myKey, by: 'Figma 플러그인' })).json();
      if (!t || !t.job) continue;
      if (t.job.id !== j.id) { await jobPost({ action: 'update', id: t.job.id, status: '대기' }); continue; }
      await post({ note: '플러그인이 글을 바꾸는 중' });
      log('Claude 글 수정 처리 중…');
      let res;
      const items = Array.isArray(j.items) ? j.items : j.items ? [j.items] : [];
      try { res = (await call('text-edit', { items })).results; }
      catch (e) { await post({ status: '실패', note: '플러그인 오류: ' + (e.message || e) }); log('글 수정 실패'); continue; }
      const bad = res.filter(r => r.result === 'fail');
      // 결과는 원래 항목에 덧붙인다(fontFamily 등 지시가 지워지면, 다시 「대기」로 돌릴 때 다른 작업이 된다)
      await post({ status: bad.length ? '실패' : '완료', items: res.map((r, i) => Object.assign({}, items[i], { result: r.result, error: r.error, font: r.font, count: r.count })),
        note: (res.length - bad.length) + '/' + res.length + '곳 반영(플러그인)' + (bad.length ? ' · 실패: ' + bad.map(r => r.nodeId + ' ' + r.error).join(' / ') : '') });
      log('Claude 글 수정 ' + (res.length - bad.length) + '/' + res.length + '곳');
    }
  } catch (e) { /* 서버가 꺼져 있으면 다음에 다시 */ }
  finally { textBusy = false; }
}
setInterval(textJobs, 3000);

/* ── Workbench 프레임 목록: 이 파일의 페이지 · 프레임을 서버로 보낸다 (Workbench 메뉴가 이 목록으로 바뀐다) ── */
function parseFig(u) {
  const m = String(u || '').match(/figma\.com\/(?:design|file|proto)\/([A-Za-z0-9]+)(?:\/[^?#]*)?(?:\?([^#]*))?/); if (!m) return null;
  const node = ((m[2] || '').match(/(?:^|&)node-id=([0-9]+[-:][0-9]+)/) || [])[1] || '';
  return { key: m[1], node: node.replace('-', ':') };
}
// Figma 부담을 줄이려고 조금씩 보낸다: 페이지 이름 전체 + 열린 페이지의 프레임. 서버에 있던 목록과 합쳐서 저장한다
let cat = null;
async function serverCat(key) {
  try { const r = await fetch(CAT_API + '?key=' + encodeURIComponent(key), { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch (e) { return null; }
}
function withEditable(c) { c.pages.forEach(p => { p.editable = !!c.editablePageId && p.id === c.editablePageId; }); return c; }
function merge(base, inc) {
  const old = {}; ((base && base.pages) || []).forEach(p => { old[p.id] = p; });
  return withEditable({ fileKey: inc.fileKey, fileName: inc.fileName, by: inc.by,
    editablePageId: inc.editablePageId || (base && base.editablePageId) || '',
    pages: inc.pages.map(p => ({ id: p.id, name: p.name, frames: p.frames != null ? p.frames : (old[p.id] ? old[p.id].frames : null) })) });
}
async function postCat(c) {
  const r = await fetch(CAT_API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fileKey: c.fileKey, fileName: c.fileName, editablePageId: c.editablePageId, pages: c.pages, by: c.by }) });
  const out = await r.json(); if (out.error) throw new Error(out.error);
  cat = c;
}
// 이 파일의 작업 링크: 프로젝트(project.json)의 링크, 아직 모르면 시작 안내의 작업 링크.
//  Workbench에서 작업 페이지를 바꿀 수 있으므로 목록을 보낼 때 · 10초마다 다시 읽는다
async function readLink() {
  try {
    if (myKey) {
      const pj = await (await fetch(BASE + 'projects', { cache: 'no-store' })).json();
      const p = (pj.projects || []).find(x => x.key === myKey);
      if (p && p.link) return parseFig(p.link);
    }
    const s = await (await fetch(BASE + 'setup', { cache: 'no-store' })).json(); return parseFig(s && s.state && s.state.figmaUrl);
  } catch (e) { return undefined; }
}
let linkEd = null;   // 링크 노드가 있는 페이지(이 파일 기준) = 수정 가능 페이지
async function refreshLink() {
  const link = await readLink(); if (link === undefined) return linkEd;   // 서버가 꺼져 있으면 그대로
  const res = await call('set-link', { link });
  page = res; showFile();
  // 플러그인을 켤 때 서버가 꺼져 있어 목록 보내기가 실패했으면 파일 키가 비어 캡처 · 글 수정 요청을 못 받는다 → 여기서 채운다
  if (!myKey && res.fileKey) { myKey = res.fileKey; sendCatalog(); }
  return (linkEd = res.editablePageId || '');
}
async function sendCatalog() {
  try {
    const link = (await readLink()) || null;
    const res = await call('catalog', { link });
    linkEd = res.editablePageId || '';
    if (!res.fileKey) throw new Error('이 파일의 키를 알 수 없습니다.');
    myKey = res.fileKey;
    await postCat(merge(await serverCat(res.fileKey), res));
    log('페이지 ' + res.pages.length + '개 목록 보냄');
    refreshLink().catch(() => {});
  } catch (e) {
    log('목록 보내기 실패: ' + (e.message || e));
  }
}
// 한 페이지 목록이 들어오면(페이지 이동 · 프레임 추가) 합쳐서 보낸다
let pageQueue = Promise.resolve();
function onPageFrames(m) {
  pageQueue = pageQueue.then(async () => {
    // 서버 목록이 그사이 바뀌었을 수 있다(Claude가 만든 목록 · 다른 페이지 갱신) → 늘 서버 최신 목록 위에 합친다
    const fresh = await serverCat(m.fileKey);
    if (fresh) cat = fresh; else if (!cat || cat.fileKey !== m.fileKey) cat = { fileKey: m.fileKey, fileName: m.fileName, pages: [] };
    const pages = cat.pages.slice(), i = pages.findIndex(p => p.id === m.page.id);
    if (i >= 0) pages[i] = Object.assign({}, pages[i], { name: m.page.name, frames: m.page.frames }); else pages.push(m.page);
    // 수정 가능 페이지는 지금 작업 링크 기준(서버도 작업 링크로 다시 정한다)
    const ed = await refreshLink();
    await postCat(withEditable({ fileKey: m.fileKey, fileName: m.fileName, by: m.by, editablePageId: ed || cat.editablePageId || '', pages }));
  }).catch(e => { log('목록 보내기 실패: ' + (e.message || e)); });
}
$('catSend').onclick = sendCatalog;

fit();
ping(); setInterval(ping, 5000);
sendCatalog();
setInterval(() => { refreshLink().catch(() => {}); }, 10000);
</script>
