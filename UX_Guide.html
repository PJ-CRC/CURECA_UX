<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX Guide</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="appnav.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* 만든 UX 가이드 보기: .history/guides/{id}/guide.md (깃으로 공유)
   왼쪽 = 목차 트리(## 대분류 › ### 상세), 오른쪽 = 고른 항목의 내용. 좁은 화면에서는 트리가 위쪽 「목차」로 접힌다 */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f3f6fb; --ink:#14171c; --ink-2:#4a5260; --ink-3:#7a8392;
  --line:#e3e7ee; --accent:#2747d8; --accent-soft:#e6ebff; --red:#d93025; --red-soft:#fdecea;
  --ok:#1a7f37; --ok-soft:#e3f4e8; --code-bg:#eef1f6; --shadow:0 1px 2px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#171a20; --surface-2:#1e232b; --ink:#e8ebf0; --ink-2:#b4bcc8; --ink-3:#8590a0;
    --line:#2a3039; --accent:#8ea2ff; --accent-soft:#232c52; --red:#ff7b72; --red-soft:#3a1f1e;
    --ok:#56d364; --ok-soft:#16301d; --code-bg:#222831; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a20; --surface-2:#1e232b; --ink:#e8ebf0; --ink-2:#b4bcc8; --ink-3:#8590a0;
  --line:#2a3039; --accent:#8ea2ff; --accent-soft:#232c52; --red:#ff7b72; --red-soft:#3a1f1e;
  --ok:#56d364; --ok-soft:#16301d; --code-bg:#222831; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
/* 본문 너비 · 머리는 appnav.css 공통(.app-wrap 1440px · .app-head 제목 26px). 정보는 제목 아래 칩 한 줄, 버튼은 머리 오른쪽 */
.app-head h1{font-weight:800}
.app-head .lead{max-width:860px}
.back{display:inline-block;font-size:13px;text-decoration:none;margin-bottom:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12.5px;line-height:1.5;padding:2px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);text-decoration:none;white-space:nowrap}
.pill b{color:var(--ink)}
a.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.on b{color:var(--ok)}

/* 두 칸: 목차 트리 340 | 내용 */
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:var(--gap);align-items:start}
.side{position:sticky;top:calc(var(--nav-h) + 12px);max-height:calc(100vh - var(--nav-h) - 24px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.side-head{padding:12px;border-bottom:1px solid var(--line)}
.side-head input{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.tree{list-style:none;margin:0;padding:8px;overflow:auto;flex:1}
.tree ul{list-style:none;margin:2px 0 4px;padding:0 0 0 14px;border-left:1px solid var(--line);margin-left:15px}
.tree li{margin:1px 0}
.node{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:7px 8px;font-size:14px;color:var(--ink-2);line-height:1.35}
.node:hover{background:var(--surface-2);color:var(--ink)}
.node.cur{background:var(--accent-soft);color:var(--accent);font-weight:700}
.node.grp{font-weight:700;color:var(--ink)}
.node .tw{flex:none;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);border-radius:4px;transition:transform .15s}
.node .tw:hover{background:var(--line)}
.node .tw.open{transform:rotate(90deg)}
.node .tw.none{visibility:hidden}
.node .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.node mark{background:#fff1a8;color:inherit;border-radius:2px}
.tree li.hide{display:none}
.side-empty{color:var(--ink-3);font-size:13px;padding:10px}

.main{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r);box-shadow:var(--shadow);padding:28px 36px 32px;min-height:420px}
/* 글 · 표 · 그림 모두 칸 전체 너비: 좌우 여백이 같게(왼쪽 = 오른쪽 36px) */
.crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.crumb button{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px}
.main h2.sec{font-size:22px;margin:0 0 12px;font-weight:800;letter-spacing:-.01em}
.main h3{font-size:16.5px;margin:22px 0 8px}
.main h4{font-size:15px;margin:18px 0 6px}
.main p{margin:8px 0}
.main ul,.main ol{margin:6px 0;padding-left:20px}
.main li{margin:3px 0}
.main blockquote{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 14px;border-radius:6px;margin:12px 0;font-size:14px}
.main blockquote p{margin:4px 0}
code{font-family:"JetBrains Mono",Consolas,monospace;font-size:.88em;background:var(--code-bg);padding:1px 6px;border-radius:5px}
pre{background:var(--code-bg);padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.5;margin:10px 0}
pre code{background:none;padding:0}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.8px}
th,td{padding:8px 11px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--surface-2);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:none}
.main img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;margin:12px 0 4px;cursor:zoom-in}
.main p>em:only-child{display:block;font-size:12.5px;color:var(--ink-3);font-style:normal}
/* 대분류를 고르면 하위 항목을 폴더 모양 카드로 보여 준다(색은 순서대로 돌아가며, 글자는 어두운 색 고정)
   모양: 안쪽 .fd를 clip-path로 폴더(왼쪽 위 탭)로 자르고, 바깥 버튼의 drop-shadow 네 겹으로 테두리를 그린다 */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px 22px;margin-top:22px}
.kid{display:flex;padding:0;border:0;background:none;text-align:left;color:#1d1f23;
  filter:drop-shadow(1px 0 0 #6b6f76) drop-shadow(-1px 0 0 #6b6f76) drop-shadow(0 1px 0 #6b6f76) drop-shadow(0 -1px 0 #6b6f76);transition:transform .15s}
.kid:hover{transform:translateY(-3px)}
.kid:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.kid .fd{flex:1;display:flex;flex-direction:column;min-height:150px;padding:30px 18px 14px;background:var(--f,#e8eef9);
  clip-path:polygon(0 0,40% 0,calc(40% + 18px) 18px,100% 18px,100% 100%,0 100%)}
.kid .ico{width:9px;height:9px;border:1.3px solid currentColor;border-radius:1px;margin-bottom:12px}
.kid i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75;line-height:1.4;margin-bottom:2px}
.kid b{display:block;font-size:17px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.kid small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:12.5px;line-height:1.5;opacity:.8;margin-top:6px}
.kid .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:14px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.kid .ft span:last-child{font-size:18px;font-weight:400;letter-spacing:0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.pager button{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:8px;padding:8px 14px;font-size:13.5px;max-width:48%;text-align:left}
.pager button:hover{background:var(--accent);color:#fff}
:root[data-theme="dark"] .pager button:hover{color:#0f1115}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pager button:hover{color:#0f1115}}
.pager button small{display:block;color:inherit;opacity:.75;font-weight:600;font-size:11.5px}
.empty{text-align:center;color:var(--ink-3);padding:60px 0}
details.how{border:1px solid var(--line);border-radius:var(--card-r);padding:12px 20px;margin:0 0 var(--gap);font-size:14px;background:var(--surface);box-shadow:var(--shadow)}
details.how summary{cursor:pointer;font-weight:700}
details.how pre{white-space:pre-wrap}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.86);display:none;flex-direction:column;align-items:center;justify-content:flex-start;overflow:auto;padding:48px 16px 24px}
.lb.on{display:flex}
.lb img{max-width:min(1600px,100%);height:auto;background:#fff;border-radius:6px}
.lb .cap{color:#e8ebf0;font-size:14px;margin-bottom:10px}
.lb button{position:fixed;top:12px;right:16px;font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid #555;background:#1e232b;color:#fff;cursor:pointer}
/* 항목 수정 */
.sec-row{display:flex;align-items:flex-start;gap:10px}
.sec-row h2.sec{flex:1}
/* 머리 오른쪽 버튼: 수정 요청(지금 항목) · 수정 이력 */
.app-head-act .btn{padding:6px 12px;font-size:13px;white-space:nowrap;color:var(--ink-2)}
.app-head-act .btn:hover{color:var(--accent)}
.app-head-act .btn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.editor textarea{width:100%;min-height:180px;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:14px/1.6 Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;resize:vertical}
.editor input{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-top:8px}
.editor .tip{font-size:12.5px;color:var(--ink-3);margin:6px 0 0}
.editor .act{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
:root[data-theme="dark"] .btn.pri{color:#0f1115}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#0f1115}}
/* 가이드 수정 반영: 안내 → 고쳐야 할 화면 → 반영 여부 → 수정 요청 */
.fix{background:var(--surface);border:1px solid #f0c27a;border-radius:12px;padding:14px 18px;margin:0 0 16px;box-shadow:var(--shadow)}
.fix h3{margin:0 0 4px;font-size:15px}
.fix p{margin:4px 0;font-size:13.5px;color:var(--ink-2)}
.fix .steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;font-size:12px}
.fix .steps span{padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.fix .steps span.on{background:#fff1e0;color:#b35900;font-weight:700}
.fix .steps span.ok{background:var(--ok-soft);color:var(--ok)}
.fix ul{list-style:none;margin:8px 0;padding:0;border:1px solid var(--line);border-radius:8px;max-height:340px;overflow:auto}
.fix li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.fix li:last-child{border-bottom:0}
.fix li input{margin-top:3px}
.fix li b{display:block}
.fix li small{display:block;color:var(--ink-3);font-size:12px}
/* 연관 항목 종류 표시: 화면 파랑 · 문서 보라 · 프로토타입 초록 */
.kd{display:inline-block;font-size:11px;font-weight:700;line-height:1.5;padding:0 6px;border-radius:999px;vertical-align:1px}
.kd-screen{background:var(--accent-soft);color:var(--accent)}
.kd-doc{background:#f1eaff;color:#6d3fd6}
.kd-proto{background:var(--ok-soft);color:var(--ok)}
.fix .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fix + .fix{margin-top:-6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:#14171c;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.revs{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.revs li{padding:4px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
.toc-btn{display:none}
/* 끼워 넣기(embed=1): Common UX 가이드 페이지 안에서 보여 줄 때. 상단 메뉴 · 돌아가기 링크를 빼고 여백을 줄인다 */
html.embed body{background:transparent}
html.embed .appnav,html.embed .back,html.embed #title{display:none}
html.embed .app-wrap{max-width:none;padding:0 0 24px}
html.embed .side{top:12px;max-height:calc(100vh - 24px)}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .side.fold .tree,.side.fold .side-head input{display:none}
  .toc-btn{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:none;font-weight:700;font-size:14px;padding:0 0 0 2px;margin-bottom:8px}
  .side.fold .toc-btn{margin-bottom:0}
  .main{padding:16px 14px 20px}
}
</style>
</head>
<body>
<nav class="appnav" aria-label="도구 메뉴">
  <b class="appnav-brand">Figma AI Run</b>
  <a href="Setup.html">시작 안내</a>
  <a href="Common_UX_Guide.html" aria-current="page">UX 문서</a>
  <a href="Figma_Workbench.html">Figma Workbench</a>
  <a href="Change_History.html">변경 이력</a>
  <a href="Usage_Stats.html">사용량 통계</a>
  <a href="Prototypes.html">프로토타입</a>
  <span class="appnav-sp"></span>
  <div class="appnav-right"></div>
</nav>
<div class="app-wrap wide">
<header class="app-head top">
  <div class="app-head-t">
    <a class="back" href="Common_UX_Guide.html#gdTitle">← UX 문서</a>
    <h1 id="title">불러오는 중…</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="app-head-act">
    <button type="button" class="btn" id="editBtn" hidden>수정 요청</button>
    <button type="button" class="btn" id="revBtn" aria-controls="revBox" aria-expanded="false" hidden>수정 이력</button>
  </div>
</header>
<details class="how" id="revBox" hidden><summary>수정 이력</summary><ul class="revs" id="revList"></ul></details>
<div id="fixes"></div>
<div class="layout" id="layout">
  <aside class="side fold" id="side" aria-label="목차">
    <div class="side-head">
      <button type="button" class="toc-btn" id="tocBtn" aria-expanded="false"><span id="tocCur">목차</span><span>▾</span></button>
      <input id="q" type="search" placeholder="목차 · 내용 검색" aria-label="가이드 검색">
    </div>
    <ul class="tree" id="tree" role="tree"><li class="side-empty">불러오는 중…</li></ul>
  </aside>
  <main class="main" id="main" aria-live="polite"><p class="empty">불러오는 중…</p></main></div>
</div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="이미지 크게 보기"><button type="button" id="lbClose">닫기 ✕</button><div class="cap" id="lbCap"></div><img id="lbImg" alt=""></div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var id = (new URLSearchParams(location.search).get('g') || '').replace(/[^A-Za-z0-9_-]/g, '');
  if (new URLSearchParams(location.search).get('embed')) document.documentElement.classList.add('embed');
  /* 가이드는 작업 이력과 함께 깃으로 공유되는 .history/guides/{id}/ 에 있다. 고친 내용은 rev/ 수정본으로 쌓이고 가장 최근 것이 지금 내용이다 */
  var base = '.history/guides/' + id + '/';
  var G = null, applied = {}, names = {}, editPage = {}, meta = {}, head0 = '', secs = [], byId = {}, cur = null, open = {}, editing = false;
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fail(t){ $('title').textContent = 'UX 가이드'; $('main').innerHTML = '<p class="empty">' + esc(t) + '</p>'; $('tree').innerHTML = ''; $('editBtn').hidden = true; }
  function toast(t){ var e = document.createElement('div'); e.className = 'toast'; e.setAttribute('role', 'status'); e.textContent = t; document.body.appendChild(e); setTimeout(function(){ e.remove(); }, 5000); }
  function user(){ try { return localStorage.getItem('cux.user') || ''; } catch(x){ return ''; } }
  function when(t){ return String(t || '').replace('T', ' ').slice(0, 16); }
  function post(url, body){ return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function(r){ return r.json(); }).then(function(d){ if (d.error) throw new Error(d.error); return d; }); }
  if (location.protocol === 'file:') { fail('Figma AI Run 실행 후 http://localhost:8765/UX_Guide.html 에서 열어 주세요.'); return; }
  if (!id) { fail('가이드를 고르지 않았습니다. UX 가이드 목록에서 고르세요.'); return; }
  if (!window.marked) { fail('화면을 그리는 라이브러리(marked)를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'); return; }
  /* 가이드 글에 섞인 HTML은 그대로 쓰지 않고 글자로 보인다 */
  marked.use({ renderer: { html: function(h){ return esc(typeof h === 'string' ? h : h && h.text); } } });

  /* 가이드 정보(지금 내용 위치 · 수정 이력 · 작업 기준) → meta.json · 지금 내용 */
  function info(){
    return Promise.all([
      fetch('/api/guides', { cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : {}; }),
      fetch('/api/projects', { cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; })
    ]).then(function(d){
      G = (d[0].items || []).filter(function(x){ return x.id === id; })[0] || null;
      applied = d[0].applied || {};
      (d[1].projects || []).forEach(function(p){ names[p.key] = p.name; editPage[p.key] = p.editablePageName; });
      return G;
    });
  }
  function load(keepSec){
    return info().then(function(g){
      if (!g) throw 0;
      return Promise.all([
        fetch(base + 'meta.json', { cache: 'no-store' }).then(function(r){ if (!r.ok) throw 0; return r.json(); }),
        fetch(g.mdPath || base + 'guide.md', { cache: 'no-store' }).then(function(r){ if (!r.ok) throw 0; return r.text(); })
      ]);
    }).then(function(d){ meta = d[0]; head(meta); build(d[1], keepSec); fixes(); itemDates(); }, function(){ fail('이 가이드를 찾지 못했습니다: ' + id); });
  }
  load();

  function appliedKeys(){ return Object.keys(applied).filter(function(k){ return applied[k].guideId === id; }); }
  function head(m){
    document.title = m.title || 'UX Guide';
    /* 돌아가기: 그 문서 종류의 탭으로 (정의서 kind:'spec') */
    var bk = document.querySelector('.back'); if (bk) bk.href = m.kind === 'spec' ? 'Common_UX_Guide.html?doc=spec' : 'Common_UX_Guide.html#gdTitle';
    $('title').textContent = m.title || id;
    var pills = [], keys = appliedKeys();
    if (keys.length) pills.push('<span class="pill on">내 작업 기준 <b>' + esc(keys.map(function(k){ return names[k] || k.slice(0, 6); }).join(', ')) + '</b></span>');
    if (m.link) pills.push('<a class="pill" href="' + esc(m.link) + '" target="_blank" rel="noopener">기준 Figma <b>열기 ↗</b></a>');
    pills.push('<span class="pill">' + (G && G.rev ? '수정일' : '작성일') + ' <b>' + esc(String((G && G.updatedAt) || m.updatedAt || '').slice(0, 10)) + '</b></span>');
    if (m.by) pills.push('<span class="pill">요청 <b>' + esc(m.by) + '</b></span>');
    if (m.frames) pills.push('<span class="pill">참고 프레임 <b>' + esc(m.frames) + '개</b></span>');
    $('meta').innerHTML = pills.join('');
    /* 「수정 이력」은 머리 오른쪽 버튼으로 연다 */
    var revs = (G && G.revs) || [];
    $('revBtn').hidden = !revs.length; $('revBtn').textContent = '수정 이력' + (revs.length ? ' ' + revs.length : '');
    if (!revs.length) panel('revBox', false);
    $('revList').innerHTML = revs.slice().reverse().map(function(r){ return '<li>' + esc(when(r.at)) + ' · ' + esc(r.by || '—') + (r.note ? ' · ' + esc(r.note) : '') + '</li>'; }).join('');
  }

  /* 원문을 항목으로 자른다: 맨 위 # 제목(머리말과 겹쳐 빼고 저장 때 그대로 둠) · 「개요」(## 앞 글) · ## 대분류 · ### 항목.
     항목마다 원문(raw)을 그대로 들고 있어 [수정]으로 그 부분만 고칠 수 있다 */
  function split(md){
    var lines = md.replace(/\r\n/g, '\n').split('\n'), out = [], curS = null, fence = false, head = [], seenTitle = false;
    function start(level, title, line){ curS = { level: level, title: title, raw: line + '\n' }; out.push(curS); }
    lines.forEach(function(l, i){
      var nl = i < lines.length - 1 ? '\n' : '';
      if (/^\s*(```|~~~)/.test(l)) fence = !fence;
      var m = !fence && l.match(/^(#{1,3})\s+(.*?)\s*#*\s*$/);
      if (m && m[1] === '#' && !seenTitle && !out.length && !(curS)) { seenTitle = true; head.push(l + nl); return; }
      if (m && m[1] === '##') { start(1, m[2], l); if (!nl) curS.raw = l; return; }
      if (m && m[1] === '###' && out.some(function(s){ return s.level === 1; })) { start(2, m[2], l); if (!nl) curS.raw = l; return; }
      if (!curS) { curS = { level: 0, title: '개요', raw: '' }; out.push(curS); }
      curS.raw += l + nl;
    });
    return { head: head.join(''), secs: out };
  }
  function render(raw){
    var box = document.createElement('div');
    box.innerHTML = marked.parse(raw);
    box.querySelectorAll('img').forEach(function(im){
      var s = im.getAttribute('src') || '';
      if (s && !/^(https?:|data:|\/)/.test(s)) im.setAttribute('src', base + s.replace(/^\.\//, ''));
      im.loading = 'lazy';
    });
    box.querySelectorAll('table').forEach(function(t){ var w = document.createElement('div'); w.className = 'tbl'; t.parentNode.insertBefore(w, t); w.appendChild(t); });
    box.querySelectorAll('a[href^="http"]').forEach(function(a){ a.target = '_blank'; a.rel = 'noopener'; });
    return box;
  }
  function body(s){ return s.level ? s.raw.replace(/^[^\n]*\n?/, '') : s.raw; }
  function build(md, keepIdx){
    var sp = split(md), n = 0, grp = null;
    head0 = sp.head; secs = []; byId = {};
    sp.secs.forEach(function(s){
      if (s.level === 0) { if (!s.raw.trim()) return; s.id = 'overview'; }
      else s.id = 's' + (++n);
      var t = document.createElement('div'); t.innerHTML = marked.parseInline(s.title); s.label = t.textContent.trim() || s.title;
      s.kids = []; s.parent = null;
      if (s.level === 1) grp = s; else if (s.level === 2 && grp) { s.parent = grp; grp.kids.push(s); }
      s.box = render(body(s));
      s.text = (s.label + ' ' + s.box.textContent).toLowerCase();
      secs.push(s); byId[s.id] = s;
    });
    if (!secs.length) { fail('가이드 내용이 비어 있습니다.'); return; }
    var want = keepIdx != null ? (secs[keepIdx] || secs[0]).id : decodeURIComponent(location.hash.slice(1));
    show(byId[want] ? want : secs[0].id, true);
  }
  function fullMd(){ return head0 + secs.map(function(s){ return s.raw; }).join(''); }

  /* 항목별 작성일 · 수정일: 처음 내용(guide.md, meta.createdAt)과 수정본(rev/*.md)을 차례로 비교한다.
     작성일 = 그 제목이 처음 나온 판, 수정일 = 내용이 마지막으로 바뀐 판. 폴더 카드 아래 줄에 쓴다 */
  var DATES = {}, datesFor = null;
  function dkey(s){ return s.level + '|' + String(s.title).trim(); }
  function itemDates(){
    var revs = (G && G.revs) || [], key = revs.map(function(r){ return r.rev; }).join(',');
    if (datesFor === key) { paintDates(); return; }
    datesFor = key;
    var vers = [{ url: base + 'guide.md', at: String(meta.createdAt || '').slice(0, 10) }].concat(revs.map(function(r){
      return { url: base + 'rev/' + r.rev + '.md', at: String(r.at || '').slice(0, 10) || String(r.rev).replace(/^(\d{4})(\d\d)(\d\d).*/, '$1-$2-$3') };
    }));
    Promise.all(vers.map(function(v){ return fetch(v.url, { cache: 'no-store' }).then(function(r){ return r.ok ? r.text() : null; }).catch(function(){ return null; }); }))
      .then(function(mds){
        var d = {}, prev = {};
        mds.forEach(function(md, i){
          if (md == null) return;
          split(md).secs.forEach(function(s){
            if (!s.level) return;
            var k = dkey(s), b = body(s).trim();
            if (!d[k]) d[k] = { c: vers[i].at, u: vers[i].at }; else if (prev[k] !== b) d[k].u = vers[i].at;
            prev[k] = b;
          });
        });
        DATES = d; paintDates();
      });
  }
  function paintDates(){
    function dot(t){ return String(t || '').replace(/-/g, '.'); }
    Array.prototype.forEach.call(document.querySelectorAll('.kid[data-go]'), function(el){
      var k = byId[el.dataset.go], dd = k && DATES[dkey(k)], ft = el.querySelector('.ft span');
      if (ft) ft.textContent = dd && dd.c ? '작성 ' + dot(dd.c) + (dd.u && dd.u !== dd.c ? ' · 수정 ' + dot(dd.u) : '') : '';
    });
  }

  function tree(q){
    var h = '', hit = function(s){ return !q || s.text.indexOf(q) >= 0; };
    function label(t){ var e = esc(t); if (!q) return e; var i = t.toLowerCase().indexOf(q); return i < 0 ? e : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length)); }
    secs.filter(function(s){ return s.level <= 1; }).forEach(function(g){
      var kids = (g.kids || []).filter(hit);
      if (!(hit(g) || kids.length)) return;
      var isOpen = q ? true : open[g.id] !== false && (open[g.id] || (cur && (cur === g || cur.parent === g)));
      h += '<li role="treeitem" aria-expanded="' + (g.kids.length ? !!isOpen : 'false') + '">' +
        '<button type="button" class="node' + (g.level ? ' grp' : '') + (cur === g ? ' cur' : '') + '" data-id="' + g.id + '">' +
        '<span class="tw' + (g.kids.length ? (isOpen ? ' open' : '') : ' none') + '" data-tw="' + g.id + '">▸</span><span class="lbl">' + label(g.label) + '</span></button>';
      if (g.kids.length && isOpen) h += '<ul role="group">' + (q ? kids : g.kids).map(function(k){
        return '<li role="treeitem"><button type="button" class="node' + (cur === k ? ' cur' : '') + '" data-id="' + k.id + '"><span class="tw none"></span><span class="lbl">' + label(k.label) + '</span></button></li>';
      }).join('') + '</ul>';
      h += '</li>';
    });
    $('tree').innerHTML = h || '<li class="side-empty">맞는 항목이 없습니다.</li>';
  }

  function show(sid, first){
    var s = byId[sid]; if (!s) return;
    if (editing && !confirm('고치던 내용이 저장되지 않았습니다. 이동할까요?')) return;
    editing = false;
    cur = s; if (s.parent) open[s.parent.id] = true; else if (s.kids && s.kids.length) open[s.id] = true;
    var m = $('main'); m.innerHTML = '';
    if (s.parent) m.insertAdjacentHTML('beforeend', '<div class="crumb"><button type="button" data-go="' + s.parent.id + '">' + esc(s.parent.label) + '</button> ›</div>');
    m.insertAdjacentHTML('beforeend', '<div class="sec-row"><h2 class="sec"></h2></div>');
    /* 수정 요청은 머리 오른쪽 버튼(지금 항목 기준) */
    $('editBtn').hidden = false; $('editBtn').disabled = false; $('editBtn').title = '「' + s.label + '」 항목 수정 요청';
    m.querySelector('h2.sec').textContent = s.label;
    Array.prototype.forEach.call(s.box.childNodes, function(x){ m.appendChild(x.cloneNode(true)); });
    if (s.kids && s.kids.length) {
      /* 밝은 파스텔 12색(순서대로 돌아가며) */
      var FOLDER = ['#fcd9c9', '#d3ecd8', '#eedcea', '#fbf0c4', '#fde2c6', '#dcf0f7', '#cde8ef', '#ebe2f5', '#fcecd4', '#f9dfd9', '#efe5c6', '#e6f2da'];
      m.insertAdjacentHTML('beforeend', '<div class="kids">' + s.kids.map(function(k, ki){
        /* 「4-b. Consumables and Reagents (5/5) · 수량 표기」 → 위 작은 글씨(번호 · 분류) + 큰 제목(수량 표기).
           설명은 첫 문장만, 길면 세 줄에서 자른다(글자 수로 자르지 않는다) */
        /* 나누는 곳: 「(1/4)」 같은 쪽 번호가 있으면 그 뒤, 없으면 첫 「 · 」 (제목 안의 「 · 」는 그대로 둔다) */
        var p = k.box.querySelector('p'), t = String(k.label);
        var mm = t.match(/^(.*?\(\d+\/\d+\))\s·\s(.+)$/) || t.match(/^(.*?)\s·\s(.+)$/);
        var eyebrow = mm ? mm[1] : '', title = mm ? mm[2] : t;
        var desc = p ? p.textContent.trim().split(/(?<=[.。])\s+/)[0] : '';
        /* 폴더 아래 줄: 왼쪽 = 작성일 · 수정일(paintDates가 채운다), 오른쪽 = → */
        return '<button type="button" class="kid" data-go="' + k.id + '" style="--f:' + FOLDER[ki % FOLDER.length] + '" title="' + esc(t + (desc ? ' — ' + desc : '')) + '"><span class="fd"><span class="ico"></span>' +
          (eyebrow ? '<i>' + esc(eyebrow) + '</i>' : '') + '<b>' + esc(title) + '</b>' + (desc ? '<small>' + esc(desc) + '</small>' : '') +
          '<span class="ft"><span></span><span aria-hidden="true">→</span></span></span></button>';
      }).join('') + '</div>');
      paintDates();
    }
    /* 이전 · 다음 항목 */
    var i = secs.indexOf(s), pv = secs[i - 1], nx = secs[i + 1];
    m.insertAdjacentHTML('beforeend', '<div class="pager">' + (pv ? '<button type="button" data-go="' + pv.id + '"><small>‹ 이전</small>' + esc(pv.label) + '</button>' : '<span></span>') +
      (nx ? '<button type="button" data-go="' + nx.id + '" style="text-align:right"><small>다음 ›</small>' + esc(nx.label) + '</button>' : '') + '</div>');
    $('tocCur').textContent = '목차 · ' + s.label;
    tree($('q').value.trim().toLowerCase());
    if (!first) { history.replaceState(null, '', '#' + s.id); if (window.innerWidth <= 860) { $('side').classList.add('fold'); $('tocBtn').setAttribute('aria-expanded', 'false'); } window.scrollTo({ top: $('main').getBoundingClientRect().top + scrollY - 70, behavior: 'smooth' }); }
  }

  /* 머리 버튼으로 여닫는 패널(수정 이력) */
  function panel(pid, on){
    var d = $(pid), b = $('revBtn');
    d.hidden = !on; d.open = on; b.setAttribute('aria-expanded', String(on));
  }

  /* ── 항목 수정 요청: 무엇을 어떻게 고칠지 글로 적으면 Claude가 가이드를 고친다(guide-edit 작업) ── */
  function edit(){
    if (editing || !cur) return;
    var s = cur; editing = true;
    $('editBtn').disabled = true;
    var m = $('main');
    m.innerHTML = '<div class="crumb">' + esc(s.parent ? s.parent.label + ' › ' : '') + esc(s.label) + ' · 수정 요청</div>' +
      '<div class="editor"><textarea id="edText" aria-label="수정 요청 내용" placeholder="무엇을 어떻게 고칠지 적어 주세요.&#10;예) 날짜 표기를 YYYY.MM.DD hh:mm으로 바꿔 줘&#10;예) 표에 「Paused」 상태 설명을 추가해 줘"></textarea>' +
      '<p class="tip">이 항목(「' + esc(s.label) + '」)을 기준으로 Claude가 가이드를 고칩니다. 다른 항목에 걸친 수정도 적어도 됩니다. 고친 뒤 이 화면 위에 결과가 나옵니다(요청 감시가 켜져 있어야 합니다).</p>' +
      '<div class="act"><button type="button" class="btn" id="edCancel">취소</button><button type="button" class="btn pri" id="edSave">Claude에게 수정 요청</button></div></div>';
    $('edText').focus();
    $('edCancel').onclick = function(){ editing = false; show(s.id, true); };
    $('edSave').onclick = function(){
      var text = $('edText').value.trim();
      if (!text) { $('edText').focus(); return; }
      this.disabled = true;
      post('/api/jobs', { action: 'add', kind: 'guide-edit', guide: id, fileKey: meta.fileKey, name: s.label, text: text, by: user() })
        .then(function(){ editing = false; show(s.id, true); fixes(); toast('수정 요청을 보냈습니다. Claude가 고치면 이 화면 위에 결과가 나옵니다.'); })
        .catch(function(x){ $('edSave').disabled = false; alert(x.message || '요청하지 못했습니다.'); });
    };
  }

  /* ── 가이드 수정 패널 ── ① 가이드 수정(Claude, guide-edit) ② 고칠 화면 찾기(guide-check) ③ 반영 여부 선택 ④ 수정 요청
     ① 수정이 끝나면 이 가이드가 내 작업 기준일 때만 「이미 작업한 화면 확인」으로 이어진다 */
  var jobs = [], edits = [], lastRev = null, docs = {};
  /* 연관 항목 한 줄: 종류(화면 · 문서 · 프로토타입) · 이름 · 위치. type이 없으면 화면(가이드의 고칠 화면 찾기 결과) */
  var KIND = { screen: '화면', doc: '문서', proto: '프로토타입' };
  function itemType(it){ return it.type === 'doc' || it.type === 'proto' ? it.type : 'screen'; }
  function itemHead(it){
    var t = itemType(it);
    if (t === 'doc') { var dd = docs[it.doc] || {}; return { title: (it.docTitle || dd.title || it.doc) + (it.section ? ' › ' + it.section : ''), sub: (dd.kind === 'spec' ? '정의서' : '가이드') }; }
    if (t === 'proto') return { title: it.name || it.proto, sub: '프로토타입' + (it.frame ? ' · ' + it.frame : '') };
    return { title: it.frame || it.nodeId, sub: (it.page || '') + (it.nodeId ? ' · ' + it.nodeId : '') };
  }
  function steps(n){ return '<div class="steps">' + (meta.kind === 'spec' ? ['① 정의서 수정', '② 연관 항목 찾기', '③ 반영 여부 선택', '④ 수정 요청'] : ['① 가이드 수정', '② 고칠 화면 찾기', '③ 반영 여부 선택', '④ 수정 요청']).map(function(t, i){ return '<span class="' + (i + 1 < n ? 'ok' : i + 1 === n ? 'on' : '') + '">' + t + '</span>'; }).join('') + '</div>'; }
  function fixes(){
    return Promise.all([
      fetch('/api/jobs', { cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : { items: [] }; }).catch(function(){ return { items: [] }; }),
      fetch('/api/guides', { cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; })
    ]).then(function(d){
      var all = (d[0].items || []).filter(function(j){ return j.guide === id; }), open = ['대기', '진행 중', '완료', '보류', '실패'];
      jobs = all.filter(function(j){ return j.kind === 'guide-check' && open.indexOf(j.status) >= 0; });
      edits = all.filter(function(j){ return j.kind === 'guide-edit' && open.indexOf(j.status) >= 0; });
      /* Claude가 가이드를 고쳤으면(새 수정본) 본문을 다시 읽는다 */
      var g = (d[1].items || []).filter(function(x){ return x.id === id; })[0];
      if (g) { applied = d[1].applied || applied; if (lastRev !== null && g.rev !== lastRev && !editing) load(Math.max(0, secs.indexOf(cur))); lastRev = g.rev; }
      /* 다른 문서(가이드 · 정의서) 정보: 연관 항목 반영 때 그 문서의 수정 요청을 만든다 */
      docs = {}; (d[1].items || []).forEach(function(x){ docs[x.id] = x; });
      /* 가이드는 내 작업 기준일 때만, 정의서는 늘 「연관 항목 찾기」로 이어진다 */
      var mine = appliedKeys().length > 0, spec = meta.kind === 'spec', h = '';
      var DOC = spec ? '정의서' : '가이드';
      edits.forEach(function(j){
        var what = '「' + (j.name || '') + '」 ' + (j.text || '');
        if (j.status === '대기' || j.status === '진행 중') {
          h += '<section class="fix"><h3>' + DOC + ' 수정 요청 · ' + (j.status === '대기' ? '대기' : 'Claude가 고치는 중') + '</h3>' + steps(1) + '<p>' + esc(what) + '</p></section>';
        } else if (j.status === '완료') {
          var next = spec || mine;
          h += '<section class="fix" id="fix"><h3>Claude가 ' + DOC + '를 고쳤습니다' + (spec ? ' — 연관된 화면 · 문서도 고쳐야 할 수 있습니다' : mine ? ' — 이미 작업한 화면도 고쳐야 할 수 있습니다' : '') + '</h3>' + steps(next ? 2 : 1) +
            '<p>요청: ' + esc(what) + '</p>' + (j.note ? '<p>고친 내용: ' + esc(j.note) + '</p>' : '') +
            (spec
              ? '<p>Claude가 바뀐 내용과 연관된 곳을 찾아 목록을 만듭니다: ' + (meta.fileKey ? '<b>' + esc(names[meta.fileKey] || meta.fileName || meta.fileKey.slice(0, 6)) + '</b> 수정 가능 페이지의 화면 · ' : '') + '같은 내용을 쓰는 다른 가이드 · 정의서 항목 · 프로토타입. 무엇을 어떻게 고칠지 보고 반영할 것만 고르면 됩니다(아직 아무것도 고치지 않습니다).</p>' +
                '<div class="act"><button type="button" class="btn pri" data-check="' + j.id + '">연관 항목 찾기 요청</button><button type="button" class="btn" data-done="' + j.id + '">나중에</button></div>'
              : mine
              ? '<p>이 가이드는 내 <b>' + esc(appliedKeys().map(function(k){ return names[k] || k.slice(0, 6); }).join(', ')) + '</b> 파일 작업 기준입니다. Claude가 그 파일의 수정 가능 페이지에서 바뀐 내용과 다른 화면을 찾아 목록을 만듭니다(Figma는 아직 고치지 않습니다).</p>' +
                '<div class="act"><button type="button" class="btn pri" data-check="' + j.id + '">고칠 화면 찾기 요청</button><button type="button" class="btn" data-done="' + j.id + '">나중에</button></div>'
              : '<div class="act"><button type="button" class="btn" data-done="' + j.id + '">확인</button></div>') + '</section>';
        } else {
          h += '<section class="fix"><h3>가이드 수정 요청 · ' + esc(j.status) + '</h3><p>요청: ' + esc(what) + '</p><p>' + esc(j.note || '') + '</p><div class="act"><button type="button" class="btn" data-done="' + j.id + '">닫기</button></div></section>';
        }
      });
      jobs.forEach(function(j){
        var sp = j.scope === 'spec', file = j.fileKey ? names[j.fileKey] || j.fileKey.slice(0, 6) : '';
        var where = sp ? '연관 항목' : '고칠 화면', head = (file ? file + ' · ' : '') + where;
        if (j.status === '대기' || j.status === '진행 중') {
          h += '<section class="fix"><h3>' + esc(head) + '을 찾는 중</h3>' + steps(2) + '<p>' + esc(j.note || 'Claude가 바뀐 내용(' + (j.text || '') + ')과 ' + (sp ? '연관된 화면 · 문서 · 프로토타입' : '다른 화면') + '을 찾고 있습니다. 끝나면 여기에 목록이 나옵니다.') + '</p></section>';
        } else if (j.status === '완료') {
          var items = j.items || [];
          if (!items.length) {
            h += '<section class="fix"><h3>' + esc(head) + '이 없습니다</h3>' + steps(3) + '<p>' + esc(j.note || '바뀐 내용과 연관된 곳을 찾지 못했습니다.') + '</p><div class="act"><button type="button" class="btn" data-skip="' + j.id + '">확인</button></div></section>';
            return;
          }
          var ed = editPage[j.fileKey] || '';
          h += '<section class="fix" data-job="' + j.id + '"><h3>' + esc(head) + ' ' + items.length + '개 — 반영할지 골라 주세요</h3>' + steps(3) +
            '<p>바뀐 내용: ' + esc(j.text || '') + '. 반영할 항목을 고르고 [선택한 항목 수정 요청]을 누르면 화면은 Workbench 수정 요청, 문서는 그 문서의 수정 요청, 프로토타입은 프로토타입 수정 요청으로 등록되고 요청 감시 중인 Claude가 차례로 반영합니다.</p>' +
            '<ul>' + items.map(function(it, i){
              var t = itemType(it), hd = itemHead(it), ro = t === 'screen' && ed && it.page && it.page !== ed;
              return '<li><input type="checkbox" id="fx' + j.id + i + '" data-i="' + i + '"' + (ro ? ' disabled' : ' checked') + '><label for="fx' + j.id + i + '"><b>' + (sp ? '<span class="kd kd-' + t + '">' + KIND[t] + '</span> ' : '') + esc(hd.title) + '</b>' +
                '<small>' + esc(hd.sub + (ro ? ' · 보기 전용 페이지라 반영할 수 없음' : '')) + '</small>' + esc(it.change || '') + '</label></li>';
            }).join('') + '</ul>' +
            '<div class="act"><button type="button" class="btn pri" data-apply="' + j.id + '">선택한 ' + (sp ? '항목' : '화면') + ' 수정 요청</button><button type="button" class="btn" data-skip="' + j.id + '">반영하지 않음</button></div></section>';
        } else {
          h += '<section class="fix"><h3>' + esc(head) + ' 찾기 ' + esc(j.status) + '</h3><p>' + esc(j.note || '') + '</p><div class="act"><button type="button" class="btn" data-skip="' + j.id + '">닫기</button></div></section>';
        }
      });
      $('fixes').innerHTML = h;
      if (location.hash === '#fix' && h) { var f = $('fixes').firstElementChild; if (f) f.scrollIntoView(); }
    });
  }
  setInterval(function(){ if (!document.hidden && !editing) fixes(); }, 10000);

  $('fixes').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    /* 고친 결과를 확인함(이미 작업한 화면 확인은 하지 않음) */
    if (b.dataset.done) {
      post('/api/jobs', { action: 'update', id: b.dataset.done, status: '확인', note: (edits.filter(function(x){ return x.id === b.dataset.done; })[0] || {}).note || '' }).then(fixes).catch(function(x){ alert(x.message); });
      return;
    }
    if (b.dataset.check) {
      var ej = edits.filter(function(x){ return x.id === b.dataset.check; })[0]; if (!ej) return;
      b.disabled = true;
      var note = '「' + (ej.name || '') + '」 ' + (ej.note || ej.text || '');
      /* 정의서: 정의서의 기준 파일(없으면 파일 없이) 하나로, 화면 · 문서 · 프로토타입을 찾는다. 가이드: 내 작업 기준 파일마다 화면을 찾는다 */
      var keys = meta.kind === 'spec' ? [meta.fileKey || ''] : appliedKeys();
      Promise.all(keys.map(function(k){
        return post('/api/jobs', { action: 'add', kind: 'guide-check', guide: id, fileKey: k, scope: meta.kind === 'spec' ? 'spec' : '', name: meta.title || id, text: note, revFrom: ej.revFrom || 'guide.md', revTo: ej.revTo || '', by: user() });
      })).then(function(){ return post('/api/jobs', { action: 'update', id: ej.id, status: '확인', note: ej.note || '' }); })
        .then(function(){ fixes(); toast('요청했습니다. Claude가 ' + (meta.kind === 'spec' ? '연관 항목' : '고칠 화면') + '을 찾으면 여기에 목록이 나옵니다.'); })
        .catch(function(x){ b.disabled = false; alert(x.message || '요청하지 못했습니다.'); });
      return;
    }
    if (b.dataset.skip) {
      post('/api/jobs', { action: 'update', id: b.dataset.skip, status: '반영 안 함', note: (user() || '사용자') + '가 반영하지 않기로 함' }).then(fixes).catch(function(x){ alert(x.message); });
      return;
    }
    if (b.dataset.apply) {
      var j = jobs.filter(function(x){ return x.id === b.dataset.apply; })[0]; if (!j) return;
      var sec = b.closest('.fix'), picks = Array.prototype.filter.call(sec.querySelectorAll('input[type=checkbox]'), function(c){ return c.checked; }).map(function(c){ return j.items[+c.dataset.i]; });
      if (!picks.length) { alert('반영할 항목을 하나 이상 고르세요.'); return; }
      if (!confirm('항목 ' + picks.length + '개를 수정 요청으로 등록할까요?\n요청 감시 중인 Claude가 바뀐 내용대로 차례로 고칩니다.')) return;
      b.disabled = true;
      var ed = editPage[j.fileKey] || '', ids = [], DOCN = meta.kind === 'spec' ? '정의서' : '가이드';
      var why = '「' + (meta.title || id) + '」 ' + DOCN + ' 수정(' + (j.text || '') + ')에 맞게 고쳐 주세요. ';
      /* 한 건씩 차례로 등록(번호가 겹치지 않게): 화면 → Workbench 수정 요청, 문서 → 그 문서의 수정 요청(guide-edit), 프로토타입 → 프로토타입 수정 요청 */
      picks.reduce(function(p, it){
        return p.then(function(){
          var t = itemType(it);
          if (t === 'doc') {
            var dd = docs[it.doc] || {};
            return post('/api/jobs', { action: 'add', kind: 'guide-edit', guide: it.doc, fileKey: dd.fileKey || j.fileKey || '', name: it.section || '', text: '[' + DOCN + ' 반영] ' + why + (it.change || ''), by: user() || j.by || '' })
              .then(function(d){ ids.push((d.job && d.job.id) || '문서'); });
          }
          if (t === 'proto') {
            return post('/api/jobs', { action: 'add', kind: 'prototype-edit', proto: it.proto, fileKey: it.fileKey || j.fileKey || '', name: it.name || '', frames: it.nodeId ? [{ nodeId: it.nodeId, name: it.frame || '' }] : [], text: '[' + DOCN + ' 반영] ' + why + (it.change || ''), by: user() || j.by || '' })
              .then(function(d){ ids.push((d.job && d.job.id) || '프로토타입'); });
          }
          return post('/api/requests', { action: 'add', nodeId: it.nodeId || '', frame: it.frame || '', page: it.page || ed, fileKey: j.fileKey, fileName: names[j.fileKey] || '',
            editable: !ed || (it.page || ed) === ed, type: DOCN + ' 반영', priority: '보통', layout: '',
            text: '[' + DOCN + ' 반영] ' + why + (it.change || ''), by: user() || j.by || '' })
            .then(function(d){ if (d.items && d.items[0]) ids.push(d.items[0].id); });
        });
      }, Promise.resolve()).then(function(){
        return post('/api/jobs', { action: 'update', id: j.id, status: '반영', note: '수정 요청 ' + ids.length + '건 등록: ' + ids.join(', ') });
      }).then(function(){ fixes(); toast('수정 요청 ' + ids.length + '건(' + ids.join(', ') + ')을 등록했습니다. Workbench · 변경 이력에서 진행 상황을 볼 수 있습니다.'); })
        .catch(function(x){ b.disabled = false; alert(x.message || '등록하지 못했습니다.' + (ids.length ? ' (등록된 요청: ' + ids.join(', ') + ')' : '')); });
    }
  });

  $('tree').addEventListener('click', function(e){
    var tw = e.target.closest('[data-tw]');
    if (tw) { var g = byId[tw.dataset.tw]; open[g.id] = !tw.classList.contains('open'); tree($('q').value.trim().toLowerCase()); return; }
    var b = e.target.closest('[data-id]'); if (b) show(b.dataset.id);
  });
  $('editBtn').onclick = function(){ edit(); };
  ['revBox'].forEach(function(pid){
    $('revBtn').onclick = function(){ var on = $(pid).hidden; panel(pid, on); if (on) $(pid).scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
    $(pid).addEventListener('toggle', function(){ if (!this.open && !this.hidden) panel(pid, false); });
  });
  $('main').addEventListener('click', function(e){
    if (e.target.closest('[data-edit]')) { edit(); return; }
    var go = e.target.closest('[data-go]'); if (go) { show(go.dataset.go); return; }
    var im = e.target.closest('img'); if (!im || editing) return;
    $('lbImg').src = im.src; $('lbCap').textContent = im.alt || ''; $('lb').classList.add('on');
  });
  /* 검색: 제목 · 내용에 글자가 있는 항목만 트리에 남긴다 */
  $('q').addEventListener('input', function(){ tree(this.value.trim().toLowerCase()); });
  $('tocBtn').onclick = function(){ var f = $('side').classList.toggle('fold'); this.setAttribute('aria-expanded', String(!f)); };
  window.addEventListener('hashchange', function(){ var h = decodeURIComponent(location.hash.slice(1)); if (byId[h] && byId[h] !== cur) show(h); });
  window.addEventListener('beforeunload', function(e){ if (editing) { e.preventDefault(); e.returnValue = ''; } });
  function closeLb(){ $('lb').classList.remove('on'); $('lbImg').removeAttribute('src'); }
  $('lbClose').onclick = closeLb;
  $('lb').addEventListener('click', function(e){ if (e.target === this) closeLb(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeLb(); });
})();
</script>
<script src="appnav.js" defer></script>
</body>
</html>
