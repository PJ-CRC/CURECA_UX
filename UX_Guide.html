<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX 문서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="appnav.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* 만든 UX 가이드 보기: .history/guides/{id}/guide.md (깃으로 공유)
   왼쪽 = 목차 트리(## 대분류 › ### 상세), 오른쪽 = 고른 항목의 내용. 좁은 화면에서는 트리가 위쪽 「목차」로 접힌다 */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f3f6fb; --ink:#14171c; --ink-2:#4a5260; --ink-3:#7a8392;
  --line:#e3e7ee; --accent:#2747d8; --accent-soft:#e6ebff; --red:#d93025; --red-soft:#fdecea;
  --ok:#1a7f37; --ok-soft:#e3f4e8; --code-bg:#eef1f6; --shadow:0 1px 2px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#171a20; --surface-2:#1e232b; --ink:#e8ebf0; --ink-2:#b4bcc8; --ink-3:#8590a0;
    --line:#2a3039; --accent:#8ea2ff; --accent-soft:#232c52; --red:#ff7b72; --red-soft:#3a1f1e;
    --ok:#56d364; --ok-soft:#16301d; --code-bg:#222831; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a20; --surface-2:#1e232b; --ink:#e8ebf0; --ink-2:#b4bcc8; --ink-3:#8590a0;
  --line:#2a3039; --accent:#8ea2ff; --accent-soft:#232c52; --red:#ff7b72; --red-soft:#3a1f1e;
  --ok:#56d364; --ok-soft:#16301d; --code-bg:#222831; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
/* 본문 너비 · 머리는 appnav.css 공통(.app-wrap 1440px · .app-head 제목 26px). 정보는 제목 아래 칩 한 줄, 버튼은 머리 오른쪽 */
.app-head h1{font-weight:800}
.app-head .lead{max-width:860px}
.back{display:inline-block;font-size:13px;text-decoration:none;margin-bottom:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12.5px;line-height:1.5;padding:2px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);text-decoration:none;white-space:nowrap}
.pill b{color:var(--ink)}
a.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.on b{color:var(--ok)}

/* 두 칸: 목차 트리 340 | 내용 */
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:var(--gap);align-items:start}
.side{position:sticky;top:calc(var(--nav-h) + 12px);max-height:calc(100vh - var(--nav-h) - 24px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.side-head{padding:12px;border-bottom:1px solid var(--line)}
.side-head input{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.tree{list-style:none;margin:0;padding:8px;overflow:auto;flex:1;min-height:0}
/* 수정 요청 입력창: 목록 · 내용 아래에 따로 한 줄(왼쪽 대상 · 가운데 입력 · 오른쪽 보내기). 쓰기 권한이 없으면 숨고 목록 · 내용이 그만큼 늘어난다 */
.ask{display:flex;align-items:stretch;gap:12px;margin-top:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ask-t{flex:none;width:220px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.ask-t span{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.ask-t b{font-size:14px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask textarea{flex:1;min-width:0;box-sizing:border-box;height:58px;min-height:58px;max-height:160px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:13.5px;line-height:1.5;resize:vertical}
.ask textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.ask-act{flex:none;width:170px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.ask-act .btn{width:100%}
.ask-act span{font-size:12px;color:var(--ink-3);min-height:16px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask[aria-disabled="true"] textarea,.ask[aria-disabled="true"] .btn{opacity:.5;pointer-events:none}
html.doc-ro .ask{display:none}
@media (max-width:860px){ .ask{flex-direction:column} .ask-t,.ask-act{width:auto} }
/* 수정 진행 · 결과 패널: 목차 · 내용과 입력창 사이. 길면 그 안에서 스크롤(창 높이의 40%까지) */
#fixes:not(:empty){margin-top:12px;max-height:40vh;overflow:auto;border-radius:12px}
#fixes .fix{margin:0 0 8px}
#fixes .fix:last-child{margin-bottom:0}
#fixes .fix + .fix{margin-top:0}
/* 낮은 창: 입력창을 한 줄 높이로 */
@media (max-height:760px){
  .ask{padding:8px 12px;margin-top:8px}
  .ask textarea{height:40px;min-height:40px}
  .ask-t span,.ask-act span{display:none}
  #fixes:not(:empty){max-height:30vh}
}
.tree ul{list-style:none;margin:2px 0 4px;padding:0 0 0 14px;border-left:1px solid var(--line);margin-left:15px}
.tree li{margin:1px 0}
.node{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:7px 8px;font-size:14px;color:var(--ink-2);line-height:1.35}
.node:hover{background:var(--surface-2);color:var(--ink)}
.node.cur{background:var(--accent-soft);color:var(--accent);font-weight:700}
.node.grp{font-weight:700;color:var(--ink)}
.node .tw{flex:none;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);border-radius:4px;transition:transform .15s}
.node .tw:hover{background:var(--line)}
.node .tw.open{transform:rotate(90deg)}
.node .tw.none{visibility:hidden}
.node .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.node mark{background:#fff1a8;color:inherit;border-radius:2px}
.tree li.hide{display:none}
.side-empty{color:var(--ink-3);font-size:13px;padding:10px}

.main{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r);box-shadow:var(--shadow);padding:28px 36px 32px;min-height:420px}
/* 글 · 표 · 그림 모두 칸 전체 너비: 좌우 여백이 같게(왼쪽 = 오른쪽 36px) */
.crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.crumb button{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px}
.main h2.sec{font-size:22px;margin:0 0 12px;font-weight:800;letter-spacing:-.01em}
.main h3{font-size:16.5px;margin:22px 0 8px}
.main h4{font-size:15px;margin:18px 0 6px}
.main p{margin:8px 0}
.main ul,.main ol{margin:6px 0;padding-left:20px}
.main li{margin:3px 0}
.main blockquote{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 14px;border-radius:6px;margin:12px 0;font-size:14px}
.main blockquote p{margin:4px 0}
code{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--code-bg);padding:1px 6px;border-radius:5px}
pre{background:var(--code-bg);padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.5;margin:10px 0}
pre code{background:none;padding:0}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.8px}
th,td{padding:8px 11px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--surface-2);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:none}
/* 넓은 표: 칸 폭은 widen()이 정하고(표 폭 = 칸 폭 합), 상세보다 좁으면 상세 폭까지 늘어난다. 한글은 낱말 단위로 줄바꿈 */
table.wide{table-layout:fixed;min-width:100%}
table.wide td{word-break:keep-all;overflow-wrap:anywhere}
.main img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;margin:12px 0 4px;cursor:zoom-in}
.main p>em:only-child{display:block;font-size:12.5px;color:var(--ink-3);font-style:normal}
/* 대분류를 고르면 하위 항목을 폴더 모양 카드로 보여 준다(색은 순서대로 돌아가며, 글자는 어두운 색 고정)
   모양: 안쪽 .fd를 clip-path로 폴더(왼쪽 위 탭)로 자르고, 바깥 버튼의 drop-shadow 네 겹으로 테두리를 그린다 */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px 22px;margin-top:22px}
.kid{display:flex;padding:0;border:0;background:none;text-align:left;color:#1d1f23;
  filter:drop-shadow(1px 0 0 #6b6f76) drop-shadow(-1px 0 0 #6b6f76) drop-shadow(0 1px 0 #6b6f76) drop-shadow(0 -1px 0 #6b6f76);transition:transform .15s}
.kid:hover{transform:translateY(-3px)}
.kid:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.kid .fd{flex:1;display:flex;flex-direction:column;min-height:150px;padding:30px 18px 14px;background:var(--f,#e8eef9);
  clip-path:polygon(0 0,40% 0,calc(40% + 18px) 18px,100% 18px,100% 100%,0 100%)}
.kid .ico{width:9px;height:9px;border:1.3px solid currentColor;border-radius:1px;margin-bottom:12px}
.kid i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75;line-height:1.4;margin-bottom:2px}
.kid b{display:block;font-size:17px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.kid small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:12.5px;line-height:1.5;opacity:.8;margin-top:6px}
.kid .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:14px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.kid .ft span:last-child{font-size:18px;font-weight:400;letter-spacing:0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.docpath{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 0;font-size:12.5px;color:var(--ink-3)}
.docpath code{padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px}
.docpath span{color:var(--ink-3)}
/* 창 높이에 맞춤(넓은 화면): 왼쪽 목차와 오른쪽 상세를 같은 높이로, 스크롤은 각자 안에서. 높이는 fit()이 --fit으로 정한다 */
.layout.fit{height:var(--fit);align-items:stretch}
.layout.fit .side{position:static;max-height:none;height:100%}
.layout.fit .main{height:100%;overflow:auto;min-height:0}
html.embed.fitted,html.embed.fitted body{overflow:hidden}
/* 화면 정의서(meta.view 'screens'): 왼쪽 메뉴별 화면 목록 · 오른쪽 화면 정보 · 반영 대기 목록 */
:root{--sc-warn:#b35900;--sc-warn-soft:#fff1e0}
:root[data-theme="dark"]{--sc-warn:#f0a24f;--sc-warn-soft:#38270f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sc-warn:#f0a24f;--sc-warn-soft:#38270f}}
.sc-grp>.node .sc-cnt{margin-left:auto;color:var(--ink-3);font-size:12.5px;font-weight:600}
.tree ul.sc-list{border-left:0;margin:2px 0 6px;padding:0}
.sc-it{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:0;background:none;border-radius:9px;padding:9px 12px;color:var(--ink);cursor:pointer}
.sc-it:hover{background:var(--surface-2)}
.sc-it.cur{background:var(--accent-soft)}
.sc-it b{font-size:14.5px;font-weight:700;line-height:1.35}
.sc-it span{font-size:12.5px;color:var(--ink-3)}
.sc-it i{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;font-style:normal}
.sc-chip{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);font-size:11.5px;font-style:normal;font-weight:600;white-space:nowrap}
.sc-chip.warn{background:var(--sc-warn-soft);color:var(--sc-warn)}
.sc-chip.big{font-size:12.5px;padding:3px 10px;border-radius:8px}
.sc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.sc-title{margin:0;font-size:22px;font-weight:800;line-height:1.3}
.sc-sub{margin:4px 0 0!important;color:var(--ink-2);font-size:14px}
.sc-pv{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 16px;border-radius:12px;background:var(--sc-warn-soft);color:var(--ink);font-size:14px;margin:0 0 14px}
.sc-pv b{color:var(--sc-warn)}
.sc-pvst{color:var(--sc-warn);font-size:12.5px}
.sc-info{display:grid;grid-template-columns:160px minmax(0,1fr);gap:8px 16px;margin:0 0 6px;padding:16px 20px;border-radius:12px;background:var(--surface-2);font-size:14px}
.sc-info dt{color:var(--ink-3)}
.sc-info dd{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sc-info a{color:var(--accent)}
.sc-id{display:inline-block;padding:1px 8px;border-radius:6px;border:0;background:var(--accent-soft);color:var(--accent);font:12.5px "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;cursor:default}
button.sc-id{cursor:pointer}
button.sc-id:hover{text-decoration:underline}
.sc-muted{color:var(--ink-3);font-size:13px}
.main h3.sc-h{font-size:17px;margin:24px 0 10px}
.sc-filter{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.sc-filter button{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:inherit;font-size:13px;cursor:pointer}
.sc-filter button b{font-weight:700}
.sc-filter button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
table.sc-fix{width:100%;font-size:13.5px}
table.sc-fix td{vertical-align:top}
table.sc-fix td.k{white-space:nowrap}
.sc-st{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.sc-st.ok{background:var(--ok-soft);color:var(--ok)}
.sc-st.warn{background:var(--sc-warn-soft);color:var(--sc-warn)}
.sc-st.off{color:var(--ink-3)}
.sc-body{border-top:1px solid var(--line);padding-top:6px}
@media (max-width:760px){ .sc-info{grid-template-columns:1fr} .sc-head{flex-direction:column} }
/* 이전 · 다음 버튼: 폭 · 높이 고정(긴 이름은 두 줄까지, 넘치면 …, 마우스를 올리면 전체 이름) */
.pager button{flex:none;width:280px;max-width:calc(50% - 5px);height:68px;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:8px;padding:8px 14px;font-size:13.5px;line-height:1.35;text-align:left}
.pager button.nx{text-align:right;margin-left:auto}
.pager .pg-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.pager button:hover{background:var(--accent);color:#fff}
:root[data-theme="dark"] .pager button:hover{color:#0f1115}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pager button:hover{color:#0f1115}}
.pager button small{display:block;color:inherit;opacity:.75;font-weight:600;font-size:11.5px}
.empty{text-align:center;color:var(--ink-3);padding:60px 0}
details.how{border:1px solid var(--line);border-radius:var(--card-r);padding:12px 20px;margin:0 0 var(--gap);font-size:14px;background:var(--surface);box-shadow:var(--shadow)}
details.how summary{cursor:pointer;font-weight:700}
details.how pre{white-space:pre-wrap}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.86);display:none;flex-direction:column;align-items:center;justify-content:flex-start;overflow:auto;padding:48px 16px 24px}
.lb.on{display:flex}
.lb img{max-width:min(1600px,100%);height:auto;background:#fff;border-radius:6px}
.lb .cap{color:#e8ebf0;font-size:14px;margin-bottom:10px}
.lb button{position:fixed;top:12px;right:16px;font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid #555;background:#1e232b;color:#fff;cursor:pointer}
/* 항목 수정 */
.sec-row{display:flex;align-items:flex-start;gap:10px}
.sec-row h2.sec{flex:1}
/* 머리 오른쪽 버튼: 수정 요청(지금 항목) · 수정 이력 */
.app-head-act .btn{padding:6px 12px;font-size:13px;white-space:nowrap;color:var(--ink-2)}
.app-head-act .btn:hover{color:var(--accent)}
.app-head-act .btn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.editor textarea{width:100%;min-height:180px;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:14px/1.6 Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;resize:vertical}
.editor input{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-top:8px}
.editor .tip{font-size:12.5px;color:var(--ink-3);margin:6px 0 0}
.edit-pane{margin:28px 0 8px;padding:18px 20px;border:2px solid var(--accent);border-radius:12px;background:var(--surface)}
.edit-pane h3{margin:0 0 10px;font-size:16px;font-weight:800}
.editor .act{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
:root[data-theme="dark"] .btn.pri{color:#0f1115}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#0f1115}}
/* 가이드 수정 반영: 안내 → 고쳐야 할 화면 → 반영 여부 → 수정 요청 */
.fix{background:var(--surface);border:1px solid #f0c27a;border-radius:12px;padding:14px 18px;margin:0 0 16px;box-shadow:var(--shadow)}
.fix h3{margin:0 0 4px;font-size:15px}
.fix p{margin:4px 0;font-size:13.5px;color:var(--ink-2)}
.fix .steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;font-size:12px}
.fix .steps span{padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.fix .steps span.on{background:#fff1e0;color:#b35900;font-weight:700}

  // 문서 경로 보기: 「rules/../constitution.md」 → 「constitution.md」(깃 저장소의 실제 위치)
  function npath(p){ var o = []; String(p).split('/').forEach(function(s){ if (s === '..') o.pop(); else if (s && s !== '.') o.push(s); }); return o.join('/'); }

  function chunk(m, path, t, lv){

  function combine(m, texts){

        } else if (j.status === '완료') {
          var next = spec || mine;
          h += '<section class="fix" id="fix"><h3>Claude가 ' + DOC + ' 수정을 마쳤습니다' + (spec ? ' — 연관된 화면 · 문서도 고쳐야 할 수 있습니다' : mine ? ' — 이미 작업한 화면도 고쳐야 할 수 있습니다' : '') + '</h3>' + steps(next ? 2 : 1) +
            '<p>요청: ' + esc(what) + '</p>' + (j.note ? '<p>고친 내용: ' + esc(j.note) + '</p>' : '') +
            (spec
              ? '<p>Claude가 바뀐 내용과 연관된 곳을 찾아 목록을 만듭니다: ' + (meta.fileKey ? '<b>' + esc(names[meta.fileKey] || meta.fileName || meta.fileKey.slice(0, 6)) + '</b> 수정 가능 페이지의 화면 · ' : '') + '같은 내용을 쓰는 다른 UX 문서 항목 · 프로토타입. 무엇을 어떻게 고칠지 보고 반영할 것만 고르면 됩니다(아직 아무것도 고치지 않습니다).</p>' +
                '<div class="act"><button type="button" class="btn pri" data-check="' + j.id + '">연관 항목 찾기 요청</button><button type="button" class="btn" data-done="' + j.id + '">나중에</button></div>'
              : mine
              ? '<p>이 가이드는 내 <b>' + esc(appliedKeys().map(function(k){ return names[k] || k.slice(0, 6); }).join(', ')) + '</b> 파일 작업 기준입니다. Claude가 그 파일의 수정 가능 페이지에서 바뀐 내용과 다른 화면을 찾아 목록을 만듭니다(Figma는 아직 고치지 않습니다).</p>' +
                '<div class="act"><button type="button" class="btn pri" data-check="' + j.id + '">고칠 화면 찾기 요청</button><button type="button" class="btn" data-done="' + j.id + '">나중에</button></div>'
              : '<div class="act"><button type="button" class="btn" data-done="' + j.id + '">확인</button></div>') + '</section>';
        } else {
          h += '<section class="fix"><h3>가이드 수정 요청 · ' + esc(j.status) + '</h3><p>요청: ' + esc(what) + '</p><p>' + esc(j.note || '') + '</p><div class="act"><button type="button" class="btn" data-done="' + j.id + '">닫기</button></div></section>';
        }
      });
      jobs.forEach(function(j){
        var sp = j.scope === 'spec', file = j.fileKey ? names[j.fileKey] || j.fileKey.slice(0, 6) : '';
        var where = sp ? '연관 항목' : '고칠 화면', head = (file ? file + ' · ' : '') + where;
        if (j.status === '대기' || j.status === '진행 중') {
          h += '<section class="fix"><h3>' + esc(head) + '을 찾는 중</h3>' + steps(2) + '<p>' + esc(j.note || 'Claude가 바뀐 내용(' + (j.text || '') + ')과 ' + (sp ? '연관된 화면 · 문서 · 프로토타입' : '다른 화면') + '을 찾고 있습니다. 끝나면 여기에 목록이 나옵니다.') + '</p></section>';
        } else if (j.status === '완료') {
          var items = j.items || [];
          if (!items.length) {
            h += '<section class="fix"><h3>' + esc(head) + '이 없습니다</h3>' + steps(3) + '<p>' + esc(j.note || '바뀐 내용과 연관된 곳을 찾지 못했습니다.') + '</p><div class="act"><button type="button" class="btn" data-skip="' + j.id + '">확인</button></div></section>';
            return;
          }
          var ed = editPage[j.fileKey] || '';
          h += '<section class="fix" data-job="' + j.id + '"><h3>' + esc(head) + ' ' + items.length + '개 — 반영할지 골라 주세요</h3>' + steps(3) +
            '<p>바뀐 내용: ' + esc(j.text || '') + '. 반영할 항목을 고르고 [선택한 항목 수정 요청]을 누르면 화면은 Workbench 수정 요청, 문서는 그 문서의 수정 요청, 프로토타입은 프로토타입 수정 요청으로 등록되고 요청 감시 중인 Claude가 차례로 반영합니다.</p>' +
            '<ul>' + items.map(function(it, i){
              var t = itemType(it), hd = itemHead(it), ro = t === 'screen' && ed && it.page && it.page !== ed;
              return '<li><input type="checkbox" id="fx' + j.id + i + '" data-i="' + i + '"' + (ro ? ' disabled' : ' checked') + '><label for="fx' + j.id + i + '"><b>' + (sp ? '<span class="kd kd-' + t + '">' + KIND[t] + '</span> ' : '') + esc(hd.title) + '</b>' +
                '<small>' + esc(hd.sub + (ro ? ' · 보기 전용 페이지라 반영할 수 없음' : '')) + '</small>' + esc(it.change || '') + '</label></li>';
            }).join('') + '</ul>' +
            '<div class="act"><button type="button" class="btn pri" data-apply="' + j.id + '">선택한 ' + (sp ? '항목' : '화면') + ' 수정 요청</button><button type="button" class="btn" data-skip="' + j.id + '">반영하지 않음</button></div></section>';
        } else {
          h += '<section class="fix"><h3>' + esc(head) + ' 찾기 ' + esc(j.status) + '</h3><p>' + esc(j.note || '') + '</p><div class="act"><button type="button" class="btn" data-skip="' + j.id + '">닫기</button></div></section>';
        }
      });
      $('fixes').innerHTML = h;
      if (location.hash === '#fix' && h) { var f = $('fixes').firstElementChild; if (f) f.scrollIntoView(); }
    });
  }
  setInterval(function(){ if (!document.hidden && !editing) fixes(); }, 10000);

  $('fixes').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    /* 고친 결과를 확인함(이미 작업한 화면 확인은 하지 않음) */
    if (b.dataset.done) {
      post('/api/jobs', { action: 'update', id: b.dataset.done, status: '확인', note: (edits.filter(function(x){ return x.id === b.dataset.done; })[0] || {}).note || '' }).then(fixes).catch(function(x){ alert(x.message); });
      return;
    }
    if (b.dataset.check) {
      var ej = edits.filter(function(x){ return x.id === b.dataset.check; })[0]; if (!ej) return;
      b.disabled = true;
      var note = '「' + (ej.name || '') + '」 ' + (ej.note || ej.text || '');
      /* UX가이드 외 카테고리: 그 문서의 기준 파일(없으면 파일 없이) 하나로, 화면 · 문서 · 프로토타입을 찾는다. UX가이드: 내 작업 기준 파일마다 화면을 찾는다 */
      var keys = isDocKind(meta.kind) ? [meta.fileKey || ''] : appliedKeys();
      Promise.all(keys.map(function(k){
        return post('/api/jobs', { action: 'add', kind: 'guide-check', guide: id, fileKey: k, scope: isDocKind(meta.kind) ? 'spec' : '', name: meta.title || id, text: note, revFrom: ej.revFrom || 'guide.md', revTo: ej.revTo || '', by: user() });
      })).then(function(){ return post('/api/jobs', { action: 'update', id: ej.id, status: '확인', note: ej.note || '' }); })
        .then(function(){ fixes(); toast('요청했습니다. Claude가 ' + (isDocKind(meta.kind) ? '연관 항목' : '고칠 화면') + '을 찾으면 여기에 목록이 나옵니다.'); })
        .catch(function(x){ b.disabled = false; alert(x.message || '요청하지 못했습니다.'); });
      return;
    }
    if (b.dataset.skip) {
      post('/api/jobs', { action: 'update', id: b.dataset.skip, status: '반영 안 함', note: (user() || '사용자') + '가 반영하지 않기로 함' }).then(fixes).catch(function(x){ alert(x.message); });
      return;
    }
    if (b.dataset.apply) {
      var j = jobs.filter(function(x){ return x.id === b.dataset.apply; })[0]; if (!j) return;
      var sec = b.closest('.fix'), picks = Array.prototype.filter.call(sec.querySelectorAll('input[type=checkbox]'), function(c){ return c.checked; }).map(function(c){ return j.items[+c.dataset.i]; });
      if (!picks.length) { alert('반영할 항목을 하나 이상 고르세요.'); return; }
      if (!confirm('항목 ' + picks.length + '개를 수정 요청으로 등록할까요?\n요청 감시 중인 Claude가 바뀐 내용대로 차례로 고칩니다.')) return;
      b.disabled = true;
      var ed = editPage[j.fileKey] || '', ids = [], DOCN = kindName(meta.kind);
      var why = '「' + (meta.title || id) + '」 ' + DOCN + ' 수정(' + (j.text || '') + ')에 맞게 고쳐 주세요. ';
      /* 한 건씩 차례로 등록(번호가 겹치지 않게): 화면 → Workbench 수정 요청, 문서 → 그 문서의 수정 요청(guide-edit), 프로토타입 → 프로토타입 수정 요청 */
      picks.reduce(function(p, it){
        return p.then(function(){
          var t = itemType(it);
          if (t === 'doc') {
            var dd = docs[it.doc] || {};
            return post('/api/jobs', { action: 'add', kind: 'guide-edit', guide: it.doc, fileKey: dd.fileKey || j.fileKey || '', name: it.section || '', text: '[' + DOCN + ' 반영] ' + why + (it.change || ''), by: user() || j.by || '' })
              .then(function(d){ ids.push((d.job && d.job.id) || '문서'); });
          }
          if (t === 'proto') {
            return post('/api/jobs', { action: 'add', kind: 'prototype-edit', proto: it.proto, fileKey: it.fileKey || j.fileKey || '', name: it.name || '', frames: it.nodeId ? [{ nodeId: it.nodeId, name: it.frame || '' }] : [], text: '[' + DOCN + ' 반영] ' + why + (it.change || ''), by: user() || j.by || '' })
              .then(function(d){ ids.push((d.job && d.job.id) || '프로토타입'); });
          }
          return post('/api/requests', { action: 'add', nodeId: it.nodeId || '', frame: it.frame || '', page: it.page || ed, fileKey: j.fileKey, fileName: names[j.fileKey] || '',
            editable: !ed || (it.page || ed) === ed, type: DOCN + ' 반영', priority: '보통', layout: '',
            text: '[' + DOCN + ' 반영] ' + why + (it.change || ''), by: user() || j.by || '' })
            .then(function(d){ if (d.items && d.items[0]) ids.push(d.items[0].id); });
        });
      }, Promise.resolve()).then(function(){
        return post('/api/jobs', { action: 'update', id: j.id, status: '반영', note: '수정 요청 ' + ids.length + '건 등록: ' + ids.join(', ') });
      }).then(function(){ fixes(); toast('수정 요청 ' + ids.length + '건(' + ids.join(', ') + ')을 등록했습니다. Workbench · 변경 이력에서 진행 상황을 볼 수 있습니다.'); })
        .catch(function(x){ b.disabled = false; alert(x.message || '등록하지 못했습니다.' + (ids.length ? ' (등록된 요청: ' + ids.join(', ') + ')' : '')); });
    }
  });

  $('tree').addEventListener('click', function(e){
    var sg = e.target.closest('[data-scg]'); if (sg) { scOpen[sg.dataset.scg] = !scOpen[sg.dataset.scg]; scTree($('q').value.trim().toLowerCase()); return; }
    var si = e.target.closest('[data-sc]'); if (si) { scShow(si.dataset.sc); return; }
    var tw = e.target.closest('[data-tw]');
    if (tw) { var g = byId[tw.dataset.tw]; open[g.id] = !tw.classList.contains('open'); tree($('q').value.trim().toLowerCase()); return; }
    var b = e.target.closest('[data-id]'); if (b) show(b.dataset.id);
  });
  /* ── 수정 요청 입력창(목록 아래, Workbench처럼): 지금 보는 항목을 대상으로 guide-edit 작업을 쌓는다 ── */
  function askTarget(){
    if (SC) { var c = SC.byCid[scCur]; return c ? { name: c.cid + ' ' + (c.o.title || ''), file: c.file, fileKey: '' } : null; }
    if (!cur) return null;
    if (FILES && !cur.file) return null;   // 파일형 문서의 폴더 대분류는 고칠 파일이 없다
    return { name: cur.label, file: cur.file || '', fileKey: meta.fileKey };
  }
  function askSet(){
    var t = askTarget();
    $('askTarget').textContent = t ? t.name : '항목을 고르세요';
    $('ask').setAttribute('aria-disabled', t ? 'false' : 'true');
    $('askText').placeholder = t ? '「' + t.name + '」에서 무엇을 어떻게 고칠지 적어 주세요.\n예) 3조 2항의 표현을 「…」로 바꿔 줘' : '왼쪽 목록에서 고칠 항목을 고르세요.';
  }
  $('ask').addEventListener('submit', function(e){
    e.preventDefault();
    var t = askTarget(), text = $('askText').value.trim();
    if (!t) return;
    if (!text) { $('askMsg').textContent = '고칠 내용을 적어 주세요.'; $('askText').focus(); return; }
    $('askSend').disabled = true; $('askMsg').textContent = '보내는 중…';
    post('/api/jobs', { action: 'add', kind: 'guide-edit', guide: id, fileKey: t.fileKey || '', name: t.name, text: text, by: user(), file: t.file })
      .then(function(){ $('askText').value = ''; $('askMsg').textContent = ''; fixes(); toast('「' + t.name + '」 수정 요청을 보냈습니다. Claude가 고치면 입력창 위에 결과가 나옵니다.'); })
      .catch(function(x){ $('askMsg').textContent = x.message || '요청하지 못했습니다.'; })
      .then(function(){ $('askSend').disabled = false; });
  });
  $('askText').addEventListener('keydown', function(e){ if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('ask').requestSubmit(); } });
  // 머리의 [수정 요청]은 입력창으로 이동
  $('editBtn').onclick = function(){ $('askText').focus(); $('ask').scrollIntoView({ block: 'nearest' }); };
  ['revBox'].forEach(function(pid){
    $('revBtn').onclick = function(){ var on = $(pid).hidden; panel(pid, on); if (on) $(pid).scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
    $(pid).addEventListener('toggle', function(){ if (!this.open && !this.hidden) panel(pid, false); });
  });
  $('main').addEventListener('click', function(e){
    if (SC) {
      var fk = e.target.closest('[data-kind]'); if (fk) { scKind = fk.dataset.kind; scFix(); return; }
      var sc = e.target.closest('[data-sc]'); if (sc) { scShow(sc.dataset.sc); return; }
    }
    if (e.target.closest('[data-edit]')) { edit(); return; }
    var go = e.target.closest('[data-go]'); if (go) { show(go.dataset.go); return; }
    var im = e.target.closest('img'); if (!im || editing) return;
    $('lbImg').src = im.src; $('lbCap').textContent = im.alt || ''; $('lb').classList.add('on');
  });
  /* 검색: 제목 · 내용에 글자가 있는 항목만 트리에 남긴다 */
  $('q').addEventListener('input', function(){ tree(this.value.trim().toLowerCase()); });
  $('tocBtn').onclick = function(){ var f = $('side').classList.toggle('fold'); this.setAttribute('aria-expanded', String(!f)); };
  window.addEventListener('hashchange', function(){ var h = decodeURIComponent(location.hash.slice(1)); if (SC) { h = scFind(h); if (SC.byCid[h] && h !== scCur) scShow(h); return; } h = findSec(h); if (byId[h] && byId[h] !== cur) show(h); });
  /* 주소 #… 로 항목 열기: #s3(항목 번호) · #f=com/POL-COM-001.md(파일) · #POL-COM-001(정책 · 항목 ID) · 화면 정의서는 #LI-INS-01-P(CID) */
  function findSec(h){
    if (!h || byId[h]) return h;
    var f = /^f=(.+)$/.exec(h), s;
    if (f) s = secs.filter(function(x){ return x.file === f[1]; })[0];
    else s = secs.filter(function(x){ return x.level && (String(x.label).indexOf(h + ' ') === 0 || x.label === h || (x.file && x.file.replace(/^.*\//, '') === h + '.md')); })[0];
    return s ? s.id : h;
  }
  function scFind(h){
    if (!h || SC.byCid[h]) return h;
    var f = /^f=(.+)$/.exec(h); if (!f) return h;
    var hit = Object.keys(SC.byCid).filter(function(c){ return SC.byCid[c].file === f[1]; })[0];
    return hit || h;
  }
  /* 문서 안 링크(예: [terms.csv](terms.csv), ../policy/service-mode.md): 그 파일 기준 상대 경로라 보기 화면 주소로는 열리지 않는다.
     → 이 문서의 파일이면 그 항목으로, 다른 UX 문서의 파일이면 그 문서 보기로, 그 밖은 원본 파일을 새 탭으로 */
  $('main').addEventListener('click', function(e){
    var a = e.target.closest('a[href]'); if (!a) return;
    var href = a.getAttribute('href') || '';
    if (/^(https?:|mailto:|#|\/)/i.test(href) || /UX_Guide\.html|Common_UX_Guide\.html|Work\.html/.test(href)) return;
    e.preventDefault();
    var curFile = SC ? (SC.byCid[scCur] && SC.byCid[scCur].file) : (cur && cur.file);
    var dir = (id + '/' + fdirOf(meta) + (curFile ? curFile.replace(/[^\/]*$/, '') : ''));
    var target = npath(dir + href.split('#')[0]);   // .history/guides 기준 경로(예: glossary/terms.csv)
    var mine = npath(id + '/' + fdirOf(meta));
    if (FILES && target.indexOf(mine + '/') === 0 || (FILES && !mine)) {
      var rel = mine ? target.slice(mine.length + 1) : target;
      // 이 문서의 파일(문서 폴더 밖 파일은 meta.files의 ../ 경로와 맞춘다)
      var fp = (FILES || []).filter(function(x){ return x.path === rel || npath(mine + '/' + x.path) === target; })[0];
      if (fp) { location.hash = 'f=' + fp.path; return; }
    }
    if (FILES) { var up = (FILES || []).filter(function(x){ return npath(id + '/' + fdirOf(meta) + x.path) === target; })[0]; if (up) { location.hash = 'f=' + up.path; return; } }
    var seg = target.split('/')[0], rest = target.slice(seg.length + 1);
    if (['rules', 'policy', 'glossary', 'screens'].indexOf(seg) >= 0 && seg !== id && rest) { location.href = 'UX_Guide.html?g=' + seg + (document.documentElement.classList.contains('embed') ? '&embed=1' : '') + '#f=' + encodeURIComponent(rest); return; }
    if (target === 'constitution.md') { location.href = 'UX_Guide.html?g=rules' + (document.documentElement.classList.contains('embed') ? '&embed=1' : '') + '#f=' + encodeURIComponent('../constitution.md'); return; }
    window.open('.history/guides/' + target, '_blank', 'noopener');
  });
  window.addEventListener('beforeunload', function(e){ if (editing) { e.preventDefault(); e.returnValue = ''; } });
  function closeLb(){ $('lb').classList.remove('on'); $('lbImg').removeAttribute('src'); }
  $('lbClose').onclick = closeLb;
  $('lb').addEventListener('click', function(e){ if (e.target === this) closeLb(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeLb(); });
})();
</script>
<script src="appnav.js" defer></script>
</body>
</html>
