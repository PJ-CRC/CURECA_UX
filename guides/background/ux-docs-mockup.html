<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일정·UX 문서 예시</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f3f6fb; --ink:#14171c; --ink-2:#4a5260; --ink-3:#7a8392;
  --line:#e3e7ee; --accent:#2747d8; --accent-soft:#e6ebff; --red:#d93025; --red-soft:#fdecea;
  --ok:#1a7f37; --ok-soft:#e3f4e8; --warn:#9a5b00; --warn-soft:#fff3dc; --code-bg:#eef1f6;
  --grp:#7c3aed; --grp-soft:#f1eafe;
  --r:12px; --gap:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#171a20; --surface-2:#1e232b; --ink:#e8ebf0; --ink-2:#b4bcc8; --ink-3:#8590a0;
    --line:#2a3039; --accent:#8ea2ff; --accent-soft:#232c52; --red:#ff7b72; --red-soft:#3a1f1e;
    --ok:#56d364; --ok-soft:#16301d; --warn:#f0a24f; --warn-soft:#3a2a12; --code-bg:#222831;
    --grp:#c4a5ff; --grp-soft:#2c2244;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a20; --surface-2:#1e232b; --ink:#e8ebf0; --ink-2:#b4bcc8; --ink-3:#8590a0;
  --line:#2a3039; --accent:#8ea2ff; --accent-soft:#232c52; --red:#ff7b72; --red-soft:#3a1f1e;
  --ok:#56d364; --ok-soft:#16301d; --warn:#f0a24f; --warn-soft:#3a2a12; --code-bg:#222831;
  --grp:#c4a5ff; --grp-soft:#2c2244;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1440px;margin:0 auto;padding:20px 24px 48px}
@media (max-width:760px){.wrap{padding:16px 16px 40px}}

/* 머리 */
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.head h1{margin:0;font-size:22px;letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--ink-2)}
.head-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ver{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600}
.ver small{color:var(--ink-3);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.search{min-width:0;width:220px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
@media (max-width:760px){.search{width:100%}}
.tog{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);cursor:pointer}

/* 탭 */
.tabs{display:flex;gap:2px;box-shadow:inset 0 -1px 0 var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:var(--gap)}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ink-2);font-weight:600;font-size:14.5px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tabs .cnt{font-size:12px;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.tabs .cnt.hot{background:var(--warn-soft);color:var(--warn)}

/* 설명 */
.note{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin-bottom:var(--gap);display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.note b{color:var(--accent);white-space:nowrap}
.note span{color:var(--ink)}
body.no-note .note{display:none}

/* 2단 */
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:var(--gap);align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list{padding:8px;max-height:calc(100vh - 220px);overflow:auto}
@media (max-width:900px){.list{max-height:none}}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:6px 6px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;cursor:pointer;color:var(--ink-2);font-size:13px}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.addbtn{margin-left:auto;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:600}
details.grp{margin:2px 0}
details.grp>summary{list-style:none;cursor:pointer;padding:6px 8px;border-radius:8px;color:var(--ink-2);font-weight:700;font-size:13px;display:flex;justify-content:space-between}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"▸";margin-right:6px;color:var(--ink-3)}
details.grp[open]>summary::before{content:"▾"}
details.grp>summary span:first-child{flex:1}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item .t{display:block;font-weight:600}
.item .s{display:block;color:var(--ink-3);font-size:12.5px;margin-top:1px}
.item .bs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.item.hide{display:none}

/* 배지·칩 */
.b{display:inline-block;font-size:12px;line-height:18px;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.b.ok{background:var(--ok-soft);color:var(--ok)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.red{background:var(--red-soft);color:var(--red)}
.b.acc{background:var(--accent-soft);color:var(--accent)}
.b.grp{background:var(--grp-soft);color:var(--grp)}
.b.ex{background:none;border:1px dashed var(--ink-3);color:var(--ink-3);line-height:16px}
.id{display:inline-block;font:12.5px/20px ui-monospace,Consolas,monospace;padding:0 7px;border-radius:6px;background:var(--code-bg);color:var(--accent);border:0;cursor:pointer;margin:1px 2px 1px 0}
.id:hover{text-decoration:underline}

/* 문서 */
.doc{padding:20px 24px;min-height:420px}
@media (max-width:760px){.doc{padding:16px}}
.dhead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.dhead h2{margin:0;font-size:19px}
.dhead .sub{color:var(--ink-2);margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0f1115}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#0f1115}}
.btn.dan{color:var(--red);border-color:var(--red)}
a.btn{display:inline-block;text-decoration:none;color:var(--ink)}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 14px;margin:0 0 16px;padding:12px 14px;background:var(--surface-2);border-radius:10px}
@media (max-width:560px){.kv{grid-template-columns:minmax(0,1fr)}}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.doc h3{font-size:15px;margin:20px 0 8px}
.doc ol,.doc ul{margin:0;padding-left:20px}
.doc li{margin:3px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2);color:var(--ink-2);font-weight:600;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.banner{border-radius:10px;padding:10px 14px;margin:0 0 14px;background:var(--warn-soft);color:var(--ink)}
.banner b{color:var(--warn)}
.banner.grp{background:var(--grp-soft)}
.banner.grp b{color:var(--grp)}
.skel{height:10px;border-radius:6px;background:var(--surface-2);margin:10px 0}
.skel.s2{width:82%}.skel.s3{width:64%}
.muted{color:var(--ink-3)}
.ab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.ab{grid-template-columns:minmax(0,1fr)}}
.ab>div{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ab h4{margin:0 0 6px;font-size:14px}
.confirm{border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin:0 0 14px;background:var(--accent-soft)}
.confirm textarea{width:100%;min-height:56px;margin:6px 0;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface)}
.confirm .warnline{color:var(--warn);font-weight:600;margin-bottom:6px}
.confirm .err{color:var(--red);font-size:13px;min-height:18px}
.result{border-radius:10px;padding:12px 14px;margin:0 0 14px;background:var(--ok-soft)}
.result code{background:var(--surface);padding:0 4px;border-radius:4px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.reset{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}

/* 프로그램 위쪽 메뉴 (Figma AI Run) */
.appnav{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:20px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;white-space:nowrap}
.navs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.navs button{flex:none;border:0;background:none;padding:9px 14px;border-radius:10px;font-size:15px;color:var(--ink);cursor:pointer;white-space:nowrap}
.navs button:hover{background:var(--surface-2)}
.navs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navs button .new{font-size:10px;font-weight:700;color:#fff;background:var(--red);border-radius:999px;padding:0 5px;margin-left:4px;vertical-align:2px}
.nav-r{display:flex;gap:8px;align-items:center;flex:none}
.pill{font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:4px 10px}
.btn.blue{background:#1570ef;border-color:#1570ef;color:#fff}
@media (max-width:900px){.nav-r .pill,.nav-r .btn{display:none}.appnav{padding:0 16px}}
.demo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:flex-end;padding:6px 24px;border-bottom:1px dashed var(--line);font-size:13px;color:var(--ink-3)}
@media (max-width:760px){.demo{padding:6px 16px;justify-content:flex-start}}
.head h1{font-size:28px}
.btn.big{padding:10px 18px;background:var(--accent);border-color:var(--accent);color:#fff;border-radius:10px}
:root[data-theme="dark"] .btn.big{color:#0f1115}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.big{color:#0f1115}}
.placeholder{padding:60px 20px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}

/* 일정 (간트) */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tools select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-left:auto;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.gwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:calc(100vh - 290px)}
.gt{border-collapse:separate;border-spacing:0;font-size:12.5px}
.gt th,.gt td{border-bottom:1px solid var(--line);white-space:nowrap;padding:0}
.gt thead th{position:sticky;background:var(--surface-2);z-index:3;color:var(--ink-2);font-weight:600}
.gt thead tr:nth-child(1) th{top:0;height:26px}
.gt thead tr:nth-child(2) th{top:26px;height:22px}
.gt thead tr:nth-child(3) th{top:48px;height:20px;font-weight:500;color:var(--ink-3)}
.gt .c{position:sticky;background:var(--surface);z-index:2;padding:6px 8px;text-align:left}
.gt thead .c{z-index:4;background:var(--surface-2)}
.gt .c1{left:0;width:300px;min-width:300px;max-width:300px;white-space:normal}
.gt .c2{left:300px;width:96px;min-width:96px;padding:4px}
.gt .c3{left:396px;width:128px;min-width:128px;padding:4px}
.gt .c4{left:524px;width:96px;min-width:96px;padding:4px;border-right:1px solid var(--line)}
@media (max-width:760px){.gt .c1{width:200px;min-width:200px;max-width:200px}.gt .c2{left:200px}.gt .c3{left:296px}.gt .c4{left:424px}}
.gt .d{width:22px;min-width:22px;text-align:center;border-left:1px solid var(--line)}
.gt .d.mon{border-left:1px solid var(--ink-3)}
.gt td.d{height:30px}
.gt .today{box-shadow:inset 2px 0 0 var(--red),inset -2px 0 0 var(--red)}
.gt thead .today{color:var(--red)}
.gt td.ux{background:#d9ead3}.gt td.ui{background:#fff2cc}.gt td.now{background:#12cc44}
:root[data-theme="dark"] .gt td.ux{background:#2b4a2a} :root[data-theme="dark"] .gt td.ui{background:#4a4220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gt td.ux{background:#2b4a2a}:root:not([data-theme="light"]) .gt td.ui{background:#4a4220}}
.gt tr.gh td{background:var(--surface-2);font-weight:700;color:var(--ink-2)}
.gt tr.gh td.c{background:var(--surface-2)}
.gt tr.sub .c1{padding-left:26px;color:var(--ink-2)}
.plat{display:inline-block;font-size:11px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:6px}
.tbd{color:var(--ink-3);font-size:12px;padding-left:8px}
.cell-in{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;padding:4px 6px;font-size:12.5px}
.cell-in:hover,.cell-in:focus{border-color:var(--line);background:var(--surface)}
.per{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:4px 6px;font-size:12.5px;cursor:pointer;text-align:left}
.per.empty{color:var(--ink-3);border-style:dashed}
.perpop{position:absolute;z-index:30;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:12px 14px;display:grid;gap:8px}
.perpop label{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:8px;font-size:13px}
.perpop input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface)}
.perpop .err{color:var(--red);font-size:12.5px}

/* 이번 주 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:default}
.tile .k{color:var(--ink-2);font-size:13px}
.tile .v{font-size:26px;font-weight:700;margin-top:2px}
.tile .s{color:var(--ink-3);font-size:12.5px}
.tile[data-gotab]{cursor:pointer}
.tile[data-gotab]:hover{border-color:var(--accent)}
.weekhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.weekhead h2{margin:0;font-size:18px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.box h3{margin:0 0 8px;font-size:15px}
.mtext{white-space:pre-wrap;line-height:1.7}
.chipbtn.chk[aria-pressed="false"]{opacity:.55}
.tbl.bl tr.blm{cursor:pointer}
.tbl.bl tr.blm:hover td{background:var(--surface-2)}
.tbl.bl tr.bls>td{background:var(--surface-2);padding:8px 12px 12px}
.bar{position:relative;height:20px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);border-right:2px solid var(--accent)}
.bar span{position:relative;padding-left:8px;font-weight:700;line-height:20px}
.segbar{display:flex;gap:0;margin:0 0 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content;max-width:100%;background:var(--surface)}
.segbar button{border:0;background:none;padding:9px 18px;font-weight:600;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.segbar button+button{border-left:1px solid var(--line)}
.segbar button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.chat{border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin:0 0 16px;background:var(--surface-2);display:grid;gap:10px}
.chat textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface)}
.msg{display:grid;gap:2px}
.msg .who{font-size:12px;color:var(--ink-3);font-weight:600}
.msg.me{justify-items:end}
.msg .bub{max-width:92%;border-radius:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--line)}
.msg.me .bub{background:var(--accent-soft);border-color:transparent}
.sumbox{margin-top:6px}
.sumbox ul{margin:4px 0 0}
</style>
</head>
<body>
<header class="appnav">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 29 9v14l-13 7-13-7V9z" fill="#1570ef"/><path d="M16 2 29 9l-13 7L3 9z" fill="#5b9bff"/><path d="M16 16v14l13-7V9z" fill="#0b4fc4"/></svg>Figma AI Run</div>
  <nav class="navs" aria-label="프로그램 메뉴">
    <button type="button" data-page="start">시작 안내</button>
    <button type="button" data-page="work">일정/작업<span class="new">새</span></button>
    <button type="button" data-page="docs">UX 문서</button>
    <button type="button" data-page="wb">Figma Workbench</button>
    <button type="button" data-page="chg">변경 이력</button>
    <button type="button" data-page="usage">사용량 통계</button>
    <button type="button" data-page="proto">프로토타입</button>
  </nav>
  <div class="nav-r"><span class="pill">v0.7.2</span><button type="button" class="btn">서보경</button><button type="button" class="btn blue">로그아웃</button></div>
</header>
<div class="demo">
  <span>예시 조작 (실제 화면에는 없음)</span>
  <div class="seg" role="group" aria-label="보는 사람">
    <button type="button" data-role="writer" aria-pressed="false">작성자로 보기</button>
    <button type="button" data-role="approver" aria-pressed="true">승인 담당자로 보기</button>
  </div>
  <label class="tog"><input type="checkbox" id="noteTog" checked> 설명 보기</label>
</div>
<div class="wrap">
  <header class="head">
    <div>
      <h1 id="ptitle"></h1>
      <p id="psub"></p>
    </div>
    <div class="head-act">
      <span id="pact"></span>
      <input class="search" id="q" type="search" placeholder="이 탭에서 찾기 (ID, 제목)" aria-label="이 탭에서 찾기">
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="탭" id="tabs"></nav>
  <div class="note" id="note"></div>
  <div class="segbar" id="segbar" hidden></div>
  <div class="split" id="split">
    <aside class="card list" id="list" aria-label="목록"></aside>
    <main class="card doc" id="doc" aria-live="polite"></main>

function inWeek(d, w){ var k = dnum(d); return k >= dnum(w.s) && k <= dnum(w.e); }
function stCls(s){ return s==='완료'?'ok':s==='진행 중'?'acc':s==='대기'?'warn':''; }
// 업무 단위: 업무 줄 + 그 아래 ㄴUI 줄을 한 건으로 묶음
function units(){
  var out = [], cur = null;
  SCHED.forEach(function(r){
    if (r.g) { cur = null; return; }
    if (!r.sub) { cur = { p:r.p, t:r.t, ux:r, ui:[] }; out.push(cur); }
    else if (cur) cur.ui.push(r);
  });
  out.forEach(function(u){
    var rows = [u.ux].concat(u.ui), ds = rows.filter(function(r){ return r.s; });
    u.s = ds.length ? ds.map(function(r){ return r.s; }).sort(function(a,b){ return dnum(a)-dnum(b); })[0] : '';
    u.e = ds.length ? ds.map(function(r){ return r.e; }).sort(function(a,b){ return dnum(b)-dnum(a); })[0] : '';
    if (rows.every(function(r){ return r.st==='완료'; })) u.st = '완료';
    else if (u.ux.st==='완료' && u.ui.length) u.st = '진행 중';
    else u.st = u.ux.st;
  });
  return out;
}
function taskTable(rows){
  if (!rows.length) return '<p class="muted" style="margin:0">해당 업무 없음</p>';
  return '<div class="tblw"><table class="tbl"><thead><tr><th>업무</th><th>상태</th><th>UX</th><th>UI</th><th>기간</th></tr></thead><tbody>' +
    rows.map(function(u){
      var ui = u.ui.length ? u.ui.map(function(r){ return esc(r.who) + ' ' + b(r.st, stCls(r.st)); }).join('<br>') : '<span class="muted">-</span>';
      return '<tr><td>' + (u.p ? '<span class="plat">' + esc(u.p) + '</span>' : '') + esc(u.t) + '</td><td>' + b(u.st, stCls(u.st)) + '</td><td>' + esc(u.ux.who) + ' ' + b(u.ux.st, stCls(u.ux.st)) + '</td><td>' + ui + '</td><td>' + esc(u.s===u.e ? u.e : u.s + '~' + u.e) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function confirmDec(dec){
  var id = state.sel.prov, memo = document.getElementById('memo').value.trim();
  if (dec==='반려' && !memo) { document.getElementById('err').textContent = '반려 사유를 적어 주세요.'; return; }
  var today = new Date(), ds = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  pv[id].status = dec==='반려' ? '반려' : '승인';
  pv[id].decisions.push({ date:ds, dec:dec, memo:memo });
  var msg = dec==='반려' ? id + ' 반려: ' + memo : id + ' ' + dec;
  pv[id].result = '<b>예시라 실제로 저장하지 않았습니다.</b> 실제 프로그램에서는 PV 파일의 "상태" 줄을 <code>' + esc(pv[id].status) + '</code> 상태로 바꾸고, "결정" 표에 한 줄을 더하고' + (dec==='반려' ? ', 파일을 <code>provisional/closed/</code>로 옮기고' : '') + ', 대표 저장소에 커밋합니다: <code>' + esc(msg) + '</code> ' +
    (dec!=='반려' ? '다음은 승인 담당자가 공통 규칙에 반영하고 버전을 올리는 일입니다(R11). ' : '') + '<button type="button" class="reset" data-reset>예시 처음으로</button>';
  curFilter.prov = pv[id].status;
  render();
}

document.addEventListener('click', function(e){
  var t;
  if ((t = e.target.closest('[data-page]'))) { state.page = t.dataset.page; if (state.tabByPage[state.page]) state.tab = state.tabByPage[state.page]; render(); return; }
  if ((t = e.target.closest('[data-tab]'))) { state.tab = t.dataset.tab; state.tabByPage[state.page] = state.tab; render(); return; }
  if ((t = e.target.closest('[data-gotab]'))) { state.tab = t.dataset.gotab; state.tabByPage.work = state.tab; render(); window.scrollTo(0,0); return; }
  if ((t = e.target.closest('[data-wk]'))) { wk = Math.max(0, Math.min(WEEKS.length-1, wk + (+t.dataset.wk))); render(); return; }
  if ((t = e.target.closest('[data-ans]'))) { ansState[state.sel.disc] = { step:1 }; renderDoc(); return; }
  if ((t = e.target.closest('[data-anscancel]'))) { delete ansState[state.sel.disc]; renderDoc(); return; }
  if ((t = e.target.closest('[data-anssend]'))) { var tx = document.getElementById('ansText').value.trim(); if (!tx) return; ansState[state.sel.disc] = { step:2, text:tx }; renderDoc(); return; }
  if ((t = e.target.closest('[data-ansfix]'))) { var fx = document.getElementById('ansFix').value.trim(); if (fx) { ansState[state.sel.disc].fix = fx; } renderDoc(); return; }
  if ((t = e.target.closest('[data-anscommit]'))) { ansCommit(state.sel.disc); render(); return; }
  if ((t = e.target.closest('[data-blo]'))) { var o = t.dataset.blo; if (o === '*') BL_OWNERS.forEach(function(x){ bl.owners[x] = true; }); else bl.owners[o] = !bl.owners[o]; render(); return; }
  if ((t = e.target.closest('[data-blk]'))) { bl.kind = t.dataset.blk; render(); return; }
  if ((t = e.target.closest('[data-blm]')) && !e.target.closest('[data-go]')) { var mm = t.dataset.blm; bl.open[mm] = !bl.open[mm]; render(); return; }
  if ((t = e.target.closest('[data-seg]'))) { curSeg = t.dataset.seg; var gg = tabDef('disc').groups.filter(function(x){ return x.key===curSeg; })[0]; if (!gg.items.some(function(x){ return x.id===state.sel.disc; })) state.sel.disc = gg.items[0].id; render(); return; }
  if ((t = e.target.closest('[data-sst]'))) { sf.st = t.dataset.sst; render(); return; }
  if ((t = e.target.closest('[data-per]'))) { openPer(+t.dataset.per, t); return; }
  if ((t = e.target.closest('[data-perclose]'))) { document.getElementById('perpop').hidden = true; return; }
  if ((t = e.target.closest('[data-perclr]'))) { var rc = SCHED[+t.dataset.perclr]; delete rc.s; delete rc.e; saved = '기간 지움'; render(); return; }
  if ((t = e.target.closest('[data-perok]'))) {
    var s = document.getElementById('pS').value, en = document.getElementById('pE').value;
    if (!s) { document.getElementById('pErr').textContent = '시작일을 고르세요.'; return; }
    if (!en) en = s;
    if (en < s) { document.getElementById('pErr').textContent = '종료일이 시작일보다 빠릅니다.'; return; }
    var rr = SCHED[+t.dataset.perok]; rr.s = fromIso(s); rr.e = fromIso(en); saved = '기간 저장함'; render(); return;
  }
  if ((t = e.target.closest('[data-refresh]'))) { var n = new Date(); lastRead = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0'); saved = '다시 읽음 (예시라 실제 시트는 읽지 않음)'; render(); return; }
  if (!e.target.closest('#perpop')) { var pp = document.getElementById('perpop'); if (pp) pp.hidden = true; }
  if ((t = e.target.closest('.item'))) { state.sel[state.tab] = t.dataset.id; render(); return; }
  if ((t = e.target.closest('[data-go]'))) { go(t.dataset.go); return; }
  if ((t = e.target.closest('[data-filter]'))) { curFilter.prov = t.dataset.filter; var f = tabDef('prov').groups[0].items.filter(function(x){ return pv[x.id].status===curFilter.prov; }); if (f.length) state.sel.prov = f[0].id; render(); return; }
  if ((t = e.target.closest('[data-dec]'))) { openConfirm(t.dataset.dec); return; }
  if ((t = e.target.closest('[data-cancel]'))) { document.getElementById('confirmBox').innerHTML = ''; return; }
  if ((t = e.target.closest('[data-ok]'))) { confirmDec(t.dataset.ok); return; }
  if ((t = e.target.closest('[data-reset]'))) { pv = JSON.parse(JSON.stringify(PV0)); curFilter.prov = '승인 대기'; state.sel.prov = 'PV-0001'; render(); return; }
  if ((t = e.target.closest('[data-newpv]'))) { alert('[새 임시 정책] (R10, 2차): 바꿀 내용을 받아 Claude 작업으로 넘깁니다. Claude가 템플릿대로 PV 파일을 만들고, 같은 정책을 바꾸는 승인 대기 임시 정책이 있는지 확인합니다.'); return; }
  if ((t = e.target.closest('[data-role]'))) { role = t.dataset.role; document.querySelectorAll('[data-role]').forEach(function(x){ x.setAttribute('aria-pressed', String(x===t)); }); renderDoc(); return; }
});
document.getElementById('q').addEventListener('input', applySearch);
document.getElementById('noteTog').addEventListener('change', function(e){ document.body.classList.toggle('no-note', !e.target.checked); });
render();
})();
</script>
