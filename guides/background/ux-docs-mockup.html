<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일정·UX 문서 예시</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f3f6fb; --ink:#14171c; --ink-2:#4a5260; --ink-3:#7a8392;
  --line:#e3e7ee; --accent:#2747d8; --accent-soft:#e6ebff; --red:#d93025; --red-soft:#fdecea;
  --ok:#1a7f37; --ok-soft:#e3f4e8; --warn:#9a5b00; --warn-soft:#fff3dc; --code-bg:#eef1f6;
  --grp:#7c3aed; --grp-soft:#f1eafe;
  --r:12px; --gap:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#171a20; --surface-2:#1e232b; --ink:#e8ebf0; --ink-2:#b4bcc8; --ink-3:#8590a0;
    --line:#2a3039; --accent:#8ea2ff; --accent-soft:#232c52; --red:#ff7b72; --red-soft:#3a1f1e;
    --ok:#56d364; --ok-soft:#16301d; --warn:#f0a24f; --warn-soft:#3a2a12; --code-bg:#222831;
    --grp:#c4a5ff; --grp-soft:#2c2244;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a20; --surface-2:#1e232b; --ink:#e8ebf0; --ink-2:#b4bcc8; --ink-3:#8590a0;
  --line:#2a3039; --accent:#8ea2ff; --accent-soft:#232c52; --red:#ff7b72; --red-soft:#3a1f1e;
  --ok:#56d364; --ok-soft:#16301d; --warn:#f0a24f; --warn-soft:#3a2a12; --code-bg:#222831;
  --grp:#c4a5ff; --grp-soft:#2c2244;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1440px;margin:0 auto;padding:20px 24px 48px}
@media (max-width:760px){.wrap{padding:16px 16px 40px}}

/* 머리 */
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.head h1{margin:0;font-size:22px;letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--ink-2)}
.head-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ver{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600}
.ver small{color:var(--ink-3);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.search{min-width:0;width:220px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
@media (max-width:760px){.search{width:100%}}
.tog{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);cursor:pointer}

/* 탭 */
.tabs{display:flex;gap:2px;box-shadow:inset 0 -1px 0 var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:var(--gap)}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ink-2);font-weight:600;font-size:14.5px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tabs .cnt{font-size:12px;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.tabs .cnt.hot{background:var(--warn-soft);color:var(--warn)}

/* 설명 */
.note{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin-bottom:var(--gap);display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.note b{color:var(--accent);white-space:nowrap}
.note span{color:var(--ink)}
body.no-note .note{display:none}

/* 2단 */
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:var(--gap);align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list{padding:8px;max-height:calc(100vh - 220px);overflow:auto}
@media (max-width:900px){.list{max-height:none}}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:6px 6px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;cursor:pointer;color:var(--ink-2);font-size:13px}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.addbtn{margin-left:auto;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:8px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:600}
details.grp{margin:2px 0}
details.grp>summary{list-style:none;cursor:pointer;padding:6px 8px;border-radius:8px;color:var(--ink-2);font-weight:700;font-size:13px;display:flex;justify-content:space-between}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"▸";margin-right:6px;color:var(--ink-3)}
details.grp[open]>summary::before{content:"▾"}
details.grp>summary span:first-child{flex:1}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item .t{display:block;font-weight:600}
.item .s{display:block;color:var(--ink-3);font-size:12.5px;margin-top:1px}
.item .bs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.item.hide{display:none}

/* 배지·칩 */
.b{display:inline-block;font-size:12px;line-height:18px;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.b.ok{background:var(--ok-soft);color:var(--ok)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.red{background:var(--red-soft);color:var(--red)}
.b.acc{background:var(--accent-soft);color:var(--accent)}
.b.grp{background:var(--grp-soft);color:var(--grp)}
.b.ex{background:none;border:1px dashed var(--ink-3);color:var(--ink-3);line-height:16px}
.id{display:inline-block;font:12.5px/20px ui-monospace,Consolas,monospace;padding:0 7px;border-radius:6px;background:var(--code-bg);color:var(--accent);border:0;cursor:pointer;margin:1px 2px 1px 0}
.id:hover{text-decoration:underline}

/* 문서 */
.doc{padding:20px 24px;min-height:420px}
@media (max-width:760px){.doc{padding:16px}}
.dhead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.dhead h2{margin:0;font-size:19px}
.dhead .sub{color:var(--ink-2);margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0f1115}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#0f1115}}
.btn.dan{color:var(--red);border-color:var(--red)}
a.btn{display:inline-block;text-decoration:none;color:var(--ink)}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 14px;margin:0 0 16px;padding:12px 14px;background:var(--surface-2);border-radius:10px}
@media (max-width:560px){.kv{grid-template-columns:minmax(0,1fr)}}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.doc h3{font-size:15px;margin:20px 0 8px}
.doc ol,.doc ul{margin:0;padding-left:20px}
.doc li{margin:3px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2);color:var(--ink-2);font-weight:600;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.banner{border-radius:10px;padding:10px 14px;margin:0 0 14px;background:var(--warn-soft);color:var(--ink)}
.banner b{color:var(--warn)}
.banner.grp{background:var(--grp-soft)}
.banner.grp b{color:var(--grp)}
.skel{height:10px;border-radius:6px;background:var(--surface-2);margin:10px 0}
.skel.s2{width:82%}.skel.s3{width:64%}
.muted{color:var(--ink-3)}
.ab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.ab{grid-template-columns:minmax(0,1fr)}}
.ab>div{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ab h4{margin:0 0 6px;font-size:14px}
.confirm{border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin:0 0 14px;background:var(--accent-soft)}
.confirm textarea{width:100%;min-height:56px;margin:6px 0;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface)}
.confirm .warnline{color:var(--warn);font-weight:600;margin-bottom:6px}
.confirm .err{color:var(--red);font-size:13px;min-height:18px}
.result{border-radius:10px;padding:12px 14px;margin:0 0 14px;background:var(--ok-soft)}
.result code{background:var(--surface);padding:0 4px;border-radius:4px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.reset{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}

/* 프로그램 위쪽 메뉴 (Figma AI Run) */
.appnav{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:20px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;white-space:nowrap}
.navs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.navs button{flex:none;border:0;background:none;padding:9px 14px;border-radius:10px;font-size:15px;color:var(--ink);cursor:pointer;white-space:nowrap}
.navs button:hover{background:var(--surface-2)}
.navs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navs button .new{font-size:10px;font-weight:700;color:#fff;background:var(--red);border-radius:999px;padding:0 5px;margin-left:4px;vertical-align:2px}
.nav-r{display:flex;gap:8px;align-items:center;flex:none}
.pill{font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:4px 10px}
.btn.blue{background:#1570ef;border-color:#1570ef;color:#fff}
@media (max-width:900px){.nav-r .pill,.nav-r .btn{display:none}.appnav{padding:0 16px}}
.demo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:flex-end;padding:6px 24px;border-bottom:1px dashed var(--line);font-size:13px;color:var(--ink-3)}
@media (max-width:760px){.demo{padding:6px 16px;justify-content:flex-start}}
.head h1{font-size:28px}
.btn.big{padding:10px 18px;background:var(--accent);border-color:var(--accent);color:#fff;border-radius:10px}
:root[data-theme="dark"] .btn.big{color:#0f1115}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.big{color:#0f1115}}
.placeholder{padding:60px 20px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}

/* 일정 (간트) */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tools select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-left:auto;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.gwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:calc(100vh - 290px)}
.gt{border-collapse:separate;border-spacing:0;font-size:12.5px}
.gt th,.gt td{border-bottom:1px solid var(--line);white-space:nowrap;padding:0}
.gt thead th{position:sticky;background:var(--surface-2);z-index:3;color:var(--ink-2);font-weight:600}
.gt thead tr:nth-child(1) th{top:0;height:26px}
.gt thead tr:nth-child(2) th{top:26px;height:22px}
.gt thead tr:nth-child(3) th{top:48px;height:20px;font-weight:500;color:var(--ink-3)}
.gt .c{position:sticky;background:var(--surface);z-index:2;padding:6px 8px;text-align:left}
.gt thead .c{z-index:4;background:var(--surface-2)}
.gt .c1{left:0;width:300px;min-width:300px;max-width:300px;white-space:normal}
.gt .c2{left:300px;width:116px;min-width:116px;padding:4px}
.gt .c3{left:416px;width:150px;min-width:150px;padding:4px}
.gt .c4{left:566px;width:84px;min-width:84px;padding:4px}
.gt .c5{left:650px;width:84px;min-width:84px;padding:4px;border-right:1px solid var(--line)}
@media (max-width:760px){.gt .c1{width:200px;min-width:200px;max-width:200px}.gt .c2{left:200px}.gt .c3{left:316px}.gt .c4{left:466px}.gt .c5{left:550px}}
.gt .d{width:22px;min-width:22px;text-align:center;border-left:1px solid var(--line)}
.gt .d.mon{border-left:1px solid var(--ink-3)}
.gt td.d{height:30px}
.gt td.d{position:relative}
.gt .today{box-shadow:inset 2px 0 0 var(--red),inset -2px 0 0 var(--red)}
.gt thead .today{color:var(--red)}
.gt td.ux{background:#d9ead3}.gt td.ui{background:#fff2cc}.gt td.now{background:#12cc44}
:root[data-theme="dark"] .gt td.ux{background:#2b4a2a} :root[data-theme="dark"] .gt td.ui{background:#4a4220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gt td.ux{background:#2b4a2a}:root:not([data-theme="light"]) .gt td.ui{background:#4a4220}}
.gt tr.gh td{background:var(--surface-2);font-weight:700;color:var(--ink-2)}
.gt tr.gh td.c{background:var(--surface-2)}
.gt tr.sub .c1{padding-left:26px;color:var(--ink-2)}
.plat{display:inline-block;font-size:11px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:6px}
.tbd{color:var(--ink-3);font-size:12px;padding-left:8px}
.cell-in{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;padding:4px 6px;font-size:12.5px}
.cell-in:hover,.cell-in:focus{border-color:var(--line);background:var(--surface)}
.per{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:4px 6px;font-size:12.5px;cursor:pointer;text-align:left}
.per.empty{color:var(--ink-3);border-style:dashed}
.perpop{position:absolute;z-index:30;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:12px 14px;display:grid;gap:8px}
.perpop label{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:8px;font-size:13px}
.perpop input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface)}
.perpop .err{color:var(--red);font-size:12.5px}
.menuchip{display:inline-block;font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 5px;margin-left:4px}
.mini{display:grid;grid-template-columns:30px 1fr;align-items:center;font-size:11px;color:var(--ink-3);font-weight:600}
.mini+.mini{margin-top:2px}

/* 이번 주 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:default}
.tile .k{color:var(--ink-2);font-size:13px}
.tile .v{font-size:26px;font-weight:700;margin-top:2px}
.tile .s{color:var(--ink-3);font-size:12.5px}
.tile[data-gotab]{cursor:pointer}
.tile[data-gotab]:hover{border-color:var(--accent)}
.weekhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.weekhead h2{margin:0;font-size:18px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.box h3{margin:0 0 8px;font-size:15px}
.mtext{white-space:pre-wrap;line-height:1.7}
.chipbtn.chk[aria-pressed="false"]{opacity:.55}
.tbl.bl tr.blm{cursor:pointer}
.tbl.bl tr.blm:hover td{background:var(--surface-2)}
.tbl.bl tr.bls>td{background:var(--surface-2);padding:8px 12px 12px}
.bar{position:relative;height:20px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);border-right:2px solid var(--accent)}
.bar span{position:relative;padding-left:8px;font-weight:700;line-height:20px}
.segbar{display:flex;gap:0;margin:0 0 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content;max-width:100%;background:var(--surface)}
.segbar button{border:0;background:none;padding:9px 18px;font-weight:600;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.segbar button+button{border-left:1px solid var(--line)}
.segbar button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
/* 회의록 */
.agendabox{margin:4px 2px 10px;padding:10px 12px;border:1px dashed var(--accent);border-radius:10px;background:var(--accent-soft);font-size:13px}
.agendabox .ag{margin-top:4px}
pre.raw{white-space:pre-wrap;word-break:break-word;margin:0;padding:12px 14px;background:var(--surface-2);border-radius:10px;font:13.5px/1.65 inherit;font-family:inherit}
textarea.draft{width:100%;min-height:200px;border:1px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--surface);font:inherit;line-height:1.6}
.wtabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}
.wtabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer;color:var(--ink-2);font-weight:600}
.wtabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.wtabs.sm{display:inline-flex;margin:0}
.wtabs.sm button{padding:1px 8px;font-size:12.5px;font-weight:500}
.callout{margin-top:22px;border:1px dashed var(--ink-3);border-radius:10px;padding:12px 14px;font-size:13.5px}
.callout ol{margin:6px 0 0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tbl td .id{white-space:nowrap}
.inl{border:1px solid transparent;border-radius:6px;background:transparent;padding:2px 6px;margin:-2px 0;font:inherit;color:inherit;width:100%;max-width:460px;min-width:0}
.inl:hover,.inl:focus{border-color:var(--line);background:var(--surface);outline:none}
.inl:focus{border-color:var(--accent)}
.inl::placeholder{color:var(--ink-3)}
.inlrow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.inlrow .lb{white-space:nowrap}
.inlrow+.inlrow{margin-top:2px}
.foldsec{margin-top:22px;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.foldhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chat{border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin:0 0 16px;background:var(--surface-2);display:grid;gap:10px}
.chat textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface)}
.msg{display:grid;gap:2px}
.msg .who{font-size:12px;color:var(--ink-3);font-weight:600}
.msg.me{justify-items:end}
.msg .bub{max-width:92%;border-radius:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--line)}
.msg.me .bub{background:var(--accent-soft);border-color:transparent}
.sumbox{margin-top:6px}
.sumbox ul{margin:4px 0 0}
</style>
</head>

<header class="appnav">

 { id:'MT-20260930-01', date:'2026-09-30', time:'15:00 ~ 17:00', title:'일정 논의 및 기타 논의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[논의사항]\n1. 검체 Trolley 교체 가능 여부 알림 → 일정 추후 재논의 예정 (2차 반영 필요)\n1-1) Test status\n- Running 상태: 검체 스캔 시점\n- Complete 상태: DWP 분주 완료 시점\n\n1-2) Inventroy > Overview tab\n- Sample storage 항목 생성\nㄴ Sample(Inbound) / Sample(Oubound) 표기\nㄴ Prep과 동일 기조로 수량, 단위 표기 및 Capacity 제거\nㄴ Sample storage와 다른 모듈을 디자인적으로 구분 → 내부 논의 후 전달\n\n- 표기 항목 재구성\nㄴ 수량, 단위 표기\nㄴ 퍼센트, Capacity 제거\nㄴ Sealing film 입고 결과, 잔여량 = 투입량인 경우, 하나만 표기\n\n2. Run 준비 화면 내 소모품/시약 상세 정보 제공 여부\n- 추가 완료\n\n3. Material Setup 내 Dx 소모품/시약 필요 수량 정보 제공 기능 추가 검토\n- 필요 수량 기재 필요 (투입트롤리 docking 시에만 노출)\n- 기기 스케줄링에 따라 PCR rack 작업 진행\n- DX 스캔 시, 그에 따른 모듈명 or 인덱스 번호 노출 필요\n\n4. Run 준비 화면에서 Waste Bin 상태 조회 탭 추가 검토 건\n- Run/Quick run > Waste bin 상태 스텝 추가 (step 4~5)\nㄴ 개수 > 폐기함 기준으로 표기\n- Run preparation > 추가할 항목 없는 case 추가 필요', etc:'[기타논의]\n1. Sample tracking 트레이 포지션 문의\n- 회수트롤리 코드 스캔 여부 문의 → 있을 예정이며, 없으면 생성할 것(김차장님)\n- 검체 회수트롤리 반환 시, 회수트롤리의 트레이 포지션 출력 가능' },
 { id:'MT-20260929-01', date:'2026-09-29', time:'10:00 ~ 11:30', title:'일정 논의 및 기타 논의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[논의 및 결정사항]\n- 일정 논의\n  ㄴ 일정 연장 : 10월 30일까지 진행 (개발사 측에서 11월 말을 목표로 진행 예정)\n  ㄴ 유지보수 관리 및  Assay Pack 관련 문서 : 8일까지 전달 예정 (~16일 까지 UX 작업 완료로 진행)\n\n- Inventory Usage\n  ㄴ 페기 및 리턴 시점에 표기되는 방향으로 진행\n\n- 모바일\n  ㄴUX/UI 작업 기간: 11/2 ~ 11/27 작업 종료 예정\n\n- 언어셋\n  ㄴ AI 선작업 진행\n  ㄴ 수정 및 추가 항목 > 11월 16일 각 법인 전달 예정 (법인 검토: ~12월 4일)\n  ㄴ UI 작업 기간: ~ 12/18 작업 종료 예정\n\n[질의사항]\n- STAT으로 검체를 투입하였을 경우에는 부족 수량을 어느 시점에 노출시켜줄 것인지 논의 필요 (Trolley와 동일? Run Start 시점?)\nㄴ STAT storage 닫는 시점으로 소모품 수량 계산', etc:'[정책추가]\n- 투입용/회수용 트롤리 1층 적재 제외\n- 투입 트롤리(트레이 X) / 회수 트롤리(빈 트레이 O)\nㄴ 회수 트롤리에 트레이 장착 항목은 유저 가이드에서 안내' },
 { id:'MT-20260923-01', date:'2026-09-23', time:'10:00 ~ 11:30', title:'논의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[논의 및 결정사항]\n- Waste Bin 비움 버튼명 변경\n  ㄴ Confirm to empty > Confirm Empty\n- Sealing Film 선택 영역 및 이미지 조정 요청 (Overlay 최소화)\n- Dashboard 도어 컨트롤 아이콘 변경 요청\n  ㄴ 설정 아이콘 > 문 열림 아이콘 (MS에도 동일 반영)\n- Sealer Flim Storage 입력 화면\n  ㄴ Applied 상태값 표시 삭제 > 입력 후 저장되지 않은 경우 팝업 노출 (인덱스 변경 선택 시 / 최종 Done 선택 시)\n  ㄴ 모듈 선택 기능 형태 변경 : 칩 형태 > 드롭박스\n  ㄴ Delete 기능 : Reset으로 명칭 수정 / Sealer별 각각 버튼 적용(선택 팝업 미노출)\n  ㄴ Reset 선택 시 Remaining을 포함한 전체 초기화', etc:'MS 메뉴 명칭 변경 건 : 28일까지 적용\n- LNB 및 MS 화면\n검체 트롤리 및 소모품 트롤리 도킹 시 Run Start이전에도 Inventory 내 상태 및 부족 수량 노출\nㄴ 단, 이벤트 알람의 경우 Run Start 이후 노출' },
 { id:'MT-20260922-01', date:'2026-09-22', time:'10:00 ~ 11:30', title:'논의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[질의사항]\n- 튜브 설정 값에 \'샘플 타입 추가\'\nㄴ 튜브 하나의 N개 Sample type이 올 수 있음\nㄴ LIS code는 옵션 값으로 변경 / 중복은 허용하지 않음 (System code는 필수로 유지)\nㄴ 재단의 경우도 튜브 정보를 주지만 신뢰할 수 있는 정보가 아님 (독일과 동일하게 적용될 것으로 예상)\nㄴ Sample type 정보는 옵션 값으로 제공 / 중복은 허용하지 않음\nㄴ 테이블 내 System code와 LIS code 순서 변경 (System code 선)\n\n- profile 수정가능한 모드 확인\nㄴ 모드에 제한 없이 동일하게 제공\n\n- Door control에서 error 값일 경우, paused 상태로 진입하지 못하게 하는 방안\nㄴ Error 상태일 경우에는 Door를 열어도 Error 상태로 유지\n\n- 모듈이 Error에서 다시 running 또는 ready 돌아가는 트리거\nㄴ 소모품 부족 같이 사용자가 해결할 수 있는 Error일 경우 문을 닫으면 자동으로 Ready 상태로 돌아감\n\n- 소모품 카운팅 기준(최종 체크)\nㄴ 트롤리 반환 후 재입고 시, 반환된 소모품을 변경하는 트롤리에 넣지 않을 경우 빈틈이 생긴다.', etc:'' },
 { id:'MT-20260917-01', date:'2026-09-17', time:'10:00 ~ 11:30 / 13:30 ~ 15:00', title:'화면 UX 리뷰', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[Door Control]\n- Door 버튼명 \'Unlock\'으로 변경 논의\n  ㄴ1차 요인: 번역으로 인한 버튼명 길이 이슈\n  ㄴ정책 변경에 따라 케이스가 줄어서 안내 문구로 일시 정지된 내역 표기하는 방식으로 적용해도 무방해 보임\n  => 다국어 작업 및 일시정지되는 부분은 안내 문구로 하되, 색깔로 구분을 줄 수 있는 방식으로 적용 후 다시 논의\n  ㄴ 통합상태가 Running일 경우 Unlock all doors 비활성화 처리 (Error와 Ready 일때만 활성화)\n\n[가동 리포트]\n- 배치 단위로 리포트 생성\n- Run Summary\n  ㄴ처리 완료 및 실패한 수도 총 개수 표기 필요 (상태값별 개수 표기 / stop 했을 경우도 분류되게 적용)\n  ㄴ예상 시간 제거 / 실제소요시간 기입하는 것으로 정의\n  ㄴ배치 ID 생성 규칙 추가 > 기존 인덱스 기준에서 고유 ID 부여되는 방식으로 정의\n  ㄴ Run start 되어 Ready된 샘플이 아예 스캔도 안되고 트롤리에 위치했다가 중지되면 다시 상태값이 Ordered로 변경\n  ㄴ 프로세스별 Start / end date/time 제거\n  ㄴ 검사군 및 검사종류 추가로 표기\n- Event Summary\n  ㄴ 건수는 Error / Warnning 2가지 분기되서 합산된 정보 표기 요청\n  ㄴ Event type별 모듈 개수 정보 제거\n- Cumulative Operation\n  ㄴ 모듈 인덱스별 Run-time 표기\n  ㄴ Events 최근 30일 Instrument type만 합산하여 표기\n- Maintenance\n  ㄴ TBD 유지보수 메뉴 설계 후 관련된 정보 요약하여 추가하는 방향으로 정리\n\n[TSS 기타]\n- Storage를 물리적으로 닫을 경우 \'Done\' 버튼과 동일하게 처리 (작업이 완료되었음)\n- 입고 진입 화면에서 UNLOCK 버튼과 QR 부분은 SB와 동일한 기조로 적용\n\n[정책]\n- 검체 트롤리도 Run Start되는 시점에 리셋되지 않게 해야함 (장비를 Stop할 경우 검사를 시작하지 않은 검체가 있을수도 있어서)', etc:'독일 피드백\n\n[샘플 튜브 타입 정보] - 화면 변경 사항 X\n- 검체 타입이 정해진 튜브에 담겨져오지 않을 수도 있음\n- 샘플 튜브 타입 정보를 제공하는 곳이 없다. LIS부터 검체가 어떤 튜브에 담겼는 지 정보를 주지 못함.\n=> 금번 평가 기간 동안에는 제한적으로 하나의 샘플 타입에 하나의 고정된 샘플 튜브 타입 정보로만 사용하는 방안으로 진행\n\n[검사 제품/바이러스 정보 처리 관련] - 화면 변경 사항 O / 10월 23일 버전에 반영\n- 하위 타겟 정보까지는 UI 상에서 노출하지 않음\n- LIS에서 받는 바이러스(타겟) 정보를 관리할 수 있는 코드 정보 관리\n- LIS Setting 메뉴 수정' },
 { id:'MT-20260916-01', date:'2026-09-16', time:'09:30 ~ 11:30 / 14:00 ~ 17:00', title:'화면 UX 리뷰', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[Drawer Loading]\n- 메뉴명 논의 (트롤리 입고 포함되는 부분)\n- 가이드 화면 내 Door Control\n\n[Waste Bin manage]\n- UI 작업 시, 버튼 영역에는 버튼 형태 노출, QR 영역에는 QR 이미지 형태 노출 요청\n\n[Reuse guide]\n- 확인 방식이 아닌, 단순 View 방식으로 전환 요청\n- Reset은 명시적으로 하는 것이 아닌, 리셋이 안된 물품을 다시 재사용 기점으로 리셋여부 팝업 노출 요청\n- IC/PK 및 스탠다드 튜브일 경우, 사용 중인 것을 재입고할 때, 제거해야하는 범위 이미지 팝업으로 재노출 요청\n- Tub 경우도 트레이 입고 단계에서 리셋여부 묻고, 리셋일 경우 step1부터 시작 안내, 재사용일 경우 뚜껑 추가로 장착하여 사용하도록 알럿 노출 요청\n\n[정책]\n- 검체/소모품 스토리지도 Running 중에 일시 정지를 통해 열 수 있음\n- 모듈 상태가 Ready일 경우에도 Door를 열면 Paused로 상태로 변경\n- Drawer 입고 시 가이드 화면이 띄워진 상태에서 문을 닫을 경우 자동으로 화면이 전환되며 저장 (Sealer 예외)\n\n[기타]\n- 대시보드 및 실시간성 데이터 표기 메뉴 데이터 리프레시 주기 : 모두 실시간성 반영\n  ㄴ 모든 항목별로 이벤트 보내주기 때문에 이벤트 푸시에 따라 실시간 반영 적용 예정\n\n- Door Control\n  ㄴAll door open 버튼의 열 수 있는 문의 숫자 제거\n  ㄴDoor 오픈 시, module 상태값은 \'Paused\' 상태로 변경(정책 추가)\n  ㄴ검체 및 소모품 트롤리 입고 모듈도 Running 일때, Door 오픈할 수 있게 정책 수정\n\n- Inventory waste bin status\n  ㄴ Full은 만재 센서 기준으로 값이 변경되게 적용\n  ㄴ 예상 폐기량이 100% 넘어서도 만재가 울리지 않을 경우, 100% 표기로 유지하며 상태값도 Almost Full로 유지\n\n[소모품/시약]\n- 시약 20종 추가\n- 기존 STAT 입고 내역 Trolley로 변경 내역 반영\n- PCR Setup용 배치도는 추가로 작업해서 전달할 예정\n- (v.n.x) 버전 정보는 제외하고 제품명 표기(IC는 기입된 정보 그대로 표기)\n- TSS G40,41 내역은 확인 후 다시 수정 후 전달 예정\n- TSS 에서 PCR 시약 제거 시 Uesd 처리 (그룹핑된 IC도 함께 Uesd 처리)', etc:'- 분주 모듈 버퍼 공간 : 3개\n- Sealer Waste Bin : v1.0 90장 / v1.1 40장 (현재 CURECA에는 v1.0 적용 / 만재 80장)\n- 96-DWP : 핵산 시약 바코드 N개 노출' },
 { id:'MT-20260910-02', date:'2026-09-10', time:'14:00 ~ 16:00', title:'화면 UX 리뷰', cust:'노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[Instrumnet - Door control]\n- Unlock 버튼은 항상 노출하는 방향으로 변경 요청\n\n[소모품 트롤리 reuse 메뉴]\n- standard tube 제거해야하는 영역 디자인 변경 요청\n- 재사용 영어 단어 일부 변경 요청\n\n[가동 리포트]\n- Batch 단위로 자동 생성되는 구조\n- 모듈 구조 정보는 현재 시스템에 있는 구조와 동일하게 적용 (Sample preparation ~ PCR)\n- SW 버전 정보 중 CFX96, Viewer 정보는 내부적으로 관리하고 있을 것으로 생각됨, 노출하는 방향으로 진행\n- 구동 ID는 실제 Run Start를 누를 사용자 ID 정보 노출\n- 종료 상태는 선택된 배치의 종료 상태 노출 (Failed / Completed)\n- Maintenance 상태는 모듈 중 하나라도 상태 값이 Failed 이라면 전체 상태 값도 Failed로 노출\n- Run Summary는 하나의 배치 카드 정보 노출\n- 구동 시간 상세 이력\nㄴ 이벤트 유무 정보 > 이벤트 개수 노출\nㄴ 처리 결과, 지연된 시간, 재검 필요 여부 삭제\n- 이벤트 이력 정보 삭제\n- 누적 구동 이력 : 배치 레벨에 맞는 정보 X, 삭제\n- 유지보수 예측 : 현재 노출할 수 있는 정보의 범위를 알 수 없음 / 항목과 Pass 여부만 노출하는 방향으로 우선 진행', etc:'- 재단에 설치된 Plate Sealing 모듈 : 3대 (하위 디바이스 6대)\n- Sealer 만재되는 카운팅 기준 (현업 논의 확인 후 전달 예정)\n- PCR Setup과 Plate Sealing 모듈은 페어되어서 설치 (78-78-78)\n- 재단에는 M9600만 설치' },
 { id:'MT-20260910-01', date:'2026-09-10', time:'09:40 ~ 11:00', title:'1차 언어셋 리뷰', cust:'노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[언어셋]\n- Instrument\nㄴ All 탭 > Door status, Run time 테이블 항목 제거 (너비 확보 못 할 경우, \'사용여부\' 컬럼 추가 제거)\nㄴ Waste bin/bottle_1280 > 컬럼값 두 줄처리하는 부분 말줄임\'...\'으로 표기\nㄴ Main > T-ios와 동일하게 레이아웃 변경 & Door + 아이콘(설정) 표기\n\n-  Event History > Brex 제안안 수용\n- Inventory > Reagent 상세 > 컬럼 값 두 줄 처리\n- Login > 비밀번호 변경 팝업, 버튼명 \'Save\'로 수정\n\n- Quick start / Run\nㄴ Quick start / Run 버튼 > 부가 설명 제거 (영문 수정 필요)\nㄴ Brex 제안안 수용(Run preparation, Protocol, Quick start/run 팝업)\n\n-Test Order\nㄴ Total product > \'STAT samples \' → \'SATA\' 으로 수정\nㄴ 검체 상태값 > 색상 & 텍스트로만 구분 (기존 \'점\' 제거)\nㄴ 그 외, Brex 제안안 수용\n\n- Test Status\nㄴ \'Total batch\' 줄바꿈 or 위치 고민 필요\nㄴ 1280 > T-ios와 동일 형태로 수정\n\n- Sample Tracking\nㄴ Samples > 상세 Tray position 수정 & 그 외, Brex 제안안 수용\n\n- Account setting\nㄴ ID 중복체크 > \'Check ID\'로 변경\n\n- Protocol\nㄴ 컬럼명 영문 유지 & Action 영문 약어 유지 & On/Off 번역본 유지(넘칠 경우 영문 유지)\n\n[공통]\n- 컬럼명 텍스트 긴 경우, 두 줄 처리 진행 (세 줄 이상 말줄임 처리)', etc:'' },
 { id:'MT-20260904-01', date:'2026-09-04', time:'10:00 ~ 11:00', title:'Inventory waste bin UX 리뷰', cust:'노경민 차장', brex:'서보경, 정다예', status:'원문', body:'- A안 좌/우 분리되서 보이는 방식 선택', etc:'- Universal Cartridge는 1회 사용 후 폐기 > 정책 확정\n   ㄴ Cap 인식 센서를 추후에 보완할 예정. 그 전까지는 1회 사용 후 폐기\n   ㄴ 현재 여분의 Cap은 재사용을 위한 것이 아닌 사용 후 폐기때 닫아서 버릴 때 활용될 예정. (안전이슈)\n\n- Sealer 필름 카운팅: 역방향 film 감지, film shift 감지 상황 시에도 카운트 가능\n\n- 재단에 설치된 Universal PCR의 폐기함은 1개이며 기존 모듈처럼 QR방식에 서랍형으로 적용되어 있음.\n  ㄴ 단, 모듈 1대에 1개의 폐기함이지만 재단은 6대 모듈에 1대의 폐기함 방식으로 적용되어 있음.' },
 { id:'MT-20260901-01', date:'2026-09-01', time:'10:00 ~ 17:00', title:'정책 논의 및 Waste bin 질의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[정책 및 추가 문의]\n- 스토리지 개수 표기 범위(buffer 공간에 있는 것 포함여부)\nㄴ  포함하는 방향으로 논의 했으나 개발사 최종 확인 필요\n\n- 트롤리 최하단 한개 층 영역을 버퍼 공간으로 사용\nㄴ 화면 영향도 확인 후 일정 재논의\nㄴ 개발사 컨펌 완료. 최하단 층 회수용으로 사용하는 방향으로 정책 및 화면 수정 진행 필요\n\n- RUN 완료 후 전처리 내 버퍼공간의 소모품 반환 시점\nㄴ CURECA 구동 상태가 Running에서 Ready로 전환될때 회수되어야 함\n\n[Waste Bin - 공통]\n- Waste bin명, Open용 바코드, 알림 LED 적용되어 있음.\n\n[Waste Bin - High-throughput Extraction 모듈]\n- 씰/팁을 버리는 곳, DWP 버리는 곳 2가지 존재\n- 씰을 버리는 곳은 표준형, 맞춤형 모두 만재가 없음 (필름만 반사되서 센싱 못함)\n- 위치 : 표준형(상부-프론트 도어)  재단-맞춤형(하부)\n\n[Waste Bin - Sample Preparation 모듈]\n- 유리도어 안에 있음 단디는 뒤/로체는 앞\n- 분주 유닛 1개당 쓰레기통이 2개가 달려있음\n\n[통합 상태 및 모듈 상태 추가 예정]\n- 일시 정지 상태값 추가 예정\n  ㄴ Instrumnet 및 대시보드에 일시 정시 상태값 추가 요청\n  ㄴ 대시보드에는 공간이 없어 Door의 Closed 상태값 제거하고 일시정지 값 추가\n\n[Instrumnet]\n- Door control UX/UI 변경 필요\n  ㄴ Door 추가 정보 반영 필요. 최대 3개까지 표기되는 케이스 체크 필요', etc:'- 전처리 모듈 버퍼 공간 개수 (단디 : 실온 2 / 냉장 4)\n- 장비 관련\nㄴ 후면 도어 추가 (Sample Preparation)\n- 장비 통합 상태가 Running 중인 경우 (장비 가동 중) 열 수 있는 도어 : 자료 공유 예정\nㄴ Sample Storage : Front Left / Right Door\nㄴ PrepConsumable Storage : Front Door\nㄴ Sample Preparation : Front Door (로체) / Rear Door (단디)\nㄴ Plate sealing : Front Door' },
 { id:'MT-20260828-01', date:'2026-08-28', time:'09:30 ~ 11:40', title:'일정 논의 및 추가 화면 논의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[일정 논의]\n- MS 일정은 9월까지 순차적으로 먼저 처리해서 공유\n- 나머지는 우선순위에 따라 진행하되 상황에 따라 우선순위 변경하며 진행\n\n[MS]\n- 토스트팝업 추가는 9/11까지 미리 적용하여 전달\n- 트롤리의 사용한 소모품 제거 UI는 추석 전까지 작업하여 전달\n\n[소모품 트롤리 도킹해제 위한 Unlock 기능 및 DX 입고 관련 논의 결과]\n- 업체별 기계 트롤리 도킹 방식\nㄴ단디: 시스템이 초음파 센서로 인식하여 정상 도킹 여부 확인하며 사용자가 프론트 유리문을 닫으면 자동으로 유리문이 Lock되며 트롤리도 도킹이 자동으로 진행됨. 또한 기존에 진행하던 Run이 있다면 자동으로 이어서 진행되도록 설계\nㄴ로체: 트롤리가 입고 되면 QR을 찍어 트롤리 입고여부 체크 -> 유리문을 닫고 Door에 있는 걸쇠같은 장치를 걸면 Docking 됨\n\n- 트롤리 회수 시나리오(전제조건: 소모품 트롤리 하단을 \'회수용\'으로 사용함으로써 전처리 장비의 소모품 미회수)\nㄴ사용자: Instrument의 [Door Control]에서 Unlock을 클릭\n    ㄴPrep Consumable Storage 모듈 상태값: Ready(or Error)\nㄴ시스템: 트롤리 Undock 처리 후 유리문 Door Unlock 적용\nㄴ사용자: Door 열고 트롤리 회수\n\n- 트롤리 입고 시나리오(문이 닫혀있으면 Door Control에서 Unlock 작업 진행)\nㄴ사용자: 트롤리 입고 후 유리문 Door 닫기\nㄴ시스템: 유리문 및 트롤리 Dock 상태를 Lock로 전환\n   ㄴ1. 기존에 진행 중이 Run이 있다면 이어서 진행\n   ㄴ2. 기존에 진행 중이 Run이 없다면 대기\n\n-결론\nㄴ도킹을 Lock 해제하는 장치는 따로 만들지 않고, 시스템에서 Door의 상태값 변경을 인식해서 자동으로 처리되도록 적용\nㄴDX 저장장치의 열수 있는 상태값은 따로 만들지 않고 Storage 서랍을 열수 없는 상태면 알럿을 적용하여 잠시 후 다시 시도할 수 있도록 안내\n\n- 정책 결론\nㄴ모듈이 Ready 및 Error 상태일 때만 유리문 Lock 해제할 수 있다. (기존 정책 유지-모든모듈 해당)\nㄴDX는 검사 장치에 유리문이 있고 저장장치에 유리문이 없기 때문에 영향도 없음\nㄴPrep은 모듈의 상태값에 따라 트롤리 회수 가능여부가 정해지지만 DX의 경우 모듈 상태값에 영향을 받지 않기 때문에 DX는 모든 상태값에서 DX저장장치 Open이 가능하다.\n\n[Buffer Cartridge Storage 정책 변경]\nㄴ장치가 여분의 Cap을 확인할 수 있는 장치가 없음. 현재로서는 1회 리턴 후 재사용 시 Recap이 되지 않아 폐기가 필요한 상황(또는 1회 사용 후 재사용을 할 수 없는 구조)\nㄴ관련해서 다시 씨젠측 내부 논의 후 정책 반영 필요\n\n[Run 배치 관련 논의 내역]\nㄴ검체 트롤리 기준 Run 진행 중 STAT Storage 통해 검체가 입고 되어 run start를 진행할 경우,\nㄴ전처리 장비에 입고된 검체소켓의 모든 검체가 소진된 이후 STAT Storage 소켓을 갖고 가서 검사가 진행됨\nㄴ또한 DWP도 기존 검체 트롤리용과 STAT으로 들어온 것을 섞어서 분주하지 않음(분리되어 검사 진행)\nㄴ기존 배치 TAT는 멈추지 않고 계속 시간은 늘어나는 구조', etc:'' },
 { id:'MT-20260827-01', date:'2026-08-27', time:'09:30 ~ 11:30', title:'일정 논의 및 추가 화면 논의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[큐레카 전체 일정]\n- 독일용 기계는 1차 12월 21일, 2차 1월 4일 선적하며 1월 11부터 설치 진행 예정. 실제로는 3월에 가동 예상\n- 재단에는 단디용 Prep으로 설치하고, 잠실 쇼룸에는 로체 기계를 설치하여 테스트 나눠서 진행 예정\n- Dry Run은 9월 진행하고 10월에 Water Run 진행 예정. 단, 이때는 단일검사 기준으로 진행. 12월에는 종합검사를 로직을 테스트할 예정\n\n[2차 우선순위 논의]\n- 2차 우선순위 재조정 논의 진행\n- 자세한 내역은 다음 회의에 다시 논의 진행\n\n[정책 및 추가 문의]\n- 시약 추가 현황 체크\n  ㄴ시약 20종류 추가될 예정\n\n- 트롤리 Unlock 해제 논의 및 타 DX입고 Unlcok 논의(Instrument에 있는 트롤리 Unlock 이동 논의)\n  ㄴ물리적 버튼을 MS에 추가 논의 진행 했으나 여러 이슈로 다음회의에 추가 논의 진행 예정', etc:'- 소모품 트롤리 Tube 리셋 기준 논의\n  ㄴ소모품 트롤리는 리셋하지 않는 것으로 정의 완료\n\n- 소모품 트롤리 교체 시 로직\n1) 장비 가동 중 트롤리를 언도킹하기 위해서는 모든 물품(검체, 소모품, 시약)이 트롤리로 반환되어야 함.\n  -> 트롤리 언도킹 요청 시 전처리 모듈 내부로 이동된 물품에 대하여 진행 중인 작업을 완료한 후 반환 처리함\n  -> 해당 반환 처리 작업 시간이 수분에서 수십분 정도 소요될 것으로 예상\n  -> 이에 따라 사용자에게 언도킹 수행 대기 안내를 제공(기 적용 사항)해야 하며, 추가로 언도킹 가능 여부 상태 표시 기능 적용 검토 필요(모든 서랍형 저장 장치(실러 저장소 제외) 및 폐기함도 동일하게 적용 검토 필요)\n  -> 또한, 현재 트롤리 언도킹에 대한 사용자 트리거로 도어 Unlock 버튼을 활용하고 있으나, 트롤리 언도킹 요청 버튼을 추가하여 도어 Unlock과 분리하는 방안 적용 검토 필요 (예: Prep 저장소 모듈 Door Unlock 버튼 클릭 시 Unlock 범위 선택)\n\n참고\n- 검체 투입 트롤리에 적재된 검체 랙은 복수개를 로딩하지 않고, 하나씩 순차적으로 로딩하여 처리함' },
 { id:'MT-20260825-01', date:'2026-08-25', time:'10:00 ~ 11:30', title:'1차 현황 보고 및 2차 일정 논의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[1차 현황]\n- 언어셋 현황\n  ㄴ한국어는 2차 범위때 전달 받을 예정\n  ㄴ프랑스어는 현재 기다리는 중\n\n- MS 선택 Delete 이미지 수급 요청 중\n\n[정책 및 추가 문의]\n- 시약 최대 사용 횟수 기준(decapping or 흡입)\n  ㄴdecapping 기준(다만 다시 재체크할 예정\n\n- 소모품 트롤리 Tube 리셋 기준 논의\n  ㄴstart 시점 리셋은 제거하고 자동으로 기계가 폐기할 때, 정보 리셋해주고 남은 소모품/시약일 경우 해당 값은 리셋하지 않는 방향으로 정책 변경\n\n- 소모품 트롤리 교체 시 로직\n  ㄴ트롤리에서 꺼낸 소모품을 다시 제자리로 돌아가는 로직으로 적용되어 있음. 다른 소모품을 사용하기 위해서는 해당 소모품을 다시 트레이에 옮기고 다른 소모품을 가져다 쓰는 구조\n  ㄴ문제점: 트롤리를 교체할 때, 버퍼공간에 있는 소모품을 다시 제자리로 돌려놓지 않고 꺼냈을 경우, 꽉찬 트롤리를 입고했을 경우 버퍼공간에 소모품이 차있어서 사용할 수 없음.\n  ㄴ문제점 관련 개발사와 논의 후 재전달 예정', etc:'- Run 소모품/시약 표기 기준: 전체 Run 기준으로 필요 수량 표기' },
 { id:'MT-20260821-01', date:'2026-08-21', time:'13:30 ~', title:'STAT Storage 정책 및 소모품 trolley 정책 변경에 따른 이슈 논의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[STAT Storage 정책 변경]\n1) PK/IC가 상온 보관이 가능한 것으로 확인되어, Prep Consumable Storage의 Trolley에 장착하여 운영한다.\n2) Trolley를 Undoking한 후 잔여 PK/IC는 Material Setup 메뉴를 통해 신규 Socket으로 옮겨 장착한다. (다른 소모품/시약과 동일한 운영 방식)\n3) STAT Storage에 투입 가능한 물품을 검체로 제한하며, 슬롯은 논리적 점유 방식으로 운영한다.\n4) STAT Storage에 검체를 추가로 투입하여 소모품/시약이 부족한 경우, Prep Consumable Storage의 Trolley 교체를 통해 보충한다. (사용성 측면에서 불편이 발생할 수 있으나, STAT Storage 사용 빈도는 낮을 것으로 예상)\n\n>> STAT 관련하여 전반적으로 검토 후 화면 수정 진행 필요\n*예상 범위\nㄴInventory : Location 정보 변경\nㄴTSS: 입고 화면의 툴팁내 STAT 메시지 내용 변경. 소모품 트레이 장착 화면영역 내 소모품 개수 표현 영역 변경(기존 개수 15개에서 6개 추가하여 21개 변경됨)\nㄴIC/PK 구성 메뉴: 현안 유지(씨젠 시나리오: 소모품 트롤리 제거 후 PK/IC 소켓을 회수하여 남은 튜브와 새로 넣어야 하는 튜브들과 다시 구성하여 넣는 식으로 가이드할 예정)\n\n*추가 안전 장칙(알럿)\nㄴSTAT에 Sample 외에 소모품을 넣을 경우, 입고 불가 알럿 추가\nㄴSTAT에 Sample 입고 후 회수 안된 위치에 다른 것을 넣을려고 할 때, 사용중이라는 알럿 추가\n\n[소모품 Trolley 정책 변경 건]\n-최초 정책: 모두 사용 후 폐기되는 방향(즉 새제품만 넣는 방향으로 설계)\n-실제 구현: 검사 종료 후 트롤리 제거 시, 사용 후 남은 것들은 입고되었던 위치에 회수되는 구조\n(사용한 것 폐기 후 남은 것만 회수되는 소모품: Tip, Swab / 폐기되지 않고 사용한 것과 미사용한 것이 함께 회수되는 소모품: Tube, Tub, IC, PK)\n\n이슈\nㄴ다시 리턴된 일부 사용된 소모품인 경우, 다시 구성할 때, 장비가 사용한 시점을 인지하고 연속으로 사용할 수 있는 지 체크 -> 개발사에 이렇게 개발될 수 있게 적용 요청 예정\n   ㄴ문제점: 사용자가 사용된 것과 미사용된 것을 구분하여 직접 제거해야 해서 휴먼에러가 발생될 수 있음. 실제로 사용안한 것을 추가로 제거하거나 사용된 것이 사용안한 자리에 섞여서 다시 장비에 들어갈 케이스\n   ㄴ 방안: 장비가 재사용하는 소모품의 위치값에 실제로 소모품이 없다면 3번 정도 위치를 옮기면서 시도해보고 그래도 없으면 동일한 소모품으로 사용되고 오류를 발생시킨 소모품은 사용하지 않고 회수시킴. 또한 장비가 사용할 때, 사용했던 tube인지 체크하여 사용하는 로직 추가\n   ㄴ문제점: run start 시점으로 자재값을 모두 리셋하기 때문에 해당 값을 들고 있을 수 없음\n   ㄴ 방안: 바코드 기반으로 남은 개수를 확인할 수 있고, 어디까지 사용했는 지 유추할 수 있는 방식이 필요함\n- 일부 소모품이 부족할 경우, 트롤리 제거하고 다시 구성하여 사용함(트롤리는 런스타트 기점으로 리셋이 되기 때문에 빼는 순간 다시 넣는 소모품을 재작업해야함)\n\n*예상범위\nㄴ Usage History 개념 변경 필요\n\n[추가 논의 포인트]\n- DX에서 보낸 PCR과 일치하지 않은 IC가 있을 경우, event message 표기\nㄴIC 먼저 분주하고 event message로 해당 PCR 입고해달라고 하는 방식도 보완이 필요할 지 체크하기', etc:'- PCR 시약 폐기 정책: PCR 0T일 경우만 폐기함. 10~20T가 남았을 때는 고객이 Delete 기능을 사용하여 제거하는 방식으로 활용할 예정\n- TSS에서 바코드 인식 시, 모든 화면에 Toast Popup 적용 요청 건. 2차 범위에 추가 요청 (+소모품 트롤리 구성할 때, 개수 표기를 토스트팝업으로 적용하고자 함)' },
 { id:'MT-20260820-01', date:'2026-08-20', time:'13:30 ~ 15:00', title:'Prep 장비별 특성에 따른 이슈 논의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 하승현', status:'원문', body:'[장비별 현황]\n- 단디메카: STAT 4칸 사용 가능, Sample Storage에 냉장 버퍼 4칸 사용 가능\n- 로체시스: STAT 3칸 사용 가능, Sample Strorage에 버퍼 공간 없음\n\n[이슈]\n- IC 소켓이 STAT으로 들어갈 경우, 로체의 경우 보관할 버퍼 공간이 없어서 Sample storage 트레이에 보관을 해야함.\n- 트레이 내 1칸만 사용할려고 했는데, 연속런의 경우 검체 트롤리를 변경 할 때(연속 런 케이스), 그에 맞는 IC와 PCR을 추가로 입고해줘야 함. 다만 이때 1개의 버퍼공간만 사용한다면 이전 검사와 다른 IC가 들어가는 케이스일 경우 IC 소켓을 추가로 입고할 수 없음.\n- 그래서 추가로 공간을 더 확보해야함. (단디 기조에 맞춰 4칸 정도 예상 중)\n- 문제점: 검체 트롤리 입고 영역을 버퍼로 사용함에 따라, Run이 끝나고 검체 트롤리를 제거할 시점에 PCR 시약이 스토리지에 남아 있으면 IC 소켓이 제거되면 안됨.\n  ㄴ 방안 씨젠 제안: 트롤리 회수할 때 사용자가 직접 꺼내 IC 남은 것들을 다시 하나로 합쳐서(TSS 재작업) 입고해서 사용될 수 있는 정책 설정\n  >> 우려: PCR 리셋 기능을 사용할 경우, 해당 PCR의 IC를 함께 제거하기 무리가 있음. IC는 Sample storage 버퍼 공간에서 관리되고 있기 때문에 중간에 꺼내기가 어렵고 런이 끝난 후 검체 트롤리를 제거할 때 육안으로 어떤 IC가 PCR과 페어링되는 지 확인할 수 없음. 또한 Prep은 자동 폐기가 아니라서 IC에 페어링된 PCR이 모두 사용완료되어 폐기된 시점을 파악해서 STAT으로 IC소켓을 리턴시켜서 사용자가 직접 제거하게 해야함. 이런 복잡성으로 인한 사용자의 인지부조화로 인한 에러케이스가 발생될 것으로 예상됨\n\n[기타 논의]\n- DX 시스템의 소모품/시약 slot의 경우 가변형으로 대응 가능하도록 적용(재단용과 생산용의 소모품 입고 slot 수가 상이함. 모듈 내에 공간이 부족하여 어쩔 수 없이 표준형은 더 줄인 개수로 적용될 예정)\n- 확실한 slot 개수는 아직 미정이라 최종 fix된 후 공유할 예정\n  ㄴ브렉스) 장비 slot 관리는 하드웨어 단에서 관리하고 우리는 가변적으로 올라오는 값이 표기되는 방향으로 반영(디스크립션에 관련된 영역에 내역 추가할 예정)\n  ㄴ리셋(delete) 팝의 경우, slot 개수가 가변적으로 보이도록 UI 수적 필요. 스크롤 생성도 무방\n  ㄴMB Tube는 10칸에서 5칸으로 사용됨에 따라, 물리적으로 남은 5칸의 입구를 막아서 사용할 예정. 이에 따른 MS 화면의 이미지 5칸으로 보이게 수정 요청\n  ㄴTip 및 MB Tube 같이 위치값 없이 입고되는 케이스일 경우, 리셋(delete)의 경우 all reset 되는 방식으로 적용\n  ㄴSTAT도 3~4칸 사용에 따라 MS화면의 이미지가 3칸정도만 보이게 수정 요청', etc:'' },
 { id:'MT-20260819-01', date:'2026-08-19', time:'13:30 ~', title:'일정 논의 및 UX 논의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[Inventory]\n- 도킹 시점, 배치별 필요 개수 보는 것은 현재 범위에서 제외\n- 소모품/시약 카드 내 정렬은 노차장님이 정해준 기준으로 하드코딩하여 관리\n  ㄴ Pretreatment Reagents > (1)Tube, (2)Tub 별 알파벳 오름차순 정렬\n- 상태값 필터는 좌/우 카드 모두 반영\n- Waste bin/bottle: 현상 유지, 2차에서 카드형으로 변경\n- Summary: 현상 유지, 2차에서 신규 UI 작업 적용(waste bin 카드형 작업과 함꼐 반영)\n  ㄴSummary 유지에 따라 Dashboard도 변경사항 없이 현안 유지\n- MB tube 최대 입고 개수 5개로 변경에 따라 UX 반영\n\n[System setting]\n-  T-ios) Export/Import Location 제거\n\n[Run]\n-  Step 2 상단 문구 추가 > 구동 중인 것까지 모두 합산된 수량 안내', etc:'- PCR 소켓 구성 시, Tube 바코드는 찍고 넣는 정책은 제외(현상 유지)\n- Inventory 재고 범위는 개발사와 다시 논의 후 이야기\n- Prep 장비는 해당 Run이 끝나면 사용하던 소모품/시약 모두 입고했던 트롤리리 리턴함.\n  ㄴ관련해서 TSS 트롤리 입고 단위(rack)이 아닌 낱개 개수로 표기 고려 (최종 논의 후 반영 필요. 범위는 1차)\n  ㄴInventory에서도 입고 단위를 어떻게 표현할지 검토 필요\n- MB Tube 입고 단위 변경: 기존 10개에서 5개로 변경(카트리지 입고 단위와 동일하게 적용하기 위한 변경)\n- DX 스토리지 입고 개수가 모델별 차이가 있을 예정.\n  ㄴ표준형은 기본 개수, 맞춤형은 최대 개수로 제작될 예정(예, DWP는 기본형은 5칸, 맞춤형은 6칸으로 제작됨)\n- 단디와 로체 장비 소프트웨어는 각각 개발될 예정.(소프트웨어에 따른 화면 수정 범위는 현재까지는 없음)' },
 { id:'MT-20260814-01', date:'2026-08-14', time:'10:00 ~ 11:00', title:'일정 논의 및 UX 논의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[일정 논의]\n- Account setting 및 Profile 일정 변경 (LNB 작업을 2회 나눠서 하는 것에 대한 효율성 재고)\n- Run과 통계 우선순위 핸들링\n\n[일정 논의]\n- LNB, Account setting, Profile 작업 선진행 → LNB 수정 작업 이슈로 인한 일정 조정\n- Run → 소모품/시약 단계 수정 건 1차 진행 협의 완료\n- 통계 (기존 보완 & 이벤트) → 2차 진행 협의 완료\n- System setting → UI 기능 제거 (서버 개발쪽으로 기능 이관 예정)\n\n[기타]\n- Inventory 소모품/시약 그룹핑 기준\nㄴ Consumable → Tip / Plate / Tube 그룹핑\nㄴ Reagent → Standard tube + Tub → Pretreatment Reagents 그룹핑\n\n- Inventory 재고 정의 공유 필요\nㄴ Storage에 있는 항목을 재고로 볼 것 인지, 버퍼공간에 있는 것도 포함해서 볼 것 인지', etc:'', note:'원문 날짜 "2026-08-14(목) 10:00 ~ 11:00"의 요일(목)이 실제 요일(금)과 다릅니다. 원문 그대로 두었습니다.' },
 { id:'MT-20260813-01', date:'2026-08-13', time:'09:30 ~ 11:30', title:'UX 및 UI 리뷰 및 기타 질의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[Common]\n- Logout과 Exit 별도 제공\nㄴ 엔지니어 계정일 경우 → 위 버튼 선택 시, 팝업 노출\n\n[Statistical Analysis]\n- Error Rate > 누적 집계\n- Usage & Cost > 단일 선택 & 그래프 혼합 제공 필요\n\n[Material Setup]\n- 얼럿/컨펌 > 이어서 진행\n- Carrier 위치값 확인 및 전달 필요\n- PCR box & 하위 구성 시약 바코드 매핑 확인 및 전달 필요\n- Sealer\n\n[Inventory]\n- 현행 유지(품목 기준)\n- 시약 유효기간 > 배너 UI로 변경\n\n[Event History 체계 변경]\nㄴ개발사와 추가 논의 필요. 상위 알러코드 하위 알러코드 분리되어 사용예상\n\n[기타]\n- 컨펌/알럿 문구 수정 체크 및 재논의\nㄴ이벤트 히스토리에 들어가는 것이 아니면 현재 브렉스 기준으로 작업하는 방식으로 정리', etc:'- System stting 백업/복원 기능 제거 및 이력 조회 추가 건\nㄴL/T 모두 기능은 그대로 유지\nㄴ자동 백업 기능을 추가할 것이라 언제 백업할 지 시간 입력하는 항목 추가\nㄴ마지막 파일만 1개만 유지하고 지난 것은 삭제되는 구조\nㄴ전체 데이터(로그, 저장데이터 모두) / 셋팅 데이터(데이터 제외하고 기계나 프로토콜 설정된 값들만)\nㄴ백업/복원 저장경로는 우리측에서 안하고 시스템에서 알아서 설정된 공간에 할 예쩡\nㄴ백업/복원 진행 중에 로딩바를 표시하여 접근하지 못하게 함 (자동 백업 시간대에 running 중이면 실패 처리)\nㄴ수동 백업은 이력을 전체로 / 자동 백업은 최신 한달간\n>>>> 다시 재정의 후 전달 예정(팀즈 채팅으로 공유)\n\n- 트롤리 스캔 후 입고 방식 추가 건(로체시스템즈)\nㄴ설계 변경 할 예정.' },
 { id:'MT-20260811-01', date:'2026-08-11', time:'10:00 ~ 11:30', title:'UX 및 UI 리뷰 및 기타 질의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[Inventory]\n- Remaining Qty 정보가 표시되는 방향으로 진행\n\n[종료 버튼]\n- 현재 안으로 진행\n\n[MT 부분리셋]\n- 체크 기능 제거 & 범례 추가\n- 중복 팝업 디자인 변경 요청 (언어, 터치 이슈 및 중앙 팝업이 직관성 높음)\n\n[Run]\n- 유효기간 지난 시약 자동 폐기 확정 여부 전달 필요 (씨젠 > 브렉스)\n- \'rxns\' > \'T\' 표기 변경\n\n[그 외]\n-트롤리 스캔 후 입고 방식 추가 건(로체시스템즈)\n- Event History 체계 변경 건\n- System stting 백업/복원 기능 제거 및 이력 조회 추가 건', etc:'' },
 { id:'MT-20260805-02', date:'2026-08-05', time:'09:30 ~ 11:30', title:'UX 및 UI 리뷰 및 기타 질의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[Inventory]\n- 아코디언을 한번에 열 수 있는 기능 추가\n- 소모품 상세 팝업에서는 유효기간 정보 제거\n- 입고 Type > 단어 수정 예정 (현업 확인 예정)\n- 하위 구성품이 많을 경우 total과 detail의 영역을 명확하게 분리\n- Tub와 Tube는 동일한 유형끼리 묶는 방향으로 진행\n- 레이아웃은 좌우 분할 화면으로 진행', etc:'[장비]\n- Sample Storge door (1개 > 2개로 변경)\n- Sample Preparation (업체별 Door 개수가 다를 수 있음 1개 또는 2개)\n- STAT (업체별 개수가 다를 수도 있음 최소 1개 ~ N대)', note:'원문 날짜 "2026-08-05(목) 09:30 ~ 11:30"의 요일(목)이 실제 요일(수)과 다릅니다. 원문 그대로 두었습니다.' },
 { id:'MT-20260805-01', date:'2026-08-05', time:'09:30 ~ 11:30 / 13:30 ~ 16:20', title:'UX 및 UI 리뷰 및 기타 질의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[Sample tube Setting UI 리뷰]\n- Tube name 필수 값으로 변경 및 순서 이동(테이블 내 맨 앞열/ 상세 페이지 내 최상단)\n- LIS code 50자 이내\n- Sample Tube Setting > Tube Setting 변경\n\n[Lis setting UI 리뷰]\n- setting menu 일부 레이아웃 변경 논의\n- Sample UI 대신 Lis setting UI먼저 작업하여 두개 일정 변경한 내역 공유\n\n[Statistical Analysis  UX 리뷰]\n- 가동률 > 추후 데이터 적재 후 진행 논의 예정\n- Event ratio > 메뉴별 에러코드 출력\nㄴ Sample, Instrument, Inventory(consumable/reagent/wasted bin), System\n\n[상태값 정의]\n- 장비 / 모듈 / 이벤트 / 경광등 상태값 재정의 후 공유 예정\n\n[L-IOS 프로그램 종료]\n- Log out 시, 프로그램 종료 / 시스템 종료 기능 구분\nㄴ 유저 - 시스템 종료만 선택 가능\nㄴ Service - 두 종료 케이스 모두 선택 가능\n\n[Event History 팝업메시지]\n- 최대 개수 정의 X / N개일 경우, 겹쳐보이는 UI 구성\n- 팝업 목록 체크박스 제거 & 알람 전체 closed 할 수 있는 기능 변경\n- T-ios 화면 노출 필요\n\n[Instrument 가동시간, 불량률, enable stting 대상 추가]\n- 명칭 변경 (Setting > Management)\n- 모듈에 따른 계층 구조 UI 활용\n\n[MS(TSS) 부분 리셋]\n- Undo 제거 & Reset 팝업 내, 기존 적재 항목 표기 필요\n\n[정책]\n- 이벤트 히스토리\nㄴ메인 PC & 콘솔 PC에만 팝업메시지 노출 (TSS 미노출)\n- L-ios\nㄴ 서버 PC >  L-ios UI & L-ios 서버로 구성 > L-ios UI 이슈로 인해 종료될 경우, Windows에서 L-ios UI 프로그램 자동 실행\nㄴ 메인 PC & 콘솔 > Idel, Not initialized 상태 & 60분 이상 움직임 없을 때, 로그아웃 처리', etc:'- UI 추가 사항 전달\n  ㄴ스켈레톤 작업 내역\n  ㄴPagantion 변경(기존 7페이지 단위에서 10페이지 단위로 T/L 통합)\n  ㄴ목록형 페이지 내 Item UI 변경\n\n- 추가 문의\n  ㄴPCR 시약의 set 단위 - Socket 1개에 2 set (200) 적재 가능\n  ㄴEvent history error 타입 - Sample, Instrument, Inventory(consumable/reagent/wasted bin), System\n  ㄴ전처리 모듈에서 장비 1대만 사용하는 케이스도 있는 지?\n\n- 금주 금요일에 2.1.01 버전 업데이트 진행 예정\n  ㄴ 대상: 목요일까지 최종 컨펌된 내역 및 UI 일부 변경된 내역 공유 / 라이브러리 업데이트도 함께 진행될 예정\n\n-언어셋\nㄴ 10/23(2차 마무리) 기한에 맞춰 얼럿/컨펌 전달 예정' },
 { id:'MT-20260728-01', date:'2026-07-28', time:'10:00 ~ 11:30', title:'화면 리뷰 및 메뉴 질의', cust:'김의식 차장', brex:'서보경, 정다예, 하승현', status:'원문', body:'[Inventory]\n- Loading tupe 영역에 Prep/DX full name 넣기\n- Storage Location 개수 표기는 제외\n\n[통계]\n- 가동시간\nㄴ 전체 가동시간 & 일자(일별/월별)에 따른 가동시간 데이터 노출\nㄴ 모듈별/유닛별 가동 시간 필요\n\n- 평균 가동시간\nㄴ 일자(All/일별/월별)에 따른 가동시간 데이터 노출\nㄴ 전체 장비에 대한 누적 가동시간 > Insturment 메뉴 추가 (Running 중인 시간의 합산)\n\n- 가동률 / 불량률\nㄴ 가동률 : 일자별 모듈/유닛에 따른 가동률 정보 필요 (장비 running / 장비 전원 on)\nㄴ 불량률 : 가동시간과 동일하게 모듈별/유닛별 데이터 필요 (Service 계정 관리)\n\n- 소모품\nㄴ 소모품 및 시약 사용 개수 & 비용 정보 필요 (순수 비용 정보 제공하기 위함)\nㄴ 일별/월별 소모품 및 시약 전체 사용 비용 데이터 노출\n\n- 이벤트\nㄴ 이벤트 타입 재정의 후 공유 필요 (Seegene > Brex)\nㄴ Legend > Consumable, Reagent 병합 (현업 내부 논의 필요)\n\n[장비 관리]\n- 장비 타입 / 개수 / Unit Device(N대일 경우만 노출)\n- Prep 하단은 \'전처리\' 장비만 배치 가능 / 상단만 분주 또는 전처리만 선택할 수 있게 적용 필요\n- Prep 모듈의 N대일 경우, Device의 경우 1대의 분주, 1대의 전처리 장비가 선택될 수 있게 적용되어야 함\n- Prep 상/하 두칸에 비울 수 있는 케이스가 있는 지?\n- 설정 시, 디폴트 레이아웃을 셋팅되어 있고, 거기서 추가 설정이 가능하도록 적용 요청 (가변적인 정보만 설정하도록)\n- 장비 시스템에서 L 시스템으로 장비 구성 정보를 알려주는(통신) 체계는 없기 때문에, 수동으로 셋팅하는 화면이 필요함.\n- 장비 시스템과 L시스템에 장비 구성도가 다를 경우, L이 갖고 있는 정보가 우선 기반되어 플랫폼에 적용되어 표기되는 구조\n==> 장비간 통신으로 자동설정되는 방식으로 변경에 따라 해당 메뉴는 제외(팀즈 - 2026/07/28-김의식차장님)', etc:'' },
 { id:'MT-20260722-01', date:'2026-07-22', time:'11:00 ~ 11:30', title:'MS 논의 외 기타', cust:'김의식 차장, 노경민 차장', brex:'서보경, 하승현', status:'원문', body:'- 언어셋\nㄴ노차장님이 전달주신 영문 변경내역이 English 열에 적용된 버전으로 해외법인으로 전달\n\n- MS\nㄴ 트레이에 소모품 적재하는 화면에서 Reset 버튼이 전체 트롤리를 reset된다는 뉘앙스가 있어, 변경을 요청\nㄴ 해당 화면에 트레이가 채워지고 있다는 프로그래스바가 있었으면 함. 다만 기존의 전체 필요한 소모품 정보도 함께 공존했으면 함\nㄴ 바로 적용은 아닌 2.1버전에는 개선된 버전을 가져갔으면 함', etc:'', note:'원문 날짜 "2026-07-22(화) 11:00 ~ 11:30"의 요일(화)이 실제 요일(수)과 다릅니다. 원문 그대로 두었습니다.' },
 { id:'MT-20260721-01', date:'2026-07-21', time:'10:00 ~ 11:30', title:'화면 리뷰 및 메뉴 질의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 하승현, 정다예', status:'원문', body:'[Samples]\n- Details > 탭으로 구분하지 않고 스크롤을 활용한 리스트 형태로 Info 제공\nㄴ Progress > Genaral & Sample location > Plate > Reagent & Protocol 정보 순\n\n[Inventory]\n- 시약의 경우, 뎁스있게 구성하여 대분류에서 구분 필요\nㄴ e.g) 진단시약, 추출시약\n\n- 현재 장비에 장착된 항목 기준으로 정보 노출 (기존 유지)\nㄴ Overview(저장 위치 관점) > 현재 모듈 기반, 적재 개수 제공\nㄴ 탭 view(필요 정보 관점) > 해당 탭의 항목이 어느 모듈에 필요한 지에 대한 정보 제공\n\n- Details 팝업 > 시약 위치값만 표기 필요\n\n- Universal 모듈 > Front door 없는 모듈 있음\n\n[기타]\n- RUN 중에 시약의 유효기간 지난 경우, 허용한다. (정책 추가)\n- 전처리 모듈은 항상 디바이스 하단에 위치한다. (정책 추가)\n- Sample Pretreatment 모듈에서 분주 type에 따라 Unit 구분 필요\nㄴ 추후 Disabled 정책 관련 논의 필요', etc:'' },
 { id:'MT-20260720-01', date:'2026-07-20', time:'14:00 ~ 16:00', title:'업무 일정 논의 및 메뉴 질의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 하승현, 정다예', status:'원문', body:'[일정 논의]\n- 24일(금)까지 2차 세부 일정 작업 후 공유 (브렉스 > 씨젠)\n\n[언어셋]\n- 영문 문구(21일) / 얼럿/컨펌 문구(23일) 전달 (씨젠 > 브렉스)\nㄴ 영문 문구 공유 안 될 경우, 기존 영문 유지\n\n[Test status]\n- Web) 스크롤 시, 상단 영역 축약형 수정 건 > 기존 유지\n\n[검체 튜브 설정]\n- Socket type 선택 시, 최종 선택된 예시 항목 추가\n\n[Samples]\n- 기존 Sample Details에서 추가 정보 노출 필요\n- Sample progress & Reagent Info 연관성 제거 후, 정보 제공 필요\n- 공통 영역에서 시약 & 프로토콜 정보 노출\nㄴ 프로토콜 정보의 경우, 해당 프로토콜을 사용한 검체 정보만 노출\n\n[기타]\n- LIS에서 검체 타입에 따른 용기를 내려주지 않거나 신뢰하지 않은 정보를 내려줄 수 있음\nㄴ 검체 스캔 시, Sample tube 종류에 따른 검체 용기 설정 건 (현업 검토 중)', etc:'' },
 { id:'MT-20260714-01', date:'2026-07-14', time:'09:30 ~', title:'신규 추가 기능 및 메뉴 질의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 하승현, 정다예', status:'원문', body:'[LIS Setting]\n- HL7 편집 가능하지 않도록 Disable\n- Rest API 삭제\n- General : 쿼리방식(샘플 아이디 기반/전체 오더 기반)으로 할지, Push 방식으로 할지 선택하는 항목\n- T-IOS Port : 20200\n\n[검체튜브설정]\n- 검체 튜브가 정형화되어 있지 않아서 새로운 유형의 검체 튜브를 맵핑하는 메뉴\n- LIS Code는 검사실마다 정해지는 규칙이 다름\n- 독일에서 사용하는 소켓타입 외에 추가 예정 (아직 제작되지 않음)\n- 대분류/중분류도 선택 : 중분류 0~9까지\n- 7/8/9번은 소수점 3자리까지 입력 / Min Max 값은 없음 / mm 단위\n- 하단 유형 정보를 드롭박스 형태로 (필수 아님) : 명칭 및 항목은 현업에서 전달 예정\n- 특이사항에 대한 입력 기능 추가\n- 수정/삭제 가능해야 함\n\n[통계]\n- 소모품/시약 사용량(일별/월별 등) 위주로 정보 형태 제공\n- Device 타입은 가동시간/불량률, 사용여부 관리 필요\n- 이벤트 발생 유형에 대해 그룹핑하여 집계하는 방안 고려\n\n[Event history]\n- sample type 추가\n- 7월 중순 Prep 이벤트 코드 전달 예정', etc:'' },
 { id:'MT-20260713-01', date:'2026-07-13', time:'10:30 ~', title:'기존 구현된 화면 관련 추가 논의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 하승현, 정다예', status:'원문', body:'[Samples]\n- Sample location\nㄴSTAT 스토리지 들어가고 나오는 위치값 표기 필요\nㄴ프로토콜, 튜브 바코드 표기 추가하는 것이 1순위다\n\n[Inventory]\nㄴDX 모듈 구분해서 개수 특정 한다(N대의 모듈이 있을 경우, 어떤 모듈로 보낼 지 미리 체킹해서 필요한 개수를 표기한다)\nㄴ트롤리 경우, N대의 모듈의 경우 어떤 모듈에 추가로 넣어야하는 지에 대한 (어디에) 정보가 필요하다', etc:'', note:'원문 날짜 "2026-07-13(금) 10:30 ~"의 요일(금)이 실제 요일(월)과 다릅니다. 원문 그대로 두었습니다.' },
 { id:'MT-20260710-01', date:'2026-07-10', time:'13:30 ~ 3:00', title:'일정 및 업무 범위 협의', cust:'김의식 차장, 노경민 차장', brex:'서보경, 하승현, 정다예', status:'원문', body:'[일정]\n- 9월 20일 구현 완료 후 1달 반 검증 예정\n- 월요일 오전 중으로 영어 검토 범위 공유 예정\n[언어셋]\n- 진행 방향은 현업 논의 후 전달 예정 (1안으로 진행)\n- 1안 : 법인까지 적용된 언어를 일괄 적용하는 방향으로 진행 필요\n- 2안 : AI 버전으로 진행 / 고도화 메뉴 일부 진행\n[운영 - 필수]\n- LIS 설정 번경 : 쿼리 기반으로 옵션 설정 변경\n- 시약 30개 추가 예정\n- TSS 보완\n[TSS 보완 사항]\n- Undo 버튼 추가 및 선택 시 가변형 컨펌 팝업 노출\n- Reset 버튼 선택 시 컨펌 문구 수정 :  현재 재고 데이터까지 초기화 된다는 내용', etc:'' },

  var others = tabDef('prov').groups[0].items.filter(function(x){ var me = findItem('prov', id); return x.id!==id && me.grp && x.grp===me.grp && pv[x.id].status==='승인 대기'; });
  var reject = dec === '반려';
  box.innerHTML = '<div class="confirm">' + (others.length && !reject ? '<div class="warnline">같은 정책(' + esc(findItem('prov',id).grp) + ')을 바꾸는 승인 대기 임시 정책이 있습니다: ' + others.map(function(o){ return esc(o.id); }).join(', ') + '. 함께 확인하세요.</div>' : '') +
    '<b>' + esc(id) + ' ' + esc(dec) + '</b>' + '<textarea id="memo" placeholder="' + (reject ? '반려 사유 (꼭 적어야 합니다)' : '메모 (선택)') + '"></textarea><div class="err" id="err"></div>' +
    '<div class="acts"><button type="button" class="btn" data-cancel>취소</button><button type="button" class="btn ' + (reject ? 'dan' : 'pri') + '" data-ok="' + esc(dec) + '">' + esc(dec) + ' 확정</button></div></div>';
  document.getElementById('memo').focus();
}
function confirmDec(dec){
  var id = state.sel.prov, memo = document.getElementById('memo').value.trim();
  if (dec==='반려' && !memo) { document.getElementById('err').textContent = '반려 사유를 적어 주세요.'; return; }
  var today = new Date(), ds = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  pv[id].status = dec==='반려' ? '반려' : '승인';
  pv[id].decisions.push({ date:ds, dec:dec, memo:memo });
  var msg = dec==='반려' ? id + ' 반려: ' + memo : id + ' ' + dec;
  pv[id].result = '<b>예시라 실제로 저장하지 않았습니다.</b> 실제 프로그램에서는 PV 파일의 "상태" 줄을 <code>' + esc(pv[id].status) + '</code> 상태로 바꾸고, "결정" 표에 한 줄을 더하고' + (dec==='반려' ? ', 파일을 <code>old-provisional/closed/</code>로 옮기고' : '') + ', 대표 저장소에 커밋합니다: <code>' + esc(msg) + '</code> ' +
    (dec!=='반려' ? '다음은 승인 담당자가 공통 규칙에 반영하고 버전을 올리는 일입니다(R11). ' : '') + '<button type="button" class="reset" data-reset>예시 처음으로</button>';
  curFilter.prov = pv[id].status;
  render();
}

document.addEventListener('click', function(e){
  var t;
  if ((t = e.target.closest('[data-page]'))) { state.page = t.dataset.page; if (state.tabByPage[state.page]) state.tab = state.tabByPage[state.page]; render(); return; }
  if ((t = e.target.closest('[data-tab]'))) { state.tab = t.dataset.tab; state.tabByPage[state.page] = state.tab; render(); return; }
  if ((t = e.target.closest('[data-gotab]'))) { state.tab = t.dataset.gotab; state.tabByPage.work = state.tab; render(); window.scrollTo(0,0); return; }
  if ((t = e.target.closest('[data-mt],[data-mtme],[data-mtw],[data-mtsave],[data-mtmerge],[data-mtdone],[data-pcreg],[data-pcex],[data-mtans],[data-mtnew],[data-agadd],[data-mtcancel],[data-mtdraftsee],[data-ckopen],[data-ckclose],[data-cksend],[data-ckfix],[data-ckcommit]')) && mtClick(t)) return;
  if ((t = e.target.closest('[data-wk]'))) { wk = Math.max(0, Math.min(WEEKS.length-1, wk + (+t.dataset.wk))); render(); return; }
  if ((t = e.target.closest('[data-ans]'))) { ansState[state.sel.disc] = { step:1 }; renderDoc(); return; }
  if ((t = e.target.closest('[data-anscancel]'))) { delete ansState[state.sel.disc]; renderDoc(); return; }
  if ((t = e.target.closest('[data-anssend]'))) { var tx = document.getElementById('ansText').value.trim(); if (!tx) return; ansState[state.sel.disc] = { step:2, text:tx }; renderDoc(); return; }
  if ((t = e.target.closest('[data-ansfix]'))) { var fx = document.getElementById('ansFix').value.trim(); if (fx) { ansState[state.sel.disc].fix = fx; } renderDoc(); return; }
  if ((t = e.target.closest('[data-anscommit]'))) { ansCommit(state.sel.disc); render(); return; }
  if ((t = e.target.closest('[data-blo]'))) { var o = t.dataset.blo; if (o === '*') BL_OWNERS.forEach(function(x){ bl.owners[x] = true; }); else bl.owners[o] = !bl.owners[o]; render(); return; }
  if ((t = e.target.closest('[data-blk]'))) { bl.kind = t.dataset.blk; render(); return; }
  if ((t = e.target.closest('[data-blm]')) && !e.target.closest('[data-go]')) { var mm = t.dataset.blm; bl.open[mm] = !bl.open[mm]; render(); return; }
  if ((t = e.target.closest('[data-seg]'))) { curSeg = t.dataset.seg; var gg = tabDef('disc').groups.filter(function(x){ return x.key===curSeg; })[0]; if (!gg.items.some(function(x){ return x.id===state.sel.disc; })) state.sel.disc = gg.items[0].id; render(); return; }
  if ((t = e.target.closest('[data-sst]'))) { sf.st = t.dataset.sst; render(); return; }
  if ((t = e.target.closest('[data-dt]'))) { openPer(+t.dataset.di, t.dataset.dt, t); return; }
  if ((t = e.target.closest('[data-perclose]'))) { document.getElementById('perpop').hidden = true; return; }
  if ((t = e.target.closest('[data-perclr]'))) { SCHED[+t.dataset.perclr][t.dataset.f] = ''; saved = '날짜 지움'; render(); return; }
  if ((t = e.target.closest('[data-perok]'))) { var dv = document.getElementById('pD').value; if (!dv) { document.getElementById('pErr').textContent = '날짜를 고르세요.'; return; } SCHED[+t.dataset.perok][t.dataset.f] = fromIso(dv); saved = (t.dataset.f==='g' ? '작업 완료일' : '개발사 공유일') + ' 저장함'; render(); return; }
  if ((t = e.target.closest('[data-refresh]'))) { var n = new Date(); lastRead = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0'); saved = '다시 읽음 (예시라 실제 시트는 읽지 않음)'; render(); return; }
  if (!e.target.closest('#perpop')) { var pp = document.getElementById('perpop'); if (pp) pp.hidden = true; }
  if ((t = e.target.closest('.item'))) { state.sel[state.tab] = t.dataset.id; render(); return; }
  if ((t = e.target.closest('[data-go]'))) { go(t.dataset.go); return; }
  if ((t = e.target.closest('[data-filter]'))) { curFilter.prov = t.dataset.filter; var f = tabDef('prov').groups[0].items.filter(function(x){ return pv[x.id].status===curFilter.prov; }); if (f.length) state.sel.prov = f[0].id; render(); return; }
  if ((t = e.target.closest('[data-dec]'))) { openConfirm(t.dataset.dec); return; }
  if ((t = e.target.closest('[data-cancel]'))) { document.getElementById('confirmBox').innerHTML = ''; return; }
  if ((t = e.target.closest('[data-ok]'))) { confirmDec(t.dataset.ok); return; }
  if ((t = e.target.closest('[data-reset]'))) { pv = JSON.parse(JSON.stringify(PV0)); curFilter.prov = '승인 대기'; state.sel.prov = 'PV-0001'; render(); return; }
  if ((t = e.target.closest('[data-newpv]'))) { alert('[새 임시 정책] (R10, 2차): 바꿀 내용을 받아 Claude 작업으로 넘깁니다. Claude가 템플릿대로 PV 파일을 만들고, 같은 정책을 바꾸는 승인 대기 임시 정책이 있는지 확인합니다.'); return; }
  if ((t = e.target.closest('[data-role]'))) { role = t.dataset.role; document.querySelectorAll('[data-role]').forEach(function(x){ x.setAttribute('aria-pressed', String(x===t)); }); renderDoc(); return; }
});
document.getElementById('q').addEventListener('input', applySearch);
document.addEventListener('change', function(e){
  var t = e.target.closest('[data-mtf]'); if (!t) return;
  var m = mtFind(state.sel.minutes), k = t.dataset.mtf, v = t.value.trim(), old = m.id;
  if (k === 'date') {
    if (!v || v === m.date) { render(); return; }
    m.date = v;
    var n = MEETINGS.filter(function(x){ return x !== m && x.date === v; }).length + 1;
    m.id = 'MT-' + v.replace(/-/g,'') + '-' + String(n).padStart(2,'0');
    MEETINGS.sort(function(a, c){ return c.id < a.id ? -1 : c.id > a.id ? 1 : 0; });
    state.sel.minutes = m.id;
    mtMsg = '<b>날짜를 고쳤습니다.</b> 회의 ID가 <code>' + old + '</code> → <code>' + m.id + '</code>로 바뀝니다. 회의록 파일 · 작성본 폴더 이름과, 이 ID를 근거로 적은 곳(임시 정책 등)도 함께 고칩니다. <span class="muted">예시라 실제로 저장하지 않았습니다.</span>';
  } else {
    m[k] = v;
    mtMsg = '<b>' + (k==='time' ? '시간' : k==='cust' ? '씨젠 참석자' : '브렉스 참석자') + '를 고쳤습니다.</b> 회의록 머리말에 저장하고 커밋합니다. <span class="muted">예시라 실제로 저장하지 않았습니다.</span>';
  }
  render();
});
document.addEventListener('keydown', function(e){ if (e.key === 'Enter' && e.target.matches && e.target.matches('input.inl')) e.target.blur(); });
document.getElementById('noteTog').addEventListener('change', function(e){ document.body.classList.toggle('no-note', !e.target.checked); });
render();
})();
</script>
