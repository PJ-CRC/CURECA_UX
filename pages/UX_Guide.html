<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX 문서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="appnav.css">
<script src="common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* 만든 UX 가이드 보기: .history/guides/{id}/guide.md (깃으로 공유)
   왼쪽 = 목차 트리(## 대분류 › ### 상세), 오른쪽 = 고른 항목의 내용. 좁은 화면에서는 트리가 위쪽 「목차」로 접힌다 */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f3f6fb; --ink:#14171c; --ink-2:#4a5260; --ink-3:#7a8392;
  --line:#e3e7ee; --accent:#2747d8; --accent-soft:#e6ebff; --red:#d93025; --red-soft:#fdecea;
  --ok:#1a7f37; --ok-soft:#e3f4e8; --code-bg:#eef1f6; --shadow:0 1px 2px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#171a20; --surface-2:#1e232b; --ink:#e8ebf0; --ink-2:#b4bcc8; --ink-3:#8590a0;
    --line:#2a3039; --accent:#8ea2ff; --accent-soft:#232c52; --red:#ff7b72; --red-soft:#3a1f1e;
    --ok:#56d364; --ok-soft:#16301d; --code-bg:#222831; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a20; --surface-2:#1e232b; --ink:#e8ebf0; --ink-2:#b4bcc8; --ink-3:#8590a0;
  --line:#2a3039; --accent:#8ea2ff; --accent-soft:#232c52; --red:#ff7b72; --red-soft:#3a1f1e;
  --ok:#56d364; --ok-soft:#16301d; --code-bg:#222831; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
/* 본문 너비 · 머리는 appnav.css 공통(.app-wrap 1440px · .app-head 제목 26px). 정보는 제목 아래 칩 한 줄, 버튼은 머리 오른쪽 */
.app-head h1{font-weight:800}
.app-head .lead{max-width:860px}
.back{display:inline-block;font-size:13px;text-decoration:none;margin-bottom:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12.5px;line-height:1.5;padding:2px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);text-decoration:none;white-space:nowrap}
.pill b{color:var(--ink)}
a.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.on b{color:var(--ok)}

/* 두 칸: 목차 트리 340 | 내용 */
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:var(--gap);align-items:start}
@media (max-width:1000px){ .layout{grid-template-columns:260px minmax(0,1fr)} }   /* 화면 배율이 크면(200%) 목차를 좁혀 상세를 넓게 */
.side{position:sticky;top:calc(var(--nav-h) + 12px);max-height:calc(var(--ovh,100vh) - var(--nav-h) - 24px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.side-head{padding:12px;border-bottom:1px solid var(--line)}
.side-head input{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.tree{list-style:none;margin:0;padding:8px;overflow:auto;flex:1;min-height:0}
/* 수정 요청 입력창: 목록 · 내용 아래에 따로 한 줄(왼쪽 대상 · 가운데 입력 · 오른쪽 보내기). 쓰기 권한이 없으면 숨고 목록 · 내용이 그만큼 늘어난다 */
.ask{display:flex;align-items:stretch;gap:12px;margin-top:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ask-t{flex:none;width:220px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.ask-t span{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.ask-t b{font-size:14px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask textarea{flex:1;min-width:0;box-sizing:border-box;height:58px;min-height:58px;max-height:160px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:13.5px;line-height:1.5;resize:vertical}
.ask textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.ask-act{flex:none;width:170px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.ask-act .btn{width:100%}
.ask-act span{font-size:12px;color:var(--ink-3);min-height:16px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask[aria-disabled="true"] textarea,.ask[aria-disabled="true"] .btn{opacity:.5;pointer-events:none}
html.doc-ro .ask{display:none}
@media (max-width:720px){ .ask{flex-direction:column} .ask-t,.ask-act{width:auto} .layout.rqm{grid-template-columns:1fr} }
/* 수정 진행 · 결과 패널: 목차 · 내용과 입력창 사이. 길면 그 안에서 스크롤(창 높이의 40%까지) */
#fixes:not(:empty){margin-top:12px;max-height:calc(var(--ovh,100vh) * .4);overflow:auto;border-radius:12px}
#fixes .fix{margin:0 0 8px}
#fixes .fix:last-child{margin-bottom:0}
#fixes .fix + .fix{margin-top:0}
/* 낮은 창(바깥 창 세로 760px 이하): 입력창을 한 줄 높이로. html.low는 fit()이 바깥 창 높이로 정한다
   (@media max-height는 UX 문서 안 iframe에서 iframe 높이를 봐서, 높이가 760 근처면 켜졌다 꺼졌다 하며 흔들렸다) */
html.low .rq .ask textarea{min-height:64px}
.tree ul{list-style:none;margin:2px 0 4px;padding:0 0 0 14px;border-left:1px solid var(--line);margin-left:15px}
.tree li{margin:1px 0}
.node{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:7px 8px;font-size:14px;color:var(--ink-2);line-height:1.35}
.node:hover{background:var(--surface-2);color:var(--ink)}
.node.cur{background:var(--accent-soft);color:var(--accent);font-weight:700}
.node.grp{font-weight:700;color:var(--ink)}
.node .tw{flex:none;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);border-radius:4px;transition:transform .15s}
.node .tw:hover{background:var(--line)}
.node .tw.open{transform:rotate(90deg)}
.node .tw.none{visibility:hidden}
.node .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.node mark{background:#fff1a8;color:inherit;border-radius:2px}
.tree li.hide{display:none}
.side-empty{color:var(--ink-3);font-size:13px;padding:10px}

.main{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r);box-shadow:var(--shadow);padding:28px 36px 32px;min-height:420px}
/* 글 · 표 · 그림 모두 칸 전체 너비: 좌우 여백이 같게(왼쪽 = 오른쪽 36px) */
.crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.crumb button{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px}
.main h2.sec{font-size:22px;margin:0 0 12px;font-weight:800;letter-spacing:-.01em}
.main h3{font-size:16.5px;margin:22px 0 8px}
.main h4{font-size:15px;margin:18px 0 6px}
.main p{margin:8px 0}
.main ul,.main ol{margin:6px 0;padding-left:20px}
.main li{margin:3px 0}
.main blockquote{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 14px;border-radius:6px;margin:12px 0;font-size:14px}
.main blockquote p{margin:4px 0}
code{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--code-bg);padding:1px 6px;border-radius:5px}
pre{background:var(--code-bg);padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.5;margin:10px 0}
pre code{background:none;padding:0}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.8px}
th,td{padding:8px 11px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--surface-2);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:none}
/* 넓은 표: 칸 폭은 widen()이 정하고(표 폭 = 칸 폭 합), 상세보다 좁으면 상세 폭까지 늘어난다. 한글은 낱말 단위로 줄바꿈 */
table.wide{table-layout:fixed;min-width:100%}
table.wide td{word-break:keep-all;overflow-wrap:anywhere}
/* 시트 묶음(meta.books — 예: 언어셋): 엑셀처럼 열 머리(A · B · C) · 행 번호 · 고정 머리글, 아래 시트 탭 */
.wbook{margin:12px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.wb-grid{overflow:auto;max-height:min(62vh,640px)}
.wb-grid table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
.wb-grid th,.wb-grid td{padding:5px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.wb-grid thead th{position:sticky;z-index:2;background:var(--surface-2)}
.wb-grid thead tr.col th{top:0;height:22px;padding:2px 10px;font-size:11px;font-weight:600;color:var(--ink-3);text-align:center}
.wb-grid thead tr.hd th{top:27px;font-weight:700;color:var(--ink)}
.wb-grid .rn{position:sticky;left:0;z-index:1;min-width:34px;padding:5px 6px;text-align:right;font-size:11px;font-weight:600;color:var(--ink-3);background:var(--surface-2)}
.wb-grid thead .rn{z-index:3}
.wb-grid tbody tr:hover td{background:var(--accent-soft)}
.wb-grid td.em{color:var(--ink-3)}
/* 하단 시트 탭: 엑셀처럼 회색 줄 · 왼쪽 ‹ › · 탭 사이 가는 세로선 · 고른 시트는 흰 바탕으로 올라오고 이름 밑에 초록 줄 */
.wb-tabs{--xl:#107c41;display:flex;align-items:center;gap:0;min-height:40px;padding:0 10px 0 6px;border-top:1px solid var(--line);background:#e9ebee;overflow-x:auto}
.wb-tabs .nv{flex:none;width:30px;height:30px;border:0;border-radius:6px;background:none;color:#7a8392;font-size:16px;line-height:1;cursor:pointer}
.wb-tabs .nv:hover:not(:disabled){background:rgba(0,0,0,.06);color:var(--ink)}
.wb-tabs .nv:disabled{opacity:.35;cursor:default}
.wb-tabs .nvs{flex:none;width:42px}
.wb-tabs button.tab{position:relative;flex:none;height:34px;margin-top:-1px;padding:0 18px;border:0;border-radius:0 0 7px 7px;background:none;color:#3b4250;font:inherit;font-size:13.5px;font-weight:500;white-space:nowrap;cursor:pointer}
.wb-tabs button.tab+button.tab::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:1px;background:#c9ced6}
.wb-tabs button.tab:hover:not(.on){background:rgba(0,0,0,.05)}
.wb-tabs button.tab.on{background:var(--surface);color:var(--xl);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.wb-tabs button.tab.on::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;border-radius:2px;background:var(--xl)}
.wb-tabs button.tab.on::before,.wb-tabs button.tab.on+button.tab::before{display:none}
.wb-tabs .sp{flex:1;min-width:12px}
.wb-tools{--xl:#107c41;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.wb-tools .hint{font-size:12px;color:var(--ink-3);margin-right:6px}
.wb-tools .hint b{color:#b35900}
.wb-tools .sp{flex:1}
.wb-tools .wbb{height:28px;padding:0 11px;border:1px solid #c9ced6;border-radius:7px;background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer}
.wb-tools .wbb:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.wb-tools .wbb:disabled{opacity:.45;cursor:default}
.wb-tools .wbb.pri{background:var(--xl);border-color:var(--xl);color:#fff}
.wb-tools .wbb.pri:hover:not(:disabled){filter:brightness(1.08);color:#fff}
.wb-tools .wbb.lk{border-color:transparent;background:none;color:#5b6472;font-weight:500;text-decoration:underline;text-underline-offset:2px}
.wb-tabs button.tab.dirty{font-style:italic}
.wb-tabs button.tab.dirty::after{content:"";position:absolute;right:6px;top:8px;width:6px;height:6px;border-radius:50%;background:#e8a100}
.wb-tabs button.tab.on.dirty::after{left:14px;right:14px;top:auto;bottom:6px;width:auto;height:2px;border-radius:2px;background:var(--xl)}
/* 고치기: 바꾼 칸 노랑 · 새 줄 초록 · 고른 줄 파랑 · 입력 중 칸 테두리 */
.wb-grid td[data-r],.wb-grid th[data-r]{cursor:cell}
.wb-grid td.chg,.wb-grid th.chg{background:#fff4c2}
.wb-grid td.nw{background:#e3f4e8}
.wb-grid tr.sel td{background:var(--accent-soft)}
.wb-grid tr.sel td.rn{background:var(--accent);color:#fff}
.wb-grid td.rn[data-row]{cursor:pointer}
.wb-grid .ed{outline:2px solid var(--xl,#107c41);outline-offset:-2px;background:var(--surface)!important;white-space:pre-wrap;max-width:none;overflow:visible;text-overflow:clip;cursor:text}
:root[data-theme="dark"] .wb-grid td.chg,:root[data-theme="dark"] .wb-grid th.chg{background:#4a3f12}:root[data-theme="dark"] .wb-grid td.nw{background:#16301d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wb-grid td.chg,:root:not([data-theme="light"]) .wb-grid th.chg{background:#4a3f12}:root:not([data-theme="light"]) .wb-grid td.nw{background:#16301d}}
:root[data-theme="dark"] .wb-tabs{background:#20252d}:root[data-theme="dark"] .wb-tabs button.tab{color:var(--ink-2)}:root[data-theme="dark"] .wb-tabs button.tab.on{color:#4cc38a}:root[data-theme="dark"] .wb-tabs button.tab.on::after{background:#4cc38a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wb-tabs{background:#20252d}:root:not([data-theme="light"]) .wb-tabs button.tab{color:var(--ink-2)}:root:not([data-theme="light"]) .wb-tabs button.tab.on{color:#4cc38a}:root:not([data-theme="light"]) .wb-tabs button.tab.on::after{background:#4cc38a}}
.main img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;margin:12px 0 4px;cursor:zoom-in}
.main p>em:only-child{display:block;font-size:12.5px;color:var(--ink-3);font-style:normal}
/* 대분류를 고르면 하위 항목을 폴더 모양 카드로 보여 준다(색은 순서대로 돌아가며, 글자는 어두운 색 고정)
   모양: 안쪽 .fd를 clip-path로 폴더(왼쪽 위 탭)로 자르고, 바깥 버튼의 drop-shadow 네 겹으로 테두리를 그린다 */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px 22px;margin-top:22px}
.kid{display:flex;padding:0;border:0;background:none;text-align:left;color:#1d1f23;
  filter:drop-shadow(1px 0 0 #6b6f76) drop-shadow(-1px 0 0 #6b6f76) drop-shadow(0 1px 0 #6b6f76) drop-shadow(0 -1px 0 #6b6f76);transition:transform .15s}
.kid:hover{transform:translateY(-3px)}
.kid:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.kid .fd{flex:1;display:flex;flex-direction:column;min-height:150px;padding:46px 18px 14px;background:var(--f,#e8eef9);
  clip-path:polygon(0 0,40% 0,calc(40% + 18px) 18px,100% 18px,100% 100%,0 100%)}
.kid i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75;line-height:1.4;margin-bottom:2px}
.kid i.fn{text-transform:none;letter-spacing:0;font-weight:600;margin:3px 0 0}
.kid b{display:block;font-size:17px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.kid small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:12.5px;line-height:1.5;opacity:.8;margin-top:6px}
.kid .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:14px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.kid .ft span:last-child{font-size:18px;font-weight:400;letter-spacing:0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.docpath{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 0;font-size:12.5px;color:var(--ink-3)}
.docpath code{padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px}
.docpath span{color:var(--ink-3)}
/* 창 높이에 맞춤(넓은 화면): 왼쪽 목차와 오른쪽 상세를 같은 높이로, 스크롤은 각자 안에서. 높이는 fit()이 --fit으로 정한다 */
.layout.fit{height:var(--fit);align-items:stretch}
.layout.fit .side{position:static;max-height:none;height:100%}
.layout.fit .main{height:100%;overflow:auto;min-height:0}
html.embed.fitted,html.embed.fitted body{overflow:hidden}
/* 화면 정의서(meta.view 'screens'): 왼쪽 메뉴별 화면 목록 · 오른쪽 화면 정보 · 반영 대기 목록 */
:root{--sc-warn:#b35900;--sc-warn-soft:#fff1e0}
:root[data-theme="dark"]{--sc-warn:#f0a24f;--sc-warn-soft:#38270f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sc-warn:#f0a24f;--sc-warn-soft:#38270f}}
.sc-grp>.node .sc-cnt{margin-left:auto;color:var(--ink-3);font-size:12.5px;font-weight:600}
.tree ul.sc-list{border-left:0;margin:2px 0 6px;padding:0}
.sc-it{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:0;background:none;border-radius:9px;padding:9px 12px;color:var(--ink);cursor:pointer}
.sc-it:hover{background:var(--surface-2)}
.sc-it.cur{background:var(--accent-soft)}
.sc-it b{font-size:14.5px;font-weight:700;line-height:1.35}
.sc-it span{font-size:12.5px;color:var(--ink-3)}
.sc-it i{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;font-style:normal}
.sc-chip{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);font-size:11.5px;font-style:normal;font-weight:600;white-space:nowrap}
.sc-chip.warn{background:var(--sc-warn-soft);color:var(--sc-warn)}
.sc-chip.big{font-size:12.5px;padding:3px 10px;border-radius:8px}
.sc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.sc-title{margin:0;font-size:22px;font-weight:800;line-height:1.3}
.sc-sub{margin:4px 0 0!important;color:var(--ink-2);font-size:14px}

/* 직접 수정(2026-11-12): 문서 경로 줄의 [직접 수정] → 원문 편집 칸 */
.dedit{margin-left:auto;height:28px;padding:0 12px;border:1px solid var(--accent);border-radius:7px;background:var(--surface);color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer}
.dedit:hover{background:var(--accent-soft)}

.sec-row .dedit,.sc-head .dedit{margin-left:0;flex:none;margin-top:2px}

.dm-tabs button{height:28px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink-3);font-size:12.5px;font-weight:700;cursor:pointer}

.editor .act{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
:root[data-theme="dark"] .btn.pri{color:#0f1115}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#0f1115}}
/* 가이드 수정 반영: 안내 → 고쳐야 할 화면 → 반영 여부 → 수정 요청 */
.fix{background:var(--surface);border:1px solid #f0c27a;border-radius:12px;padding:14px 18px;margin:0 0 16px;box-shadow:var(--shadow)}
.fix h3{margin:0 0 4px;font-size:15px}
.fix p{margin:4px 0;font-size:13.5px;color:var(--ink-2)}

.fix .steps span{padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.fix .steps span.on{background:#fff1e0;color:#b35900;font-weight:700}
.fix .steps span.ok{background:var(--ok-soft);color:var(--ok)}
.fix ul{list-style:none;margin:8px 0;padding:0;border:1px solid var(--line);border-radius:8px;max-height:340px;overflow:auto}
.fix li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.fix li:last-child{border-bottom:0}
.fix li input{margin-top:3px}
.fix li b{display:block}
.fix li small{display:block;color:var(--ink-3);font-size:12px}
/* 연관 항목 종류 표시: 화면 파랑 · 문서 보라 · 프로토타입 초록 */
.kd{display:inline-block;font-size:11px;font-weight:700;line-height:1.5;padding:0 6px;border-radius:999px;vertical-align:1px}
.kd-screen{background:var(--accent-soft);color:var(--accent)}
.kd-doc{background:#f1eaff;color:#6d3fd6}
.kd-proto{background:var(--ok-soft);color:var(--ok)}
.fix .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fix + .fix{margin-top:-6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:#14171c;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.revs{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.revs li{padding:4px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
.toc-btn{display:none}
/* 끼워 넣기(embed=1): Common UX 가이드 페이지 안에서 보여 줄 때. 상단 메뉴 · 돌아가기 링크를 빼고 여백을 줄인다 */
html.embed body{background:transparent}
html.embed .appnav,html.embed .back,html.embed #title{display:none}
/* 보기만 가능한 계정(UX 문서 · 수정 요청 권한 없음): 수정 요청 · 수정 반영 안내 숨김 */
html.doc-ro #fixes{display:none!important}
/* 머리의 [문서 수정]: 누르면 목차 · 내용 오른쪽에 수정 칸(Claude 답변 + 입력). 보기 전용 계정은 숨김 */
html.doc-ro #editBtn{display:none!important}
#editBtn[aria-expanded="true"]{background:var(--surface);color:var(--accent);border-color:var(--accent)}
#editBtn .nb{display:inline-block;min-width:18px;height:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--warn,#c2410c);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
#editBtn .nb[hidden]{display:none}

.layout.rqm{grid-template-columns:260px minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1280px){ .layout.rqm{grid-template-columns:200px minmax(0,1fr) minmax(0,1fr)} }
.rq{display:flex;flex-direction:column;min-height:420px;background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,12px);box-shadow:var(--shadow);overflow:hidden}
.rq[hidden]{display:none}
.layout.fit .rq{height:100%;min-height:0}
.rq-head{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;min-width:0}
.rq-head b{flex:none;font-size:14.5px;font-weight:800}
.rq-cnt{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--ink-3);font-size:12.5px}

.rq-list{list-style:none;margin:0;padding:4px 2px 8px;display:flex;flex-direction:column;gap:22px}

.rq-list .ai strong{font-weight:700}
.rq-list .ai code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;padding:1px 5px;border-radius:5px;background:var(--surface-2);color:#b4532a}
.rq-list .ai pre{margin:0 0 10px;padding:10px 12px;border-radius:8px;background:var(--surface-2);overflow:auto}
.rq-list .ai pre code{padding:0;background:none;color:inherit}

.rq-list .ai th{background:var(--surface-2);font-weight:700}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rq-list .ai code{color:#f0a37e}}
.rq-empty{color:var(--ink-3);font-size:13px;margin:4px 2px}
/* 수정 칸 안의 입력창: 대상 한 줄 · 글 칸 · 보내기(오른쪽 아래) */
.rq .ask{flex:none;flex-direction:column;gap:6px;margin:0;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;background:var(--surface-2)}

  /* 파일형 문서를 하나로: layout 'files'(기본: 파일 = 대분류) · 'folders'(맨 위 폴더 = 대분류, 파일 = 항목. meta.groups로 폴더 이름 · 순서, 맨 위 파일은 ''). meta.overview 파일은 「개요」로.

  /* 시트 묶음(meta.books, 2026-11-12 — 예: 기준데이터 › 언어셋): {폴더: {title, overview(설명 md), sheets: {csv 경로: 시트 이름}}}.

  function bookOf(m){ var o = {}, B = m.books || {}; Object.keys(B).forEach(function(k){ var b = B[k] || {}; if (b.overview) o[b.overview] = k; Object.keys(b.sheets || {}).forEach(function(p){ o[p] = k; }); }); return o; }

  function combine(m, texts){

  /* 원문을 항목으로 자른다: 맨 위 # 제목(머리말과 겹쳐 빼고 저장 때 그대로 둠) · 「개요」(## 앞 글) · ## 대분류 · ### 항목.

  function tree(q){
    if (SC) { scTree(q); return; }
    var h = '', hit = function(s){ return !q || s.text.indexOf(q) >= 0; };
    function label(t){ var e = esc(t); if (!q) return e; var i = t.toLowerCase().indexOf(q); return i < 0 ? e : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length)); }
    secs.filter(function(s){ return s.level <= 1; }).forEach(function(g){
      var kids = (g.kids || []).filter(hit);
      if (!(hit(g) || kids.length)) return;
      var isOpen = q ? true : open[g.id] !== false && (open[g.id] || (cur && (cur === g || cur.parent === g)));
      h += '<li role="treeitem" aria-expanded="' + (g.kids.length ? !!isOpen : 'false') + '">' +
        '<button type="button" class="node' + (g.level ? ' grp' : '') + (cur === g ? ' cur' : '') + '" data-id="' + g.id + '">' +
        '<span class="tw' + (g.kids.length ? (isOpen ? ' open' : '') : ' none') + '" data-tw="' + g.id + '">▸</span><span class="lbl">' + label(g.label) + '</span></button>';
      if (g.kids.length && isOpen) h += '<ul role="group">' + (q ? kids : g.kids).map(function(k){
        return '<li role="treeitem"><button type="button" class="node' + (cur === k ? ' cur' : '') + '" data-id="' + k.id + '"><span class="tw none"></span><span class="lbl">' + label(k.label) + '</span></button></li>';

    if (s.kids && s.kids.length) {

        var desc = p ? p.textContent.trim().split(/(?<=[.。])\s+/)[0] : '';

    /* 파일형 문서: 이 항목이 들어 있는 깃 문서 경로(예: rule/schedule.md). 마우스를 올리면 지금 내용 파일의 전체 경로 */
    if (isBook) {

    } else if (s.file) {
      var fl = (FILES || []).filter(function(f){ return f.path === s.file; })[0];

  /* ── 직접 수정: [직접 수정] → 지금 글(파일형은 그 파일, 아니면 문서 전체)을 편집 칸으로 열고 저장(POST /api/guides {action:'direct'}) ──
     연 뒤 그사이 다른 사람 · Claude가 고쳤으면 서버가 저장하지 않는다(base 비교). 저장하면 「연관 항목 찾기 요청」 안내가 이어진다 */
  function directEdit(file, name){
    if (editing) return;
    var url = file ? ((FILES || []).filter(function(f){ return f.path === file; })[0] || {}).mdPath : GINFO && (GINFO.mdPath || '');
    if (!url) { toast('고칠 파일을 찾지 못했습니다.'); return; }
    editing = true;
    fetch(url, { cache: 'no-store' }).then(function(r){ if (!r.ok) throw new Error('파일을 읽지 못했습니다(HTTP ' + r.status + ')'); return r.text(); }).then(function(raw){
      var baseText = raw.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n');
      var m = $('main'), head = m.querySelector('.sc-head') || m.querySelector('.sec-row'), ed = document.createElement('section');
      ed.className = 'dm-inplace'; ed.id = 'dmPane'; ed.setAttribute('aria-label', '직접 수정');
      ed.innerHTML = '<div class="dm-tabs" role="tablist"><button type="button" role="tab" aria-selected="true" data-dmtab="src">원문</button><button type="button" role="tab" aria-selected="false" data-dmtab="prev">미리 보기</button>' +
        '<span class="p">' + esc(file ? npath(id + '/' + fdirOf(meta) + file) : '문서 전체(마크다운)') + '</span></div>' +
        '<textarea class="dm-text" id="dmText" spellcheck="false" aria-label="원문"></textarea><div class="dm-prev mdv" id="dmPrev" hidden></div>' +
        '<div class="dm-act"><span class="m" id="dmMsg" role="status">저장하면 바로 반영됩니다. 고칠 화면 · 문서는 저장 뒤 「연관 항목 찾기 요청」으로 맡길 수 있습니다.</span><button type="button" class="btn" id="dmCancel">취소</button><button type="button" class="btn pri" id="dmSave">저장</button></div>';
      // 제목 줄 아래 지금 내용(이전 · 다음, 문서 경로 빼고)을 잠시 가리고 그 자리에 편집 칸
      var hid = [], node = head ? head.nextElementSibling : m.firstElementChild;
      while (node) { if (!node.classList.contains('pager') && !node.classList.contains('docpath') && !node.classList.contains('crumb')) { hid.push(node); } node = node.nextElementSibling; }
      hid.forEach(function(x){ x.dataset.dmhid = x.style.display || ' '; x.style.display = 'none'; });
      if (head) head.insertAdjacentElement('afterend', ed); else m.insertBefore(ed, m.firstChild);
      var bt = m.querySelector('[data-dedit]'); if (bt) bt.disabled = true;
      function restore(){ ed.remove(); hid.forEach(function(x){ x.style.display = x.dataset.dmhid === ' ' ? '' : x.dataset.dmhid; delete x.dataset.dmhid; }); if (bt) bt.disabled = false; }
      var ta = $('dmText'); ta.value = baseText; head && head.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); ta.focus({ preventScroll: true }); ta.setSelectionRange(0, 0); ta.scrollTop = 0;
      ed.querySelector('.dm-tabs').addEventListener('click', function(e){
        var tb = e.target.closest('[data-dmtab]'); if (!tb) return; var prev = tb.dataset.dmtab === 'prev';
        ed.querySelectorAll('[data-dmtab]').forEach(function(x){ x.setAttribute('aria-selected', x === tb ? 'true' : 'false'); });
        ta.hidden = prev; $('dmPrev').hidden = !prev;
        if (prev) { var pv = $('dmPrev'); pv.innerHTML = ''; var bx = render(ta.value.replace(/^---\n[\s\S]*?\n---\n?/, '')); Array.prototype.forEach.call(bx.childNodes, function(x){ pv.appendChild(x.cloneNode(true)); }); } else ta.focus();
      });
      $('dmCancel').onclick = function(){ if (ta.value !== baseText && !confirm('고친 내용을 버릴까요?')) return; editing = false; restore(); };
      ta.addEventListener('keydown', function(e){ if (e.key === 's' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('dmSave').click(); } if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); var s = ta.selectionStart; ta.setRangeText('  ', s, ta.selectionEnd, 'end'); } });

            editing = false; ed.remove();

      };
    }).catch(function(x){ editing = false; toast(x.message || '파일을 읽지 못했습니다.'); });
  }

  /* ── 항목 수정 요청: 무엇을 어떻게 고칠지 글로 적으면 Claude가 가이드를 고친다(guide-edit 작업) ── */

    $('edCancel').onclick = function(){ editing = false; ed.remove(); $('editBtn').disabled = false; };
    $('edSave').onclick = function(){
      var text = $('edText').value.trim();

        .then(function(){ editing = false; show(s.id, true); fixes(); toast('수정 요청을 보냈습니다. Claude가 고치면 입력창 위에 결과가 나옵니다.'); })
        .catch(function(x){ $('edSave').disabled = false; alert(x.message || '요청하지 못했습니다.'); });

    fit();
  }
  $('editBtn').onclick = function(){ rqOpen(!rqOn); };
  $('rqClose').onclick = function(){ rqOpen(false); };
  $('rq').addEventListener('click', function(e){ var b = e.target.closest('[data-rf]'); if (!b) return; rqF = b.dataset.rf; Array.prototype.forEach.call($('rq').querySelectorAll('[data-rf]'), function(x){ x.classList.toggle('on', x === b); }); rqList.done = 0; rqList(); });
  /* 지난 수정 요청(이 문서의 guide-edit, 진행 칸에 없는 것): 요청 글과 Claude 답(note). 「이 항목」은 지금 보는 항목 이름으로 거른다 */
  function rqList(){
    if (!$('rqList')) return;
    var t = askTarget(), shown = {}; edits.forEach(function(j){ shown[j.id] = 1; });
    var L = rqAll.filter(function(j){ return j.kind === 'guide-edit' && !shown[j.id]; });
    if (rqF === 'item') L = L.filter(function(j){ return t && j.name === t.name; });
    L.sort(function(a, b){ return String(a.createdAt || a.updatedAt || '').localeCompare(String(b.createdAt || b.updatedAt || '')); });   // 대화처럼 오래된 것이 위
    $('rqCnt').textContent = (rqF === 'item' ? '이 항목 ' : '문서 전체 ') + (L.length + (rqF === 'item' ? edits.filter(function(j){ return t && j.name === t.name; }).length : edits.length)) + '건';
    var body = $('rqBody'), atEnd = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
    $('rqList').innerHTML = L.length ? L.slice(-40).map(function(j){
      var st = j.status === '확인' ? '완료' : j.status;
      return '<li class="turn"><div class="you">' + (rqF === 'all' && j.name ? '<span class="tg">' + esc(j.name) + '</span>' : '') + esc(j.text || '') + '</div>' +
        '<div class="meta">' + esc([j.by, when(j.createdAt || j.updatedAt).slice(5), j.id, st].filter(Boolean).join(' · ')) + '</div>' +
        (j.note ? '<div class="ai">' + aiHtml(j.note) + '</div>' : '<div class="ai wait">' + esc(st === '완료' ? '(답 없음)' : st) + '</div>') + '</li>';
    }).join('') : ($('fixes').innerHTML ? '' : '<li class="rq-empty" style="border:0;padding:0">' + (rqF === 'item' ? '이 항목에 지난 수정 요청이 없습니다. 아래에 고칠 내용을 적어 보내면 Claude가 고치고 여기에 답이 나옵니다.' : '이 문서에 지난 수정 요청이 없습니다.') + '</li>');
    /* 처음 열 때 · 이미 맨 아래를 보고 있었으면 맨 아래(최신 · 입력창 쪽)로 */
    if (atEnd || !rqList.done) { body.scrollTop = body.scrollHeight; rqList.done = 1; }
  }
  /* Claude 답(note)을 마크다운으로: 줄바꿈은 그대로, 글 속 HTML은 글자로 */
  function aiHtml(t){ try { return marked.parse(String(t).replace(/</g, '&lt;').replace(/~/g, '\\~'), { breaks: true }); } catch(x){ return esc(t).replace(/\n/g, '<br>'); } }
  /* 할 일 수(진행 중 · 결과 확인 대기)를 [문서 수정]에 표시 */
  function rqBadge(){ var n = edits.length + jobs.length, nb = $('editNb'); if (!nb) return; nb.textContent = n; nb.hidden = !n; nb.title = n ? '진행 중이거나 확인할 수정 ' + n + '건' : ''; }
  ['revBox'].forEach(function(pid){
    $('revBtn').onclick = function(){ var on = $(pid).hidden; panel(pid, on); if (on) $(pid).scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
    $(pid).addEventListener('toggle', function(){ if (!this.open && !this.hidden) panel(pid, false); });
  });
  $('main').addEventListener('click', function(e){
    if (SC) {
      var fk = e.target.closest('[data-kind]'); if (fk) { scKind = fk.dataset.kind; scFix(); return; }
      var sc = e.target.closest('[data-sc]'); if (sc) { scShow(sc.dataset.sc); return; }
    }
    if (e.target.closest('[data-edit]')) { edit(); return; }
    var go = e.target.closest('[data-go]'); if (go) { show(go.dataset.go); return; }
    var im = e.target.closest('img'); if (!im || editing) return;
    $('lbImg').src = im.src; $('lbCap').textContent = im.alt || ''; $('lb').classList.add('on');
  });
  /* 검색: 제목 · 내용에 글자가 있는 항목만 트리에 남긴다 */
  $('q').addEventListener('input', function(){ tree(this.value.trim().toLowerCase()); });
  $('tocBtn').onclick = function(){ var f = $('side').classList.toggle('fold'); this.setAttribute('aria-expanded', String(!f)); };
  window.addEventListener('hashchange', function(){ var h = decodeURIComponent(location.hash.slice(1)); if (SC) { h = scFind(h); if (SC.byCid[h] && h !== scCur) scShow(h); return; } h = findSec(h); if (byId[h] && byId[h] !== cur) show(h); });
  /* 주소 #… 로 항목 열기: #s3(항목 번호) · #f=com/POL-COM-001.md(파일) · #POL-COM-001(정책 · 항목 ID) · 화면 정의서는 #LI-INS-01-P(CID) */
  function findSec(h){
    if (!h || byId[h]) return h;
    var f = /^f=(.+)$/.exec(h), s;
    if (f) s = secs.filter(function(x){ return x.file === f[1]; })[0];
    else s = secs.filter(function(x){ return x.level && (String(x.label).indexOf(h + ' ') === 0 || x.label === h || (x.file && x.file.replace(/^.*\//, '') === h + '.md')); })[0];
    return s ? s.id : h;
  }
  function scFind(h){
    if (!h || SC.byCid[h]) return h;
    var f = /^f=(.+)$/.exec(h); if (!f) return h;
    var hit = Object.keys(SC.byCid).filter(function(c){ return SC.byCid[c].file === f[1]; })[0];
    return hit || h;
  }
  /* 문서 안 링크(예: [terms.csv](terms.csv), ../policy/service-mode.md): 그 파일 기준 상대 경로라 보기 화면 주소로는 열리지 않는다.
     → 이 문서의 파일이면 그 항목으로, 다른 UX 문서의 파일이면 그 문서 보기로, 그 밖은 원본 파일을 새 탭으로 */
  $('main').addEventListener('click', function(e){
    var a = e.target.closest('a[href]'); if (!a) return;
    var href = a.getAttribute('href') || '';
    if (/^(https?:|mailto:|#|\/)/i.test(href) || /UX_Guide\.html|Common_UX_Guide\.html|Work\.html/.test(href)) return;
    e.preventDefault();
    var curFile = SC ? (SC.byCid[scCur] && SC.byCid[scCur].file) : bookFile(cur);
    var dir = (id + '/' + fdirOf(meta) + (curFile ? curFile.replace(/[^\/]*$/, '') : ''));
    var target = npath(dir + href.split('#')[0]);   // .history/guides 기준 경로(예: glossary/terms.csv)
    var mine = npath(id + '/' + fdirOf(meta));
    if (FILES && target.indexOf(mine + '/') === 0 || (FILES && !mine)) {
      var rel = mine ? target.slice(mine.length + 1) : target;
      // 이 문서의 파일(문서 폴더 밖 파일은 meta.files의 ../ 경로와 맞춘다)
      var fp = (FILES || []).filter(function(x){ return x.path === rel || npath(mine + '/' + x.path) === target; })[0];
      if (fp) { location.hash = 'f=' + fp.path; return; }
    }
    if (FILES) { var up = (FILES || []).filter(function(x){ return npath(id + '/' + fdirOf(meta) + x.path) === target; })[0]; if (up) { location.hash = 'f=' + up.path; return; } }
    var seg = target.split('/')[0], rest = target.slice(seg.length + 1);
    if (['rules', 'policy', 'glossary', 'screens'].indexOf(seg) >= 0 && seg !== id && rest) { location.href = 'UX_Guide.html?g=' + seg + (document.documentElement.classList.contains('embed') ? '&embed=1' : '') + '#f=' + encodeURIComponent(rest); return; }
    if (target === 'constitution.md') { location.href = 'UX_Guide.html?g=rules' + (document.documentElement.classList.contains('embed') ? '&embed=1' : '') + '#f=' + encodeURIComponent('../constitution.md'); return; }
    window.open('.history/guides/' + target, '_blank', 'noopener');
  });
  window.addEventListener('beforeunload', function(e){ if (editing) { e.preventDefault(); e.returnValue = ''; } });
  function closeLb(){ $('lb').classList.remove('on'); $('lbImg').removeAttribute('src'); }
  $('lbClose').onclick = closeLb;
  $('lb').addEventListener('click', function(e){ if (e.target === this) closeLb(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeLb(); });
})();
</script>
<script src="appnav.js" defer></script>
</body>
